<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<title>Mon année L1 Droit</title>
<meta name="theme-color" content="#23408e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="L1 Droit">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Plan : bleu encre « amphi » sur papier froid, laiton pour les échéances, violet pour les J.
   Layout : barre latérale de navigation + espace de travail en grille ; barre d'onglets en bas sur mobile. */
:root{
  --bg:#f3f4f8; --surface:#ffffff; --surface-2:#f7f8fb; --ink:#141a2e; --muted:#5b6379; --line:#dde1eb;
  --accent:#23408e; --accent-ink:#ffffff; --accent-soft:#e7ecf8; --brass:#9c6f1f; --brass-soft:#f6eedf;
  --ok:#1d7a4b; --ok-soft:#e3f3ea; --warn:#a85f00; --warn-soft:#fbefdc; --bad:#b3261e; --bad-soft:#fbe7e5;
  --jv:#6d4fd8; --jv-soft:#eeeafd;
  --font-display:"Newsreader", Georgia, "Times New Roman", serif;
  --font-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius:10px; --shadow:0 1px 2px rgba(20,26,46,.06),0 4px 16px rgba(20,26,46,.05);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1120; --surface:#161a2b; --surface-2:#1b2034; --ink:#e7e9f3; --muted:#9aa1b9; --line:#2a3049;
    --accent:#8fa8ff; --accent-ink:#0e1120; --accent-soft:#1e2950; --brass:#d8ab5c; --brass-soft:#2e2717;
    --ok:#5fcf93; --ok-soft:#173326; --warn:#f0a94a; --warn-soft:#33260f; --bad:#ff8a80; --bad-soft:#3a1c1b;
    --jv:#b4a2ff; --jv-soft:#272042; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1120; --surface:#161a2b; --surface-2:#1b2034; --ink:#e7e9f3; --muted:#9aa1b9; --line:#2a3049;
  --accent:#8fa8ff; --accent-ink:#0e1120; --accent-soft:#1e2950; --brass:#d8ab5c; --brass-soft:#2e2717;
  --ok:#5fcf93; --ok-soft:#173326; --warn:#f0a94a; --warn-soft:#33260f; --bad:#ff8a80; --bad-soft:#3a1c1b;
  --jv:#b4a2ff; --jv-soft:#272042; --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.15} h2{font-size:21px} h3{font-size:17px}
p{margin:0} a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:13px}
[hidden]{display:none!important}
.app{display:grid;grid-template-columns:240px 1fr;height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:2px;overflow-y:auto}
.brand{padding:4px 10px 14px;display:flex;flex-direction:column;gap:2px}
.brand b{font-family:var(--font-display);font-size:20px;font-weight:600}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;color:var(--muted);font-weight:500;width:100%}
.nav svg{width:18px;height:18px;flex:none}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav .badge{margin-left:auto} .nav .s{display:none}
.side-foot{margin-top:auto;padding:12px 4px 0;display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)}
.me{display:flex;align-items:center;gap:10px;padding:4px 6px}
.me .t{min-width:0;flex:1}.me b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me span{font-size:12px;color:var(--muted)}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;flex:none;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:14px;overflow:hidden}
.avatar.lg{width:84px;height:84px;font-size:28px}
.main{overflow-y:auto;padding:28px clamp(16px,3vw,40px) 60px}
.wrap{max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head p{color:var(--muted);margin-top:4px;max-width:70ch}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))} .g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.flat{background:var(--surface-2)}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.tile .big{font-family:var(--font-display);font-size:34px;font-weight:600;line-height:1}
.tile .lbl{font-size:13px;color:var(--muted)}
.tile.hero{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tile.hero .lbl{color:inherit;opacity:.8}
.tile.jt{background:var(--jv-soft);border-color:transparent}.tile.jt .big{color:var(--jv)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap} .sp{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;text-decoration:none;color:inherit}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)} .btn.pri:hover{filter:brightness(1.08)}
.btn.jv{background:var(--jv);border-color:var(--jv);color:#fff}
.btn.ghost{border-color:transparent;background:none} .btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:4px 9px;font-size:13px} .btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed} .btn svg{width:16px;height:16px}
.icon-btn{border:0;background:none;padding:5px;border-radius:6px;cursor:pointer;color:var(--muted);display:inline-flex}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)} .icon-btn svg{width:16px;height:16px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],input[type=time],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
textarea{width:100%;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea{color:var(--ink);font-weight:400;font-size:15px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:500;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap}
a.chip{text-decoration:none;color:inherit}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)} .pill.brass{background:var(--brass-soft);color:var(--brass)} .pill.j{background:var(--jv-soft);color:var(--jv)}
.badge{background:var(--jv);color:#fff;border-radius:999px;font-size:11px;font-weight:600;padding:0 7px;line-height:18px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0} .li .t b{font-weight:500;display:block;overflow-wrap:anywhere} .li .t span{font-size:13px;color:var(--muted)}
.date-box{width:46px;flex:none;text-align:center;border:1px solid var(--line);border-radius:8px;padding:3px 0;line-height:1.1}
.date-box b{display:block;font-family:var(--font-display);font-size:19px}
.date-box span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.check{appearance:none;width:18px;height:18px;border:1.5px solid var(--muted);border-radius:5px;cursor:pointer;flex:none;display:grid;place-content:center;margin:0;background:var(--surface)}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:9px;height:5px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.done .t b{text-decoration:line-through;color:var(--muted)}
.bar{height:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .4s ease}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--radius);display:flex;flex-direction:column;gap:10px;align-items:center}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:0 6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--ok)} .sync.saving i{background:var(--warn)} .sync.err i{background:var(--bad)}
table{border-collapse:collapse;width:100%}
th,td{padding:8px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.scroll-x{overflow-x:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:3px;background:var(--surface-2);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-weight:500;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:8px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.tabs svg{width:16px;height:16px}
/* Audios */
.audio{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:500}
.audio svg{width:12px;height:12px}
.audio[aria-pressed="true"]{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.stage{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:12.5px;cursor:pointer;color:var(--muted);font-weight:500}
.stage[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.course{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.course:first-of-type{border-top:0}
.course .ti{font-weight:500;overflow-wrap:anywhere}
.course .meta{font-size:12.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.course .acts{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.course .aud{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
/* Calendrier */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);border-radius:8px;overflow:hidden}
.cal .dh{font-size:12px;color:var(--muted);font-weight:600;padding:6px 8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface-2);text-transform:uppercase;letter-spacing:.04em}
.cal .d{min-height:104px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px;display:flex;flex-direction:column;gap:3px;cursor:pointer;background:var(--surface);min-width:0}
.cal .d:hover{background:var(--surface-2)}
.cal .d.out{background:var(--surface-2);color:var(--muted)}
.cal .d.sel{outline:2px solid var(--accent);outline-offset:-2px}
.cal .d .n{font-size:13px;font-weight:600}
.cal .d.today .n{background:var(--accent);color:var(--accent-ink);border-radius:999px;width:24px;height:24px;display:grid;place-items:center}
.cal .d.exam{background:var(--bad-soft)}
.ev{font-size:11.5px;line-height:1.35;padding:1px 5px 1px 3px;border-radius:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-left:3px solid var(--tc);background:color-mix(in srgb,var(--tc) 14%,var(--surface));cursor:pointer;display:block}
.ev:hover{background:color-mix(in srgb,var(--tc) 26%,var(--surface))}
.ev b{font-weight:700;color:var(--tc);margin-right:3px;font-size:10.5px}
.ev.done{opacity:.5;text-decoration:line-through}
.more{font-size:11px;color:var(--muted)}
.tag{display:inline-grid;place-items:center;min-width:22px;height:20px;padding:0 5px;border-radius:5px;font-size:11px;font-weight:700;color:#fff;background:var(--tc);flex:none}
.li .t .tag{color:#fff;font-size:11px}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend .chip{gap:6px}
.weekcols{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.weekcols .col{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px;min-height:180px;display:flex;flex-direction:column;gap:5px;min-width:0}
.weekcols .col.today{border-color:var(--accent)}
.weekcols .col h4{margin:0 0 4px;font-size:13px;text-transform:capitalize}
.weekcols .ev{white-space:normal}
/* Semainier */
.weeks{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.week{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.week.now{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.week.late{border-color:var(--warn)}
.week.rev{background:var(--jv-soft);border-color:transparent}
.week.drop{outline:2px dashed var(--accent);outline-offset:2px}
.week .wl{font-family:var(--font-display);font-size:18px;font-weight:600}
.wc{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:7px;background:var(--surface-2);cursor:grab;min-width:0}
.wc .t{flex:1;min-width:0;font-size:14px}
.wc .t b{font-weight:500;display:block;overflow-wrap:anywhere}
.wc .t span{font-size:12px;color:var(--muted)}
.wc.done .t b{text-decoration:line-through;color:var(--muted)}
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(56px,1fr));gap:6px;align-items:end}
.overview button{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:4px;align-items:center;font-size:11px;color:var(--muted)}
.overview .col{width:100%;height:84px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column-reverse;overflow:hidden}
.overview .col i{display:block;width:100%}
.overview .now .col{border-color:var(--accent);border-width:2px}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(10,14,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:50;overflow-y:auto}
.modal{background:var(--surface);border-radius:14px;width:min(560px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;animation:pop .16s ease}
@keyframes pop{from{transform:translateY(8px);opacity:.6}to{transform:none;opacity:1}}
.modal.wide{width:min(900px,100%)}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);gap:10px}
.modal-b{padding:18px;display:flex;flex-direction:column;gap:14px}
.modal-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:9px 16px;border-radius:8px;font-size:14px;z-index:60;box-shadow:var(--shadow);max-width:90vw}
/* Markdown */
.md{line-height:1.6;overflow-wrap:anywhere}
.md h3{font-size:21px;margin:6px 0 8px}.md h4{font-family:var(--font-display);font-size:17px;margin:14px 0 6px}.md h5{font-size:14.5px;margin:10px 0 4px}
.md ul,.md ol{margin:6px 0;padding-left:22px}.md li{margin:2px 0}
.md p+p{margin-top:8px}
.md code{font-family:var(--font-mono);font-size:13px;background:var(--surface-2);padding:1px 4px;border-radius:4px}
.md table{margin:8px 0;font-size:14px;border:1px solid var(--line)}.md th,.md td{border:1px solid var(--line);vertical-align:top}.md th{background:var(--surface-2);text-transform:none;letter-spacing:0;color:var(--ink);font-size:13.5px}
.md .tw{overflow-x:auto}
.ai-out{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
/* Chat */
.chat{display:flex;flex-direction:column;gap:14px;min-height:300px}
.msg{max-width:min(760px,92%);padding:11px 14px;border-radius:12px;line-height:1.6;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.composer{position:sticky;bottom:0;background:var(--bg);padding-top:10px;display:flex;gap:8px;align-items:flex-end}
.composer textarea{min-height:46px;max-height:200px}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;text-align:left}
.sugg button:hover{border-color:var(--accent);color:var(--accent)}
/* Flashcards */
.flash{min-height:230px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;font-size:19px;line-height:1.5;cursor:pointer;font-family:var(--font-display);white-space:pre-wrap}
.flash.back{background:var(--accent-soft)}
.boxes{display:flex;gap:6px}.boxes div{flex:1;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px 0}
.boxes b{display:block;font-family:var(--font-mono)}.boxes span{font-size:11px;color:var(--muted)}
/* QCM */
.q{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.q .qt{font-weight:500}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px;cursor:pointer;width:100%}
.opt:hover{border-color:var(--accent)}
.opt b{font-family:var(--font-mono);color:var(--muted)}
.opt.good{background:var(--ok-soft);border-color:var(--ok)} .opt.bad{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}

let S={};const T={};const FICHE={};
function seedCourses(){return COURSES_SEED.map(([subject,title,mins,week],i)=>({id:"c"+i,subject,title,week,audios:mins.map(m=>({min:m,done:false})),pdf:false,redige:false,order:i}))}

function fillDefaults(){
  const d=defaults();for(const k of KEYS){if(S[k]===undefined||S[k]===null)S[k]=d[k]}
  S.settings={...d.settings,...S.settings};
  S.subjects.forEach(s=>{if(s.major===undefined)s.major=(s.id==="constit"||s.id==="prive");if(s.id==="constit"&&s.name==="Droit constitutionnel")s.name="Droit constitutionnel 1";if(s.id==="constit"&&s.short==="Droit constit.")s.short="Droit constit. 1"});

      S.chapters.forEach(ch=>{const c={id:ch.id,subject:ch.subject,title:ch.title,week:"",audios:[{min:+ch.minutes||0,done:!!ch.audio}],pdf:!!ch.pdf,redige:!!ch.redige,order:Date.now()};S.courses.push(c);

let db=null,userId=null,assetsApi=null,sampleApi=null,syncState="local";
const timers={},writing={},again={};
function save(k){
  T[k]=Date.now();
  try{localStorage.setItem(LS+k,JSON.stringify({v:S[k],t:T[k]}))}catch(e){}
  if(!db)return;clearTimeout(timers[k]);timers[k]=setTimeout(()=>flush(k),700);
}
function saveFiche(id){const k="fiche:"+id;T[k]=Date.now();try{localStorage.setItem(LS+k,JSON.stringify({v:FICHE[id],t:T[k]}))}catch(e){}if(db){clearTimeout(timers[k]);timers[k]=setTimeout(()=>flush(k),900)}}
function dropFiche(id){const k="fiche:"+id;delete FICHE[id];try{localStorage.removeItem(LS+k)}catch(e){}if(db)db.collection("data/users/"+userId).doc(k).delete().catch(()=>{})}
async function flush(k){
  if(writing[k]){again[k]=true;return}
  writing[k]=true;setSync("saving");
  const v=k.startsWith("fiche:")?FICHE[k.slice(6)]:S[k];
  try{if(v!==undefined)await db.collection("data/users/"+userId).doc(k).set({v,t:T[k]});setSync("ok")}
  catch(e){setSync("err");if(e&&e.code==="quota_exceeded")toast("Espace de sauvegarde plein : supprime d’anciennes fiches ou conversations.");else if(e&&e.code==="unavailable")setTimeout(()=>flush(k),1500+Math.random()*1500)}
  writing[k]=false;if(again[k]){again[k]=false;flush(k)}
}
function setSync(s){syncState=s;const el=$("#sync");if(el){el.className="sync "+s;el.innerHTML="<i></i>"+({local:"Sauvegarde sur cet appareil",ok:"Synchronisé avec ton compte",saving:"Enregistrement…",err:"Erreur de synchro, nouvel essai"}[s])}}
function loadLocal(){
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k.startsWith(LS))continue;const key=k.slice(LS.length);try{const o=JSON.parse(localStorage.getItem(k));if(!o||typeof o!=="object"||!("v" in o))continue;if(key.startsWith("fiche:"))FICHE[key.slice(6)]=o.v;else S[key]=o.v;T[key]=o.t||0}catch(e){}}}catch(e){}
  fillDefaults();
}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),ms))]);
async function initCloud(){
  const C=window.claude;if(!C||typeof C.use!=="function"){setSync("local");return}
  C.use("sample").then(s=>{sampleApi=s;if(s&&appOn)render()}).catch(()=>{});
  C.use("assets").then(a=>{assetsApi=a}).catch(()=>{});
  try{
    const [d,u]=await withTimeout(Promise.all([C.use("db"),C.use("user")]),11000);
    if(!d||!u){setSync("local");return}
    const id=await u.id();if(!id){setSync("local");return}
    const snap=await withTimeout(d.collection("data/users/"+id).get(),10000);
    db=d;userId=id;
    const remote={};snap.docs.forEach(doc=>{if(doc.exists)remote[doc.id]=doc.data()});
    const all=new Set([...Object.keys(remote),...Object.keys(T)]);
    for(const k of all){
      const r=remote[k];
      if(r&&(r.t||0)>=(T[k]||0)){
        if(k.startsWith("fiche:"))FICHE[k.slice(6)]=r.v;else S[k]=r.v;T[k]=r.t;
        try{localStorage.setItem(LS+k,JSON.stringify(r))}catch(e){}
      }else if(T[k]&&(KEYS.includes(k)||k.startsWith("fiche:")))flush(k);
    }
    fillDefaults();setSync("ok");
  }catch(e){setSync("local")}
}

function jPending(){const out=[];for(const [cid,p] of Object.entries(S.jplans)){const c=course(cid);if(!c)continue;p.reviews.forEach(r=>{if(r.status!=="done")out.push({c,p,r})})}return out}
function jToday(){const t=today();const seen=new Set();return jPending().sort((a,b)=>a.r.date.localeCompare(b.r.date)||(subj(b.c.subject).major?1:0)-(subj(a.c.subject).major?1:0)).filter(x=>{if(x.r.date>t||seen.has(x.c.id))return false;seen.add(x.c.id);return true})}
function jLoad(d){let n=0;for(const p of Object.values(S.jplans))for(const r of p.reviews)if(r.status!=="done"&&r.date===d)n++;return n}
function jDoneToday(){const t=today();let n=0;for(const p of Object.values(S.jplans))for(const r of p.reviews)if(r.status==="done"&&r.doneDate===t)n++;return n}
function buildPlan(cid,j0){
  const st=S.settings,last=addDays(st.examStart,-1),cap=+st.jcap||6;
  delete S.jplans[cid];
  const reviews=[];
  for(const n of st.jseq){
    let d=addDays(j0,n);if(d>last)break;
    if(n>=3&&jLoad(d)>=cap){for(const k of [1,-1,2,-2,3]){const dd=addDays(d,k);if(dd>today()&&dd<=last&&jLoad(dd)<cap){d=dd;break}}}
    reviews.push({id:uid(),label:"J"+n,date:d,status:"todo"});
  }
  if(st.jfinal){
    const rs=addDays(st.examStart,-(+st.margin||14));const lastD=reviews.length?reviews[reviews.length-1].date:j0;
    if(lastD<rs&&last>=rs){let best=null,bl=1e9;for(let d=rs>today()?rs:addDays(today(),1);d<=last;d=addDays(d,1)){const l=jLoad(d);if(l<bl){bl=l;best=d}}if(best)reviews.push({id:uid(),label:"JF",date:best,status:"todo",final:true})}
  }
  S.jplans[cid]={start:j0,reviews};save("jplans");
}
function rateJ(cid,rid,res){
  const p=S.jplans[cid];if(!p)return;const i=p.reviews.findIndex(r=>r.id===rid);const r=p.reviews[i];if(!r)return;
  const delay=Math.max(0,diffDays(r.date,today()));
  r.status="done";r.result=res;r.doneDate=today();
  if(delay>0)p.reviews.slice(i+1).forEach(x=>{if(x.status!=="done"&&!x.final){x.date=addDays(x.date,delay);if(x.date>=S.settings.examStart)x.date=addDays(S.settings.examStart,-1)}});
  p.reviews.sort((a,b)=>a.status==="done"&&b.status!=="done"?-1:b.status==="done"&&a.status!=="done"?1:(a.status==="done"?(a.doneDate||"").localeCompare(b.doneDate||""):a.date.localeCompare(b.date)));
  const ni=p.reviews.indexOf(r);
  const next=p.reviews.slice(ni+1).find(x=>x.status!=="done");
  if(res==="r"){p.reviews.splice(ni+1,0,{id:uid(),label:r.label.replace(/·bis$/,"")+"·bis",date:addDays(today(),1),status:"todo",extra:true})}
  else if(res==="o"&&next&&!next.final){const gap=diffDays(today(),next.date);if(gap>1)next.date=addDays(today(),Math.max(1,Math.ceil(gap/2)))}
  save("jplans");
}

    <div class="card tile jt"><span class="lbl">J à faire aujourd’hui</span><span class="big num">${jt.length}</span><button class="btn sm jv" data-go="j" style="align-self:flex-start">Méthode des J</button></div>
    <div class="card tile"><span class="lbl">Audios écoutés</span><span class="big num">${Math.round(tot.pct*100)} %</span><div class="bar"><i style="width:${tot.pct*100}%;background:var(--accent)"></i></div><span class="lbl">${fmtMin(tot.done)} sur ${fmtMin(tot.tot)}</span></div>
    <div class="card tile"><span class="lbl">Temps d’étude, 7 derniers jours</span><span class="big num">${fmtMin(weekMinutes())}</span><button class="btn sm" data-go="minuteur" style="align-self:flex-start">Lancer une session</button></div>
  </div>
  ${quickCard()}
  ${depotCard(true)}
  ${overdue.length?`<div class="card" style="border-color:var(--bad);background:var(--bad-soft)"><h3 style="color:var(--bad)">En retard (${overdue.length})</h3><div class="list">${overdue.slice(0,5).map(e=>eventLine(e)).join("")}</div></div>`:""}
  <div class="grid g2">
    <div class="card"><div class="card-h"><h2>Cette semaine${w?` · ${esc(weekName(w))}`:""}</h2><button class="btn ghost sm" data-go="semainier">Semainier</button></div>
      ${wc.length?`<div class="list">${wc.map(c=>`<div class="li ${cComplete(c)?"done":""}"><input type="checkbox" class="check" data-act="courseAll" data-id="${c.id}" ${cComplete(c)?"checked":""} aria-label="Tous les audios écoutés"><span class="dot" style="background:${subj(c.subject).color}"></span><div class="t"><b>${esc(c.title)}</b><span>${esc(subj(c.subject).short)} · ${c.audios.length} audio${c.audios.length>1?"s":""} · ${fmtMin(cMin(c))}</span></div>${S.jplans[c.id]?`<span class="pill j">J lancé</span>`:""}</div>`).join("")}</div>`:`<p class="muted small">${w&&w.id==="rev"?"Période de révisions : place aux J et aux annales.":"Aucun cours prévu cette semaine dans le semainier."}</p>`}
      <p class="small muted">${p.left>0?`Rythme pour finir le ${fd(p.target,{day:"numeric",month:"long"})} : <b>${fmtMin(p.perDay)}</b> d’audio par jour (${fmtMin(p.left)} restants).`:"Tous les audios sont écoutés."}</p></div>
    <div class="card"><div class="card-h"><h2>J du jour</h2><button class="btn ghost sm" data-go="j">Tout voir</button></div>
      ${jt.length?`<div class="list">${jt.slice(0,6).map(x=>`<div class="li"><span class="jlabel ${x.r.date<t?"late":""}" style="width:46px;padding:3px 0;font-size:12.5px">${esc(x.r.label)}</span><div class="t"><b>${esc(x.c.title)}</b><span>${esc(subj(x.c.subject).short)}${x.r.date<t?" · en retard":""}</span></div></div>`).join("")}</div>`:`<p class="muted small">${Object.keys(S.jplans).length?"Rien à revoir aujourd’hui.":"Aucun J lancé. Termine les audios d’un cours ou lance-les depuis « Méthode des J »."}</p>`}</div>
  </div>
  <div class="grid g2">
    <div class="card"><div class="card-h"><h2>Prochaines échéances</h2><button class="btn ghost sm" data-go="agenda">Agenda</button></div>
      <div class="list">${ev.length?ev.map(e=>eventLine(e)).join(""):`<div class="empty">Rien dans les 3 prochaines semaines.</div>`}</div></div>
    <div class="card"><div class="card-h"><h2>À faire</h2><button class="btn ghost sm" data-act="newTask">${ic("plus")}Ajouter</button></div>
      <form class="row nowrap" data-form="quickTask"><input type="text" id="qt" placeholder="Ex. : relire la séance sur l’État" style="flex:1" aria-label="Nouvelle tâche"><button class="btn">Ajouter</button></form>
      <div class="list">${tasks.length?tasks.map(taskLine).join(""):`<div class="empty">Aucune tâche en cours.</div>`}</div>
      <form class="row nowrap" data-form="quickAsk" style="margin-top:auto"><input type="text" id="qa" placeholder="Demande à l’assistant IA…" style="flex:1" aria-label="Question à l’assistant"><button class="btn pri">${ic("spark")}Demander</button></form></div>
  </div>
  <div class="card"><div class="card-h"><h2>Avancement par matière</h2><button class="btn ghost sm" data-go="cours">Mes cours</button></div>
    <div class="grid g2" style="gap:4px 24px">${S.subjects.map(s=>{const l=S.courses.filter(c=>c.subject===s.id);const r=totals(l);return `<div class="li"><span class="dot" style="background:${s.color}"></span><div class="t"><b>${esc(s.short)} ${majPill(s)}</b><span>${l.length?`${l.filter(cComplete).length}/${l.length} cours écoutés · ${l.filter(c=>fichesOf(c.id).length).length} fichés`:"Aucun cours"}</span></div><div style="width:min(140px,35%)"><div class="bar"><i style="width:${r.pct*100}%;background:${s.color}"></i></div></div><span class="num small" style="width:38px;text-align:right">${Math.round(r.pct*100)}%</span></div>`}).join("")}</div></div>`;
};
function taskLine(t){const s=subj(t.subject);const late=t.due&&t.due<today()&&!t.done;
  return `<div class="li ${t.done?"done":""}"><input type="checkbox" class="check" data-act="toggleTask" data-id="${t.id}" ${t.done?"checked":""} aria-label="Terminer la tâche"><div class="t"><b>${esc(t.title)}</b><span>${t.subject?`<span class="dot" style="background:${s.color}"></span> ${esc(s.short)}`:"Général"}${t.due?` · ${late?'<span style="color:var(--bad)">':""}pour ${fd(t.due)}${late?"</span>":""}`:""}</span></div><button class="icon-btn" data-act="editTask" data-id="${t.id}" aria-label="Modifier">${ic("edit")}</button></div>`}

/* ---- Agenda ---- */
function calEvents(){const hiddenT=UI.calTypes;return allEvents().filter(e=>(!UI.calFilter||e.subject===UI.calFilter)&&!hiddenT[e.type])}
const evChip=e=>`<span class="ev ${e.done?"done":""}" style="--tc:${(TYPES[e.type]||TYPES.perso).c}" data-act="openEvent" data-id="${esc(e.id)}" title="${esc((TYPES[e.type]||{}).l+" · "+e.title)}"><b>${(TYPES[e.type]||TYPES.perso).s}</b>${e.start?e.start.replace(":","h")+" ":""}${esc(e.title)}</span>`;
VIEWS.agenda=()=>{
  if(!UI.calMonth)UI.calMonth=today().slice(0,7);
  const ev=calEvents();const t=today();
  const legend=`<div class="legend">${Object.entries(TYPES).map(([k,v])=>`<button class="chip" data-act="calType" data-v="${k}" aria-pressed="${!UI.calTypes[k]}" style="${UI.calTypes[k]?"opacity:.5":""}"><span class="tag" style="--tc:${v.c}">${v.s}</span>${v.l}</button>`).join("")}</div>`;
  let body="";
  if(UI.calView==="mois"){
    const [y,m]=UI.calMonth.split("-").map(Number);const first=new Date(y,m-1,1);const startOff=(first.getDay()+6)%7;
    let cells="";["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].forEach(d=>cells+=`<div class="dh">${d}</div>`);
    for(let i=0;i<42;i++){
      const d=new Date(y,m-1,1-startOff+i);const ds=ymd(d);
      const list=ev.filter(e=>evOn(e,ds));const exam=list.some(e=>e.type==="examen");
      cells+=`<div class="d ${d.getMonth()!==m-1?"out":""} ${ds===t?"today":""} ${ds===UI.calSel?"sel":""} ${exam?"exam":""}" data-act="calDay" data-v="${ds}" role="button" tabindex="0" aria-label="${fd(ds,{weekday:"long",day:"numeric",month:"long"})}, ${list.length} élément(s)"><span class="n">${d.getDate()}</span>${list.slice(0,4).map(evChip).join("")}${list.length>4?`<span class="more">+${list.length-4}</span>`:""}</div>`;
      if(i===34&&new Date(y,m-1,1-startOff+35).getMonth()!==m-1)break;
    }
    body=`<div class="card-h"><button class="icon-btn" data-act="calPrev" aria-label="Précédent">${ic("left")}</button><h2 style="text-transform:capitalize">${first.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}</h2><div class="row"><button class="btn sm" data-act="calToday">Aujourd’hui</button><button class="icon-btn" data-act="calNext" aria-label="Suivant">${ic("right")}</button></div></div><div class="cal">${cells}</div>`;
  }else{
    const sel=parse(UI.calSel);const mon=addDays(UI.calSel,-((sel.getDay()+6)%7));
    const days=[...Array(7)].map((_,i)=>addDays(mon,i));
    body=`<div class="card-h"><button class="icon-btn" data-act="weekPrev" aria-label="Semaine précédente">${ic("left")}</button><h2>Semaine du ${fd(mon,{day:"numeric",month:"long"})}</h2><div class="row"><button class="btn sm" data-act="calToday">Aujourd’hui</button><button class="icon-btn" data-act="weekNext" aria-label="Semaine suivante">${ic("right")}</button></div></div>
    <div class="weekcols">${days.map(d=>{const l=ev.filter(e=>evOn(e,d));return `<div class="col ${d===t?"today":""}"><h4>${fd(d,{weekday:"long",day:"numeric"})}</h4>${l.map(evChip).join("")}<button class="btn ghost sm" data-act="newEvent" data-date="${d}" style="margin-top:auto">${ic("plus")}Ajouter</button></div>`}).join("")}</div>`;
  }
  const dayList=ev.filter(e=>evOn(e,UI.calSel));
  const upcoming=ev.filter(e=>!e.done&&e.type!=="j"&&(e.endDate||e.date)>=t).slice(0,10);
  return `
  <div class="head"><div><h1>Agenda</h1><p>Clique sur un élément pour le modifier, sur un jour pour y ajouter quelque chose. Les dates IED viennent de tes annonces : vérifie-les sur l’EPI.</p></div>
    <div class="row"><div class="seg" role="group" aria-label="Vue">${[["mois","Mois"],["semaine","Semaine"]].map(([k,l])=>`<button data-act="calView" data-v="${k}" aria-pressed="${UI.calView===k}">${l}</button>`).join("")}</div><button class="btn" data-act="icsMenu">Importer / exporter</button><button class="btn pri" data-act="newEvent">${ic("plus")}Événement</button></div></div>
  ${legend}
  ${subjectChips(UI.calFilter,"calFilter")}
  <div class="grid agenda-grid">
    <div class="card">${body}</div>
    <div class="grid">
      <div class="card"><div class="card-h"><h3 style="text-transform:capitalize">${fd(UI.calSel,{weekday:"long",day:"numeric",month:"long"})}</h3><button class="btn sm" data-act="newEvent" data-date="${UI.calSel}">${ic("plus")}Ajouter</button></div>
        <div class="list">${dayList.length?dayList.map(e=>eventLine(e,false)).join(""):`<p class="muted small">Rien de prévu ce jour.</p>`}</div></div>
      <div class="card"><h3>À venir</h3><div class="list">${upcoming.map(e=>eventLine(e)).join("")||`<p class="muted small">Rien à venir.</p>`}</div></div>
    </div>
  </div>`;
};

/* ---- Semainier ---- */
VIEWS.semainier=()=>{
  const t=today();const cur=weekOf(t);
  const max=Math.max(60,...S.weeks.map(w=>S.courses.filter(c=>c.week===w.id).reduce((a,c)=>a+cMin(c),0)));
  const unplanned=S.courses.filter(c=>!c.week||!weekById(c.week));
  return `
  <div class="head"><div><h1>Semainier</h1><p>Le planning des audios établi ensemble jusqu’au 13 décembre, puis trois semaines de révisions avant les partiels. Glisse un cours d’une semaine à l’autre (ou utilise le menu) pour le déplacer.</p></div>
    <div class="row"><button class="btn" data-act="addWeek">${ic("plus")}Semaine</button><button class="btn pri" data-act="newCourse">${ic("plus")}Cours</button></div></div>
  <div class="card"><div class="card-h"><h3>Charge par semaine</h3><span class="small muted">En couleur : écouté · en gris clair : restant</span></div>
    <div class="overview">${S.weeks.map(w=>{const l=S.courses.filter(c=>c.week===w.id);const tt=totals(l);return `<button data-act="scrollWeek" data-id="${w.id}" class="${cur&&cur.id===w.id?"now":""}" title="${esc(weekName(w))} : ${fmtMin(tt.tot)}"><div class="col"><i style="height:${tt.done/max*100}%;background:var(--accent)"></i><i style="height:${(tt.tot-tt.done)/max*100}%;background:var(--accent-soft)"></i></div><span>${w.label?esc(w.label.slice(0,4))+".":"S"+(S.weeks.filter(x=>!x.label).indexOf(w)+1)}</span><span class="num">${tt.tot?Math.round(tt.tot/60*10)/10+"h":"–"}</span></button>`}).join("")}</div></div>
  ${unplanned.length?`<div class="card" style="border-color:var(--warn)"><h3>Cours non planifiés (${unplanned.length})</h3><div class="grid" style="gap:6px">${unplanned.map(wcLine).join("")}</div></div>`:""}
  <div class="weeks">${S.weeks.map(w=>{
    const l=S.courses.filter(c=>c.week===w.id);const tt=totals(l);const past=w.end<t;const now=cur&&cur.id===w.id;
    const late=past&&l.some(c=>!cComplete(c));
    const evs=allEvents({j:false}).filter(e=>e.date>=w.start&&e.date<=w.end&&["regroupement","devoir","permanence","examen"].includes(e.type));
    const jn=jPending().filter(x=>x.r.date>=w.start&&x.r.date<=w.end).length;
    return `<section class="week ${now?"now":""} ${late?"late":""} ${w.id==="rev"||w.label==="Révisions"?"rev":""}" id="wk-${w.id}" data-week="${w.id}">
      <div class="card-h"><div><div class="wl">${esc(weekName(w))}${now?` <span class="pill info">en cours</span>`:""}${late?` <span class="pill warn">en retard</span>`:""}</div><div class="small muted">${fd(w.start,{day:"numeric",month:"short"})} → ${fd(w.end,{day:"numeric",month:"short"})} · ${fmtMin(tt.tot)}${tt.tot?` · ${Math.round(tt.pct*100)} % écouté`:""}</div></div>
      <button class="icon-btn" data-act="editWeek" data-id="${w.id}" aria-label="Modifier la semaine">${ic("edit")}</button></div>
      ${tt.tot?`<div class="bar"><i style="width:${tt.pct*100}%;background:var(--ok)"></i></div>`:""}
      <div class="grid" style="gap:6px">${l.length?l.map(wcLine).join(""):`<p class="small muted">${w.id==="rev"||w.label==="Révisions"?"Révisions : J, cartes mémo, QCM et annales.":"Aucun cours. Glisse un cours ici."}</p>`}</div>
      ${evs.length||jn?`<div class="list small">${evs.map(e=>`<div class="li" style="padding:5px 0">${tag(e.type)}<div class="t"><b style="font-size:13px">${esc(e.title)}</b><span>${fd(e.date)}${e.start?" · "+e.start:""}</span></div></div>`).join("")}${jn?`<div class="li" style="padding:5px 0">${tag("j")}<div class="t"><b style="font-size:13px">${jn} révision${jn>1?"s":""} J prévue${jn>1?"s":""}</b></div></div>`:""}</div>`:""}
      ${w.note?`<p class="small" style="white-space:pre-wrap">${esc(w.note)}</p>`:""}
      ${late?`<div class="row"><button class="btn sm" data-act="weekCarry" data-id="${w.id}">Reporter le reste à la semaine en cours</button><button class="btn sm ghost" data-act="weekAllDone" data-id="${w.id}">Tout marquer écouté</button></div>`:""}
    </section>`}).join("")}</div>`;
};
function wcLine(c){const s=subj(c.subject);return `<div class="wc ${cComplete(c)?"done":""}" draggable="true" data-drag="${c.id}"><input type="checkbox" class="check" data-act="courseAll" data-id="${c.id}" ${cComplete(c)?"checked":""} aria-label="Audios écoutés"><span class="dot" style="background:${s.color}"></span><div class="t"><b>${esc(c.title)}</b><span>${esc(s.short)} · ${c.audios.length>1?c.audios.length+" audios · ":""}${fmtMin(cMin(c))}${cDone(c)&&!cComplete(c)?` · ${fmtMin(cDone(c))} écoutés`:""}</span></div><select data-moveweek="${c.id}" aria-label="Déplacer vers" style="max-width:96px;font-size:12px;padding:3px 4px">${weekOptions(c.week)}</select></div>`}
AFTER.semainier=()=>{if(UI.weekOpen){const el=document.getElementById("wk-"+UI.weekOpen);if(el)el.scrollIntoView({block:"start"});UI.weekOpen=null}};

/* ---- Mes cours ---- */
VIEWS.cours=()=>{
  const tabs=[["cours","Cours & audios","headph"],["fichage","Fichage","note"],["exos","Exercices & QCM","quiz"],["bulletins","Bulletins de liaison","file"]];
  return `<div class="head"><div><h1>Mes cours</h1><p>${UI.courseTab==="cours"?"Chaque cours avec ses audios : coche-les au fur et à mesure pour suivre ton avancement.":UI.courseTab==="fichage"?"Tes fiches de cours, rédigées par toi ou avec l’assistant à partir du texte du cours.":UI.courseTab==="bulletins"?"Les bulletins de liaison de tes enseignants, avec les consignes et les dates extraites.":"Des QCM et des exercices générés pour chaque cours ou chaque fiche, corrigés par l’IA."}</p></div>
    ${UI.courseTab==="cours"?`<button class="btn pri" data-act="newCourse">${ic("plus")}Cours</button>`:""}</div>
  <div class="tabs" role="tablist">${tabs.map(([k,l,i])=>`<button role="tab" aria-selected="${UI.courseTab===k}" data-act="courseTab" data-v="${k}">${ic(i)}${l}</button>`).join("")}</div>
  ${depotCard()}
  ${UI.courseTab==="cours"?coursTab():UI.courseTab==="fichage"?fichageTab():UI.courseTab==="bulletins"?bulletinsTab():exosTab()}`;
};
function coursTab(){
  const sub=UI.courseSub;const subs=sub?[subj(sub)]:S.subjects;
  return `${subjectChips(sub,"courseSub")}
  ${subs.map(s=>{
    const list=S.courses.filter(c=>c.subject===s.id).sort((a,b)=>(weekById(a.week)?.start||"9").localeCompare(weekById(b.week)?.start||"9")||(a.order||0)-(b.order||0));
    const r=totals(list);
    return `<section class="card">
      <div class="card-h"><div class="row"><span class="dot" style="background:${s.color};width:12px;height:12px"></span><h2>${esc(s.name)}</h2>${majPill(s)}<span class="pill">coef ${s.coef}</span></div>
      <div class="row"><span class="small muted num">${list.length} cours · ${list.reduce((a,c)=>a+c.audios.length,0)} audios · ${fmtMin(r.done)} / ${fmtMin(r.tot)}</span><button class="btn sm" data-act="newCourse" data-sub="${s.id}">${ic("plus")}Cours</button></div></div>
      ${r.tot?`<div class="bar"><i style="width:${r.pct*100}%;background:${s.color}"></i></div>`:""}
      <div>${list.length?list.map(courseRow).join(""):`<div class="empty">Aucun cours pour cette matière.<button class="btn sm" data-act="newCourse" data-sub="${s.id}">Ajouter un cours</button></div>`}</div>
    </section>`}).join("")}`;
}
function courseRow(c){
  const w=weekById(c.week);const nf=fichesOf(c.id).length;const jp=S.jplans[c.id];
  const jnext=jp&&jp.reviews.find(r=>r.status!=="done");

    <div><div class="ti">${esc(c.title)}</div><div class="meta"><span>${w?esc(weekName(w)):"Non planifié"}</span><span>·</span><span class="num">${c.audios.length} audio${c.audios.length>1?"s":""} · ${fmtMin(cMin(c))}</span>${jp?`<span class="pill j">${jnext?`${esc(jnext.label)} ${relDay(jnext.date)}`:"J terminés"}</span>`:""}${nf?`<span class="pill info">${nf} fiche${nf>1?"s":""}</span>`:""}</div></div>
    <div class="acts"><button class="stage" data-act="stage" data-id="${c.id}" data-k="pdf" aria-pressed="${!!c.pdf}">PDF lu</button><button class="stage" data-act="stage" data-id="${c.id}" data-k="redige" aria-pressed="${!!c.redige}">Rédigé</button>
      <button class="btn sm ghost" data-act="goFiche" data-id="${c.id}">${ic("note")}Fiche</button><button class="btn sm ghost" data-act="goExo" data-id="${c.id}">${ic("quiz")}QCM</button><button class="icon-btn" data-act="editCourse" data-id="${c.id}" aria-label="Modifier le cours">${ic("edit")}</button></div>
    ${(c.files||[]).length?`<div class="aud">${c.files.map(f=>`<a class="audio" href="#" data-act="openFile" data-path="${esc(f.id)}">${ic("file")}${esc(f.name.length>34?f.name.slice(0,32)+"…":f.name)}</a>`).join("")}</div>`:""}
    <div class="aud">${c.audios.map((a,i)=>`<button class="audio" data-act="audio" data-id="${c.id}" data-i="${i}" aria-pressed="${!!a.done}">${a.done?ic("check"):ic("headph")}${c.audios.length>1?`Audio ${i+1} · `:""}${fmtMin(a.min)}</button>${a.file&&a.file.id?`<a class="icon-btn" href="#" data-act="openFile" data-path="${esc(a.file.id)}" title="Écouter l’audio ${i+1}" aria-label="Écouter">${ic("play")}</a>`:""}`).join("")}<button class="audio" data-act="addAudio" data-id="${c.id}" title="Ajouter un audio">${ic("plus")}audio</button></div>
  </div>`;
}
function fichageTab(){
  const f=S.fiches.find(x=>x.id===UI.fiche);
  const left=`<div class="side-list">${S.subjects.map(s=>{const l=S.fiches.filter(x=>course(x.courseId)?.subject===s.id);return l.length?`<div class="grp"><span class="dot" style="background:${s.color}"></span>${esc(s.short)}</div>${l.sort((a,b)=>(b.updated||0)-(a.updated||0)).map(x=>`<button class="draft-btn" data-act="openFiche" data-id="${x.id}" aria-current="${x.id===UI.fiche}"><b>${esc(x.title)}</b><span>${esc(course(x.courseId)?.title||"")} · ${new Date(x.updated||Date.now()).toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}</span></button>`).join("")}`:""}).join("")||`<div class="empty small">Aucune fiche. Choisis un cours et lance-toi.</div>`}</div>`;

    </tbody></table></div>`:`<div class="empty">Aucun cours suivi. Lance la méthode des J sur un cours dont tu as écouté les audios.<button class="btn jv sm" data-act="jStartPick">Lancer un cours</button></div>`}</div>

/* ---- Notes ---- */
function subjectAvg(sid,sem){
  const ev=S.grades.filter(g=>g.subject===sid&&g.semester===sem);let gw=0,gs=0,uw=0;
  ev.forEach(g=>{const w=+g.weight||0;if(g.note!==""&&g.note!=null&&!isNaN(+g.note)){gs+=w*(+g.note/(+g.max||20)*20);gw+=w}else uw+=w});
  if(!ev.length)uw=1;return {avg:gw?gs/gw:null,gw,gs,uw};
}
function semesterCalc(sem){
  let A=0,B=0,cur=0,curC=0,totC=0;
  S.subjects.forEach(s=>{const c=+s.coef||0;if(!c)return;totC+=c;const r=subjectAvg(s.id,sem);const W=r.gw+r.uw;if(W){A+=c*(r.gs/W);B+=c*(r.uw/W)}if(r.avg!==null){cur+=c*r.avg;curC+=c}});
  return {current:curC?cur/curC:null,A:totC?A/totC:0,B:totC?B/totC:0,graded:curC,totC};
}
const mention=v=>v==null?"":v>=16?"Très bien":v>=14?"Bien":v>=12?"Assez bien":v>=10?"Passable":"Non validé";
VIEWS.notes=()=>{
  const sem=S.settings.semester;const r=semesterCalc(sem);const target=+S.settings.target||10;let need="";
  if(r.B>0){const x=(target-r.A)/r.B;need=x<=0?`<span class="pill ok">Déjà atteint</span> même avec 0 aux épreuves restantes.`:x>20?`<span class="pill bad">Hors d’atteinte</span> il faudrait ${fmt1(x)}/20 sur les épreuves restantes.`:`Il te faut <b class="num">${fmt1(x)}/20</b> de moyenne sur les épreuves restantes.`}
  else need=r.current!=null?(r.current>=target?`<span class="pill ok">Objectif atteint</span>`:`<span class="pill bad">Objectif manqué</span>`):"";
  const ro=semesterCalc(sem==="S1"?"S2":"S1");const year=r.current!=null&&ro.current!=null?(r.current+ro.current)/2:null;
  const mc=v=>v==null?"":v>=10?"ok":"bad";
  return `
  <div class="head"><div><h1>Notes & moyenne</h1><p>Moyenne pondérée par coefficient. Une matière sans note compte comme une épreuve à venir.</p></div>
    <div class="seg" role="group" aria-label="Semestre">${["S1","S2"].map(x=>`<button data-act="semester" data-v="${x}" aria-pressed="${sem===x}">Semestre ${x.slice(1)}</button>`).join("")}</div></div>
  <div class="grid g3">
    <div class="card tile hero"><span class="lbl">Moyenne actuelle ${sem}</span><span class="big num">${r.current!=null?fmt1(r.current):"—"}</span><span class="lbl">${r.current!=null?mention(r.current)+` · sur ${r.graded}/${r.totC} coef. notés`:"Saisis tes premières notes"}</span></div>
    <div class="card tile"><span class="lbl">Objectif</span><div class="row nowrap"><input type="number" id="target" min="0" max="20" step="0.5" value="${target}" style="width:90px" class="num" aria-label="Moyenne visée"><span class="muted">/20</span></div><p class="small">${need}</p></div>
    <div class="card tile"><span class="lbl">Moyenne annuelle</span><span class="big num">${year!=null?fmt1(year):"—"}</span><span class="lbl">${year!=null?`${mention(year)} · S1 et S2 se compensent`:`Calculée quand S1 et S2 ont des notes`}</span></div>
  </div>
  <div class="card"><div class="card-h"><h2>Détail par matière</h2><span class="small muted">Coefficients modifiables : vérifie-les dans ton guide IED.</span></div>
  <div class="scroll-x"><table><thead><tr><th>Matière</th><th style="width:80px">Coef</th><th>Épreuves</th><th style="width:90px">Moyenne</th></tr></thead><tbody>
  ${S.subjects.map(s=>{const a=subjectAvg(s.id,sem);const gl=S.grades.filter(g=>g.subject===s.id&&g.semester===sem);

async function hashPw(pw,salt){
  try{const enc=new TextEncoder();const key=await crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveBits"]);
    const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:enc.encode(salt),iterations:120000,hash:"SHA-256"},key,256);
    return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,"0")).join("")}
  catch(e){let h=0;const s=salt+pw;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return "w"+h}
}

  const used=[];
  try{
    const tools=TOOLS().map(t=>({...t,execute:async inp=>{used.push(t.name);return t.execute(inp)}}));
    const r=await sampleApi(msgs,{tools,cache:false,onText:({text})=>{box.innerHTML=md(text);const m=$("#main");if(m.scrollHeight-m.scrollTop-m.clientHeight<200)m.scrollTop=m.scrollHeight}});
    let txt=r.text||"";if(used.length)txt+=`\n\n*Actions effectuées : ${[...new Set(used)].map(u=>u.replace(/_/g," ")).join(", ")}.*`;
    S.chat.push({role:"assistant",content:txt});
  }catch(e){S.chat.push({role:"assistant",content:"⚠︎ "+aiError(e)})}

}
async function aiInto(el,prompt,opts={}){
  if(!sampleApi)return null;el.innerHTML='<div class="ai-out muted">Réflexion…</div>';
  try{const r=await sampleApi(prompt,{...opts,onText:({text})=>{el.innerHTML=`<div class="ai-out md">${md(text)}</div>`}});el.innerHTML=`<div class="ai-out md">${md(r.text)}</div>`;return r.text}
  catch(e){el.innerHTML=`<div class="ai-out" style="color:var(--bad)">${esc(aiError(e))}</div>`;return null}
}
async function aiJSON(prompt,opts={}){
  let v=null;
  if(typeof sampleApi.json==="function"){try{v=await sampleApi.json(prompt,opts)}catch(e){if(e&&(e.code==="not_granted"||e.code==="rate_limited"))throw e;v=null}}
  if(!v){const r=await sampleApi(prompt,opts);const m=r.text.match(/\{[\s\S]*\}/);try{v=m?JSON.parse(m[0]):null}catch(e){v=null}}
  if(v&&typeof v==="string"){try{v=JSON.parse(v)}catch(e){}}
  return v;
}
async function aiJSONCards(source,subject,n=10){
  const v=await aiJSON(`À partir du contenu ci-dessous (cours de droit, matière : ${subj(subject).name}), crée ${n} cartes mémo. Chaque carte : une notion unique, recto = question courte, verso = réponse exacte et brève (1 à 3 phrases), avec l'article ou l'arrêt quand le contenu le donne. N'invente rien.
Réponds uniquement en JSON : {"cartes":[{"recto":"…","verso":"…"}]}

CONTENU :
${source.slice(0,12000)}`);
  const list=(v&&v.cartes)||(Array.isArray(v)?v:[]);
  return addCards(list.map(c=>({front:c.recto||c.front,back:c.verso||c.back})),subject);
}
function courseSource(cid,ficheId){

}
async function genExercise(kind){
  const cid=UI.exCourse;const {c,txt,hasFiche}=courseSource(cid,UI.exFiche);if(!c)return;
  const s=subj(c.subject);
  const base=hasFiche?`Appuie-toi UNIQUEMENT sur le contenu suivant (fiche de cours de l'étudiant) :\n${txt.slice(0,14000)}`:`L'étudiant n'a pas encore de fiche : appuie-toi sur le programme classique de L1 pour ce chapitre, sans détails douteux.`;
  const label={qcm:"QCM",vf:"Vrai ou faux",cours:"Questions de cours",cas:"Mini cas pratique",defs:"Définitions"}[kind]+" · "+c.title;
  UI.ex={kind,label,loading:true};render();
  try{
    if(kind==="qcm"||kind==="vf"){
      const v=await aiJSON(`Tu es examinateur en L1 droit (${s.name}, chapitre « ${c.title} »). ${base}

Crée ${kind==="qcm"?"10 questions à choix multiple, 4 choix chacune, une seule bonne réponse, distracteurs plausibles":"10 affirmations vrai/faux (choix [\"Vrai\",\"Faux\"]), dont certaines pièges classiques"}. Varie : définitions, articles, arrêts, dates, raisonnement. Explication courte (1-2 phrases) pour chaque question.
Réponds uniquement en JSON : {"questions":[{"question":"…","choix":["…"],"bonne":0,"explication":"…"}]} (bonne = index du bon choix, à partir de 0).`);
      const qs=((v&&v.questions)||[]).filter(q=>q&&q.question&&Array.isArray(q.choix)&&q.choix.length>=2&&Number.isInteger(+q.bonne)).map(q=>({...q,bonne:+q.bonne}));
      if(!qs.length)throw {message:"L’IA n’a pas renvoyé de questions exploitables. Réessaie."};
      UI.ex={kind,label,qcm:qs,ans:{},courseId:cid};
    }else{
      const ask={cours:"Pose 3 questions de cours (une de définition, une d'explication, une de réflexion), numérotées, comme à l'examen écrit d'une heure.",cas:"Rédige un mini cas pratique (6 à 10 lignes de faits, 1 ou 2 questions) mobilisant ce chapitre. L'étudiant doit répondre avec le plan : 1. Les faits, 2. La discussion (a, b, c), 3. La demande à la juridiction.",defs:"Donne 6 termes ou notions clés du chapitre que l'étudiant doit définir précisément, numérotés."}[kind];
      const r=await sampleApi(`Tu es chargé de TD en L1 droit (${s.name}, chapitre « ${c.title} »). ${base}\n\n${ask}\nDonne seulement l'énoncé, sans corrigé. Markdown simple.`);
      UI.ex={kind,label,statement:r.text,answer:"",correction:"",courseId:cid};
    }
  }catch(e){UI.ex={kind,label,error:aiError(e)}}
  render();
}

async function ficheAI(f,mode,free){
  if(!sampleApi||!f)return;const c=course(f.courseId)||{title:"",subject:""};const s=subj(c.subject);const F=FICHE[f.id]||{md:"",src:""};
  const srcEl=$("#fSrc");if(srcEl){F.src=srcEl.value;FICHE[f.id]=F;saveFiche(f.id)}
  const cur=F.md||"";
  if(mode==="ficher"&&!F.src.trim()&&!cur.trim()){$("#fAI").innerHTML='<div class="ai-out">Colle d’abord le texte du cours dans « Texte source ».</div>';return}
  const STYLE=`Style attendu : explications très simples, phrases courtes, mots-clés en **gras**, tableaux markdown dès qu'on compare des notions, définitions, articles, arrêts et dates du cours. Termine par « ## À retenir pour l'examen » (5 à 8 puces) puis « ## À vérifier dans ton support » (erreurs probables du texte source, articles mal cités, points incertains ou ajoutés par toi). N'invente aucun arrêt, aucun article ni aucune date.`;
  const prompts={
    ficher:`Fiche ce passage de cours de L1 droit (${s.name}, « ${c.title} ») pour un étudiant qui révise. Le texte peut venir d'un audio retranscrit, avec des fautes. Commence par « # Fiche : … », suis le plan du cours (I, II, A, B).\n${STYLE}\n\nTEXTE DU COURS :\n${(F.src||cur).slice(0,24000)}`,
    simple:`Réécris cette fiche de L1 droit (${s.name}) de façon encore plus simple et plus courte, pour quelqu'un qui découvre la notion, en gardant toutes les informations utiles à l'examen et la même structure markdown.\n\nFICHE :\n${cur||F.src}`,
    tableau:`À partir de cette fiche de L1 droit (${s.name}, « ${c.title} »), fais un ou plusieurs tableaux récapitulatifs markdown (notions, définitions, exemples, articles/arrêts) qui permettent de réviser d'un coup d'œil. Rien d'autre que les tableaux et leurs titres ##.\n\nFICHE :\n${cur||F.src}`,
    verif:`Relis cette fiche de L1 droit (${s.name}, « ${c.title} ») comme un chargé de TD. Liste en markdown : ### Erreurs probables (avec correction), ### Imprécisions de vocabulaire juridique, ### Oublis importants pour l'examen. Indique ton degré de certitude et ce qu'il faut vérifier sur Légifrance ou dans le cours.\n\nFICHE :\n${cur}\n\nTEXTE SOURCE :\n${(F.src||"").slice(0,10000)}`,
    libre:`Tu aides un étudiant de L1 droit à ficher son cours (${s.name}, « ${c.title} »). Sa demande : « ${free} ».\nRéponds en markdown, simplement. Si la demande consiste à modifier la fiche, renvoie la fiche complète modifiée.\n\nFICHE ACTUELLE :\n${cur||"(vide)"}\n\nTEXTE SOURCE :\n${(F.src||"").slice(0,10000)}`
  };
  const out=$("#fAI");const txt=await aiInto(out,prompts[mode],{modelTier:mode==="ficher"?"complex":"default"});
  if(txt){UI.ficheOut=txt;if(mode!=="verif")out.insertAdjacentHTML("beforeend",`<div class="row" style="margin-top:8px"><button class="btn pri" data-act="ficheReplace">${cur?"Remplacer ma fiche":"Utiliser comme fiche"}</button>${cur?`<button class="btn" data-act="ficheAppend">Ajouter à la fin</button>`:""}</div>`)}
}
function pickFile(accept,cb){const p=$("#filepick");p.accept=accept;p.value="";p.onchange=()=>{if(p.files[0])cb(p.files[0])};p.click()}

const ARRETS=[
 {id:"vabre",j:"Cass., ch. mixte",d:"24 mai 1975",y:1975,n:"Société des cafés Jacques Vabre",num:"n° 73-13.556",m:"prive",th:"primauté des traités, contrôle de conventionnalité, art. 55 C.",
  faits:"Une société importe du café soluble des Pays-Bas. L’administration des douanes lui applique une taxe intérieure de consommation (art. 265 du code des douanes, issu d’une loi de 1966) plus lourde que celle frappant les produits fabriqués en France. La société en demande la restitution, en invoquant l’art. 95 du traité CEE qui interdit les impositions discriminatoires.",
  proc:"La cour d’appel de Paris (7 juillet 1973) fait droit à la demande. L’administration des douanes forme un pourvoi en cassation.",
  theses:"Pour l’administration, le juge judiciaire ne peut pas écarter une loi postérieure au traité : cela reviendrait à contrôler la loi (théorie de la « loi-écran »). La cour d’appel, elle, a fait prévaloir le traité.",
  pb:"Le juge judiciaire peut-il écarter l’application d’une loi interne postérieure contraire à un traité international ?",
  sol:"Rejet. En vertu de l’art. 55 de la Constitution, le traité a une autorité supérieure à celle de la loi ; il institue un ordre juridique propre intégré à celui des États membres. La cour d’appel a donc décidé à bon droit d’appliquer l’art. 95 du traité à l’exclusion de l’art. 265 du code des douanes, bien que ce texte fût postérieur.",
  portee:"Le juge judiciaire exerce le contrôle de conventionnalité des lois, quatre mois après que le Conseil constitutionnel s’est déclaré incompétent (décision IVG du 15 janvier 1975). Le Conseil d’État s’alignera avec l’arrêt Nicolo (1989)."},
 {id:"nicolo",j:"CE, ass.",d:"20 octobre 1989",y:1989,n:"Nicolo",num:"n° 108243",m:"prive",th:"primauté des traités, contrôle de conventionnalité, abandon de la loi-écran",
  faits:"Un électeur, M. Nicolo, conteste les élections des représentants français au Parlement européen du 18 juin 1989. Il soutient que la loi du 7 juillet 1977, qui fait participer les électeurs des départements et territoires d’outre-mer, est contraire au traité de Rome.",
  proc:"Le Conseil d’État est saisi directement, comme juge de l’élection en premier et dernier ressort.",
  theses:"Le requérant demande l’annulation des opérations électorales pour incompatibilité de la loi avec le traité. Jusque-là, le Conseil d’État refusait d’écarter une loi postérieure à un traité (jurisprudence Semoules, 1968).",
  pb:"Le juge administratif peut-il contrôler la compatibilité d’une loi postérieure avec un traité international ?",
  sol:"Le Conseil d’État examine la compatibilité de la loi de 1977 avec l’art. 227 § 1 du traité CEE et conclut qu’elle n’est pas incompatible. La requête est rejetée, mais le contrôle est bien exercé.",
  portee:"Revirement : abandon de la théorie de la loi-écran et alignement sur la Cour de cassation (Jacques Vabre). Conclusions du commissaire du gouvernement Frydman."},
 {id:"semoules",j:"CE, sect.",d:"1er mars 1968",y:1968,n:"Syndicat général des fabricants de semoules de France",num:"",m:"prive",th:"théorie de la loi-écran",verify:true,
  faits:"Litige sur l’importation de semoules : un acte réglementaire, pris en application d’une ordonnance ayant valeur législative postérieure à un règlement communautaire, est contesté au nom du droit communautaire.",
  proc:"Recours porté devant le Conseil d’État.",
  theses:"Le requérant invoque la primauté de la norme communautaire ; l’administration se prévaut du texte législatif postérieur.",
  pb:"Le juge administratif peut-il faire prévaloir une norme internationale sur une loi postérieure contraire ?",
  sol:"Non : le juge administratif ne peut pas écarter une loi postérieure, qui « fait écran » entre l’acte et la norme internationale. Contrôler la loi reviendrait à empiéter sur la volonté du législateur.",
  portee:"Position abandonnée par l’arrêt Nicolo du 20 octobre 1989. À citer pour montrer l’évolution de la jurisprudence administrative."},
 {id:"sarran",j:"CE, ass.",d:"30 octobre 1998",y:1998,n:"Sarran, Levacher et autres",num:"n° 200286",m:"constit",th:"hiérarchie des normes, suprématie de la Constitution dans l’ordre interne",
  faits:"Un décret du 20 août 1998 organise la consultation des populations de Nouvelle-Calédonie sur l’accord de Nouméa et restreint le corps électoral, en application de l’art. 76 de la Constitution. Des électeurs exclus le contestent.",
  proc:"Recours pour excès de pouvoir devant le Conseil d’État.",
  theses:"Les requérants invoquent des engagements internationaux (Pacte international relatif aux droits civils et politiques, Convention européenne des droits de l’homme) contre la restriction du corps électoral.",
  pb:"Le juge administratif peut-il faire prévaloir un traité international sur une disposition de valeur constitutionnelle ?",
  sol:"Non. La suprématie conférée aux engagements internationaux par l’art. 55 ne s’applique pas, dans l’ordre interne, aux dispositions de nature constitutionnelle. La requête est rejetée.",
  portee:"La Constitution reste au sommet de la hiérarchie des normes dans l’ordre interne. Solution reprise par la Cour de cassation dans l’arrêt Fraisse (2000)."},
 {id:"fraisse",j:"Cass., ass. plén.",d:"2 juin 2000",y:2000,n:"Mlle Fraisse",num:"n° 99-60.274",m:"constit",th:"hiérarchie des normes, Constitution et traités",
  faits:"Mlle Fraisse demande son inscription sur les listes électorales pour la consultation sur l’avenir de la Nouvelle-Calédonie. Elle est refusée faute de remplir la condition de domicile prévue par la loi organique du 19 mars 1999, prise en application de l’art. 76 de la Constitution.",
  proc:"Le tribunal de première instance de Nouméa rejette sa demande ; elle forme un pourvoi.",
  theses:"Elle invoque le Pacte international relatif aux droits civils et politiques et la CEDH contre la condition de domicile.",
  pb:"Un traité peut-il prévaloir, dans l’ordre interne, sur une disposition de valeur constitutionnelle ?",
  sol:"Rejet : la suprématie conférée aux engagements internationaux ne s’applique pas dans l’ordre interne aux dispositions de valeur constitutionnelle.",
  portee:"Alignement de la Cour de cassation sur l’arrêt Sarran : convergence des deux ordres de juridiction."},
 {id:"costa",j:"CJCE",d:"15 juillet 1964",y:1964,n:"Costa c/ ENEL",num:"aff. 6/64",m:"ri",th:"primauté du droit communautaire",
  faits:"M. Costa, actionnaire d’une société d’électricité nationalisée par une loi italienne de 1962, refuse de payer une facture de l’ENEL, l’entreprise créée par cette loi, qu’il estime contraire au traité CEE.",
  proc:"Le juge conciliateur de Milan pose une question préjudicielle à la Cour de justice. Le gouvernement italien soutient que la loi nationale postérieure doit s’appliquer.",
  theses:"Pour l’Italie, une loi postérieure l’emporte sur le traité (lex posterior). Pour M. Costa, le droit communautaire doit prévaloir.",
  pb:"Un État membre peut-il opposer une loi nationale, même postérieure, au droit communautaire ?",
  sol:"Non : à la différence des traités internationaux ordinaires, le traité CEE a institué un ordre juridique propre, intégré au système juridique des États membres. Le droit né du traité ne peut se voir opposer judiciairement un texte interne quel qu’il soit.",
  portee:"Consécration du principe de primauté du droit communautaire (aujourd’hui droit de l’Union), absolue du point de vue de la Cour."},
 {id:"vangend",j:"CJCE",d:"5 février 1963",y:1963,n:"Van Gend en Loos",num:"aff. 26/62",m:"ri",th:"effet direct du droit communautaire",
  faits:"Une société néerlandaise importe un produit chimique d’Allemagne. À la suite d’un reclassement tarifaire, les douanes néerlandaises lui appliquent un droit plus élevé. Elle invoque l’art. 12 du traité CEE, qui interdit d’augmenter les droits de douane entre États membres.",
  proc:"La juridiction néerlandaise saisie (Tariefcommissie) pose une question préjudicielle à la Cour de justice.",
  theses:"Les Pays-Bas soutiennent que seul un État peut se prévaloir du traité ; la société revendique un droit qu’elle tire directement du traité.",
  pb:"Un particulier peut-il invoquer directement une disposition du traité devant son juge national ?",
  sol:"Oui : la Communauté constitue un nouvel ordre juridique de droit international, dont les sujets sont non seulement les États mais aussi leurs ressortissants. L’art. 12 produit des effets immédiats et engendre des droits individuels que les juridictions internes doivent sauvegarder.",
  portee:"Consécration de l’effet direct ; avec Costa c/ ENEL, fondement de l’autonomie de l’ordre juridique de l’Union."},
 {id:"cc71",j:"Cons. const.",d:"16 juillet 1971",y:1971,n:"Liberté d’association",num:"n° 71-44 DC",m:"constit",th:"bloc de constitutionnalité, PFRLR, valeur du préambule",url:"https://www.conseil-constitutionnel.fr/decision/1971/7144DC.htm",
  faits:"Après le refus d’un préfet de délivrer le récépissé de déclaration d’une association (« Les amis de la cause du peuple »), le gouvernement fait voter une loi modifiant la loi de 1901 pour permettre un contrôle préalable, par le juge, de la constitution de certaines associations.",
  proc:"Saisine du Conseil constitutionnel par le président du Sénat, Alain Poher, avant la promulgation de la loi (art. 61 al. 2).",
  theses:"Le président du Sénat conteste l’atteinte à la liberté d’association ; le gouvernement invoque la nécessité de prévenir la reconstitution de groupements dissous.",
  pb:"Le préambule de la Constitution et les textes auxquels il renvoie peuvent-ils servir de normes de référence au contrôle de constitutionnalité, et la liberté d’association a-t-elle valeur constitutionnelle ?",
  sol:"Non-conformité partielle. Le Conseil vise « la Constitution et notamment son préambule » : la liberté d’association est un principe fondamental reconnu par les lois de la République, réaffirmé par le préambule de la Constitution ; elle exclut tout contrôle préalable à la constitution d’une association.",
  portee:"Naissance du « bloc de constitutionnalité » : le Conseil devient le gardien des droits et libertés, et plus seulement l’arbitre entre loi et règlement."},
 {id:"cc75",j:"Cons. const.",d:"15 janvier 1975",y:1975,n:"Interruption volontaire de grossesse",num:"n° 74-54 DC",m:"constit",th:"refus du contrôle de conventionnalité",url:"https://www.conseil-constitutionnel.fr/decision/1975/7454DC.htm",
  faits:"Le Parlement adopte la loi relative à l’interruption volontaire de grossesse (loi Veil).",
  proc:"Saisine par plus de soixante députés, quelques mois après la révision du 29 octobre 1974 qui a ouvert ce droit.",
  theses:"Les députés soutiennent que la loi méconnaît notamment l’art. 2 de la CEDH (droit à la vie), donc l’art. 55 de la Constitution.",
  pb:"Le Conseil constitutionnel doit-il contrôler la conformité d’une loi aux traités internationaux ?",
  sol:"Non. Une loi contraire à un traité ne serait pas, pour autant, contraire à la Constitution. Les décisions rendues sur le fondement de l’art. 61 ont un caractère absolu et définitif, alors que la supériorité des traités (art. 55) présente un caractère relatif et contingent. La loi est déclarée conforme.",
  portee:"Le contrôle de conventionnalité revient aux juges ordinaires : Jacques Vabre (1975), puis Nicolo (1989)."},
 {id:"cc85",j:"Cons. const.",d:"23 août 1985",y:1985,n:"Évolution de la Nouvelle-Calédonie",num:"n° 85-197 DC",m:"constit",th:"légitimité du contrôle de constitutionnalité",url:"https://www.conseil-constitutionnel.fr/decision/1985/85197DC.htm",
  faits:"Après une première censure partielle (décision du 8 août 1985), la loi sur l’évolution de la Nouvelle-Calédonie fait l’objet d’une nouvelle délibération puis d’une nouvelle saisine.",
  proc:"Saisine par des parlementaires.",
  theses:"Les requérants contestent la procédure de nouvelle délibération et le découpage électoral.",
  pb:"Dans quelles conditions la loi exprime-t-elle la volonté générale ?",
  sol:"Formule à retenir : « la loi votée […] n’exprime la volonté générale que dans le respect de la Constitution ».",
  portee:"Justifie le contrôle de constitutionnalité face à l’argument démocratique : le juge contrôle la loi au nom du constituant. Formule à citer dans toute dissertation sur la loi ou le Conseil constitutionnel."},
 {id:"cc62",j:"Cons. const.",d:"6 novembre 1962",y:1962,n:"Loi référendaire",num:"n° 62-20 DC",m:"constit",th:"incompétence pour les lois référendaires",url:"https://www.conseil-constitutionnel.fr/decision/1962/6220DC.htm",
  faits:"Le général de Gaulle soumet au référendum (art. 11) un projet de loi sur l’élection du président de la République au suffrage universel direct, adopté le 28 octobre 1962. Le recours à l’art. 11 plutôt qu’à l’art. 89 pour réviser la Constitution est très contesté.",
  proc:"Saisine par le président du Sénat, Gaston Monnerville.",
  theses:"Pour Monnerville, la loi est inconstitutionnelle car la révision aurait dû suivre l’art. 89.",
  pb:"Le Conseil constitutionnel est-il compétent pour contrôler une loi adoptée par le peuple par référendum ?",
  sol:"Non : les lois adoptées par le peuple à la suite d’un référendum constituent l’expression directe de la souveraineté nationale ; le Conseil, organe régulateur de l’activité des pouvoirs publics, n’est compétent que pour les lois votées par le Parlement.",
  portee:"Limite du contrôle de constitutionnalité ; débat sur l’usage de l’art. 11 pour réviser la Constitution."},
 {id:"cc92",j:"Cons. const.",d:"2 septembre 1992",y:1992,n:"Maastricht II",num:"n° 92-312 DC",m:"constit",th:"pouvoir constituant dérivé, souveraineté",url:"https://www.conseil-constitutionnel.fr/decision/1992/92312DC.htm",
  faits:"Après une première décision (9 avril 1992) jugeant le traité de Maastricht contraire à la Constitution, celle-ci est révisée le 25 juin 1992. Le traité est de nouveau déféré.",
  proc:"Saisine par soixante sénateurs (art. 54).",
  theses:"Les sénateurs estiment que le traité porte toujours atteinte à la souveraineté nationale.",
  pb:"Le pouvoir constituant dérivé est-il limité, et le traité reste-t-il contraire à la Constitution révisée ?",
  sol:"Le traité n’est plus contraire à la Constitution. Le pouvoir constituant est souverain : il peut abroger, modifier ou compléter des dispositions de valeur constitutionnelle, sous réserve des limitations de temps (art. 7, 16, 89 al. 4) et de la forme républicaine du gouvernement (art. 89 al. 5).",
  portee:"Affirmation de la souveraineté du pouvoir constituant ; question de la supra-constitutionnalité."},
 {id:"cc2003",j:"Cons. const.",d:"26 mars 2003",y:2003,n:"Organisation décentralisée de la République",num:"n° 2003-469 DC",m:"constit",th:"incompétence pour les révisions constitutionnelles",url:"https://www.conseil-constitutionnel.fr/decision/2003/2003469DC.htm",
  faits:"Le Congrès adopte la révision constitutionnelle relative à l’organisation décentralisée de la République (« la République […] son organisation est décentralisée »).",
  proc:"Saisine par plus de soixante sénateurs.",
  theses:"Les requérants contestent la révision au regard de la forme républicaine du gouvernement.",
  pb:"Le Conseil constitutionnel peut-il contrôler une loi de révision constitutionnelle ?",
  sol:"Non : il ne tient ni de l’art. 61, ni de l’art. 89, ni d’aucune autre disposition le pouvoir de statuer sur une révision constitutionnelle.",
  portee:"Le pouvoir constituant dérivé échappe à tout contrôle juridictionnel, ce qui relativise les limites posées en 1992."},
 {id:"cc2004",j:"Cons. const.",d:"10 juin 2004",y:2004,n:"Loi pour la confiance dans l’économie numérique",num:"n° 2004-496 DC",m:"constit",th:"transposition des directives, art. 88-1",url:"https://www.conseil-constitutionnel.fr/decision/2004/2004496DC.htm",
  faits:"Une loi transpose une directive sur le commerce électronique, notamment sur la responsabilité des hébergeurs.",
  proc:"Saisine par plus de soixante députés et sénateurs.",
  theses:"Les requérants contestent des dispositions qui reprennent la directive.",
  pb:"Le Conseil constitutionnel peut-il contrôler une loi qui transpose une directive ?",
  sol:"La transposition d’une directive résulte d’une exigence constitutionnelle (art. 88-1). Le Conseil ne contrôle pas une loi qui se borne à tirer les conséquences de dispositions inconditionnelles et précises d’une directive, sauf disposition expresse contraire de la Constitution (devenue « identité constitutionnelle de la France » en 2006).",
  portee:"Articulation entre droit de l’Union et Constitution ; réserve de constitutionnalité."},
 {id:"qpc1",j:"Cons. const.",d:"28 mai 2010",y:2010,n:"Consorts L. (cristallisation des pensions)",num:"n° 2010-1 QPC",m:"constit",th:"première QPC, principe d’égalité",url:"https://www.conseil-constitutionnel.fr/decision/2010/20101QPC.htm",
  faits:"Des ayants droit d’un ancien combattant étranger contestent les règles qui « cristallisent » les pensions versées aux ressortissants des anciennes colonies, à un niveau inférieur à celui des pensions des Français.",
  proc:"Question prioritaire de constitutionnalité transmise par le Conseil d’État (art. 61-1, entré en vigueur le 1er mars 2010).",
  theses:"Les requérants invoquent le principe d’égalité.",
  pb:"Les dispositions qui distinguent les pensions selon la nationalité des bénéficiaires méconnaissent-elles le principe d’égalité ?",
  sol:"Inconstitutionnalité, avec abrogation différée au 1er janvier 2011 pour laisser le législateur intervenir.",
  portee:"Première décision QPC : le justiciable peut contester une loi déjà promulguée ; le Conseil module les effets dans le temps (art. 62)."},
 {id:"fraternite",j:"Cons. const.",d:"6 juillet 2018",y:2018,n:"M. Cédric H. et autre (principe de fraternité)",num:"n° 2018-717/718 QPC",m:"constit",th:"principe de fraternité, « délit de solidarité »",url:"https://www.conseil-constitutionnel.fr/decision/2018/2018717_718QPC.htm",
  faits:"Des personnes poursuivies pour avoir aidé des étrangers en situation irrégulière à circuler et séjourner contestent les dispositions du code de l’entrée et du séjour des étrangers qui répriment cette aide.",
  proc:"QPC transmises par la Cour de cassation.",
  theses:"Les requérants invoquent la fraternité, inscrite dans la devise de la République.",
  pb:"La fraternité a-t-elle une valeur constitutionnelle et permet-elle de protéger l’aide humanitaire apportée aux étrangers ?",
  sol:"La fraternité est un principe à valeur constitutionnelle ; il en découle la liberté d’aider autrui, dans un but humanitaire, sans considération de la régularité de son séjour. Inconstitutionnalité partielle.",
  portee:"Consécration d’un nouveau principe constitutionnel à partir de la devise (art. 2 et 72-3 C.)."},
 {id:"cc82",j:"Cons. const.",d:"16 janvier 1982",y:1982,n:"Nationalisations",num:"n° 81-132 DC",m:"constit",th:"valeur de la DDHC, droit de propriété",url:"https://www.conseil-constitutionnel.fr/decision/1982/81132DC.htm",
  faits:"Le gouvernement fait adopter une loi de nationalisation de groupes industriels et de banques.",
  proc:"Saisine par des députés et sénateurs de l’opposition.",
  theses:"Les requérants invoquent le droit de propriété (art. 2 et 17 DDHC) et l’exigence d’une juste et préalable indemnité.",
  pb:"Le droit de propriété proclamé en 1789 a-t-il valeur constitutionnelle et permet-il de contrôler les nationalisations ?",

  portee:"Pleine valeur constitutionnelle de la DDHC ; contrôle de l’erreur manifeste d’appréciation.",verify:true},
 {id:"marbury",j:"Cour suprême des États-Unis",d:"24 février 1803",y:1803,n:"Marbury v. Madison",num:"5 U.S. 137",m:"constit",th:"naissance du contrôle de constitutionnalité (modèle américain, diffus)",
