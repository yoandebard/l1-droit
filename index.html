r les **situations en cours**.\n\n## II. Un principe relatif : les exceptions\n\nLe principe n'a **pas de valeur constitutionnelle** en matière civile : c'est la raison majeure de sa relativité.\n\n| Exception | Explication |\n|---|---|\n| **Le législateur peut y déroger** | L'art. 2 lie le **juge**, pas le législateur |\n| **Loi pénale plus douce** | Rétroactive ; valeur **constitutionnelle** (Cons. const., **1981**) |\n| **Loi pénale plus sévère** | **Jamais** rétroactive, sauf **crimes contre l'humanité** |\n| **Loi interprétative** | **Fait corps avec l'ancienne** |\n| **Loi de validation** | Rétroactive par nature |\n| **Loi de procédure** | Rétroactive par nature (d'après le cours) |\n| **Jurisprudence** | Rétroactive par nature |\n\n## III. Les théories sur l'application dans le temps\n\n| | Théorie classique (droits acquis) | Théorie moderne (effet immédiat) |\n|---|---|---|\n| **Époque** | XIXe siècle | XXe siècle, **doyen Roubier** |\n| **Idée** | La loi nouvelle ne s'applique qu'aux **simples expectatives** | La loi nouvelle s'applique **immédiatement** |\n| **Exemple** | Des époux garderaient toute leur vie la loi du divorce en vigueur au mariage | Les enfants naturels déjà nés profitent de la loi nouvelle pour les **effets à venir** |\n| **Critique** | **Bloque toute évolution** | Concilie sécurité juridique et évolution |\n\n**Effet immédiat :** la loi nouvelle s'applique aux situations **non encore créées**, et aux **effets à venir** des situations en cours.\n\n| | Situation légale | Situation contractuelle |\n|---|---|---|\n| **Règle** | Loi nouvelle **toujours d'application immédiate** | Loi nouvelle pour les **contrats non encore conclus** |\n| **Contrats en cours** | | **Survie de la loi ancienne** (respect de la volonté des parties) |\n\n**Exceptions à la survie de la loi ancienne :** volonté **expresse** du législateur ; **ordre public** au caractère **particulièrement impérieux** (droit du travail, baux d'habitation).\n\n## À retenir pour l'examen\n- **Principe :** non-rétroactivité (art. 2), sécurité juridique.\n- **Relatif :** le législateur peut y déroger.\n- **Rétroactives par nature :** lois pénales plus douces, interprétatives, de validation, de procédure, jurisprudence.\n- **Deux théories :** droits acquis (abandonnée) et effet immédiat de Roubier (retenue).\n- **Règle pratique :** situation légale, effet immédiat ; contrat, survie de la loi ancienne.\n\n## À vérifier dans ton support\n- En **matière pénale**, la non-rétroactivité a valeur constitutionnelle (**art. 8 DDHC**).\n- **Lois de validation :** **motif impérieux d'intérêt général** exigé (CEDH, Conseil constitutionnel).\n- **Lois de procédure :** plutôt une **application immédiate** aux instances en cours.\n- **Jurisprudence :** un revirement peut être **modulé dans le temps** par la Cour de cassation.\n- **Roubier** distingue effet rétroactif (interdit), effet immédiat et survie de la loi ancienne."},{"key":"cl-10","course":"c1","subject":"prive","courseTitle":"L’application des sources du droit","title":"L'application de la loi dans l'espace","md":"# Fiche : L'application de la loi dans l'espace (Section 4)\n\n## I. Le problème : les conflits de lois dans l'espace\n- un **Français vivant à l'étranger** se prévaut d'une loi française ;\n- un **étranger résidant en France** invoque la loi de son pays, ou la loi française contre celle de son pays.\n\n## II. L'article 3 du Code civil\n\n| Système | Règle de l'art. 3 | Contenu |\n|---|---|---|\n| **Territorialité** | La loi s'applique à **tout ce qui se trouve sur le territoire** | Les **lois de police et de sûreté** obligent tous les habitants ; les **immeubles**, même possédés par des étrangers, sont régis par la **loi française** |\n| **Personnalité** | La loi **suit la personne** | Les lois sur l'**état et la capacité** régissent les **Français**, même à l'étranger |\n\nL'art. 3 **ne règle pas tous les conflits** : la **jurisprudence comble les lacunes**.\n\n## III. Les particularismes locaux\n\n### A. L'Alsace-Moselle (droit local)\n- **1918 :** rattachement du Haut-Rhin, du Bas-Rhin et de la Moselle ; législation française applicable **au 1er janvier 1925**, certaines **lois locales d'origine allemande** subsistent (publicité foncière, incapacités, régimes matrimoniaux).\n- **Loi du 29 décembre 1990** : rapprochement ; **loi du 24 juillet 1921** : règles de conflit entre droit local et droit général.\n\n### B. L'Outre-mer (TOM supprimés par la révision du **28 mars 2003**)\n\n| Catégorie | Exemples | Cadre |\n|---|---|---|\n| **Départements et régions d'Outre-mer** | Guadeloupe, Martinique, Guyane, La Réunion, Mayotte | **Art. 73** |\n| **Collectivités d'Outre-mer** | Polynésie française, Saint-Pierre-et-Miquelon, Wallis-et-Futuna, Saint-Martin, Saint-Barthélemy | **Art. 74** |\n| **Nouvelle-Calédonie** | Collectivité **sui generis** | **Titre XIII** (art. 76 et 77) |\n\n**CE, 30 juin 2003 (Mayotte) :** un régime de **prestations familiales différent** est admis s'il est **justifié par la situation particulière** de la collectivité (situation économique, démographique, maîtrise de la natalité).\n\n| | **Art. 73 (DROM)** | **Art. 74 (COM)** |\n|---|---|---|\n| **Principe** | Lois et règlements **applicables de plein droit** (identité législative) | Applicables **sur disposition expresse** (spécialité législative) |\n| **Adaptations** | Selon les **caractéristiques et contraintes particulières** | Autonomie plus large |\n| **Pouvoir normatif local** | Habilitation possible dans un **nombre limité de matières** | |\n\n**Matières qui restent nationales :** nationalité, droits civiques, libertés publiques ; état et capacité des personnes ; justice, droit pénal, procédure pénale ; politique étrangère, défense, ordre public ; monnaie, crédit ; droit électoral.\n\n### C. Une tendance à l'uniformisation\n- **Loi du 23 juin 2006** (successions) : abrogation de textes spécifiques aux DOM.\n- **Loi du 6 mars 1998** : actualisation du droit d'Outre-mer par ordonnances.\n- **Consultation obligatoire** des assemblées locales : avis dans un délai d'**un mois**, sinon **réputé donné**.\n\n## À retenir pour l'examen\n- **Art. 3 :** territorialité (police et sûreté, immeubles) et personnalité (état et capacité des Français).\n- **Alsace-Moselle :** droit local d'origine allemande.\n- **Outre-mer :** art. 73 (identité législative), art. 74 (spécialité), Nouvelle-Calédonie (statut propre).\n\n## À vérifier dans ton support\n- Art. 3, al. 1 : il s'agit des **lois de police et de sûreté**, plus large que la loi pénale.\n- « Loi du 1er juin 1954 » : vraisemblablement **1924** (mise en vigueur de la législation française en Alsace-Lorraine).\n- Le pouvoir d'habilitation des DROM vient de la révision de **2003**, pas de 2008.\n- **Mayotte** est département depuis **2011** ; **La Réunion** n'est pas citée par le cours."},{"key":"cl-11","course":"c1","subject":"prive","courseTitle":"L’application des sources du droit","title":"L'application du droit international et du droit de l'UE en droit interne","md":"# Fiche : L'application du droit international et du droit de l'UE en droit interne (Section 5)\n\n## I. Le problème posé\nLa **valeur normative** du droit international et du droit de l'UE n'a jamais été contestée ; ce sont les **conditions de sa reconnaissance** qui ont fait débat : son **fondement**, sa **mise en œuvre** et sa **place** dans la hiérarchie.\n\n## II. Le fondement de la valeur normative\n**Droit international :** l'**art. 55 C.** prévoit sa supériorité sur la loi.\n\n| Décision | Date | Apport |\n|---|---|---|\n| **Van Gend en Loos** (CJCE) | 5 février 1963 | **Nouvel ordre juridique** ; les États ont **limité leurs droits souverains** ; sujets : **États et ressortissants** (**effet direct**) |\n| **Costa c/ ENEL** (CJCE) | 15 juillet 1964 | **Intégration** dans l'ordre juridique des États ; impossible de lui opposer une **mesure unilatérale** (**primauté**) |\n| **Jacques Vabre** (Cass., ch. mixte) | 24 mai 1975 | Le traité de 1957 institue un **ordre juridique propre**, directement applicable, qui **s'impose aux juridictions** |\n\n**Fondements :** **transfert de compétences** consenti par les États et **spécificité** de l'ordre communautaire.\n\n## III. L'effet direct\nReconnaissance **directe** pour les **traités** et les **règlements** (art. 288 TFUE). Difficulté pour les **directives** et **décisions**, qui exigent une **transposition**.\n\n| Décision | Position |\n|---|---|\n| **CJCE, SACE, 17 décembre 1970** | Effet direct **possible** selon les **caractères propres** de chaque directive (suffisamment **précise**) |\n| **CE, Cohn-Bendit, 22 décembre 1978** | **Refus de tout effet direct** aux directives |\n| **CE, Perreux, 30 octobre 2009** | **Revirement** : tout justiciable peut invoquer, contre un **acte non réglementaire**, les dispositions **précises et inconditionnelles** d'une directive non **transposée dans les délais** |\n\n## IV. La hiérarchie des normes\n**Principe :** le droit international et de l'UE **prévalent sur les normes internes**, antérieures ou postérieures.\n\n- **Constitution :** reste la **norme suprême** ; en cas de contrariété, **révision constitutionnelle** préalable (confirmé par **Sarran**, CE 1998, et **Fraisse**, Cass. 2000).\n- **Normes antérieures contraires :** écartées (le cours dit « abrogées » ; on parle plutôt d'**inapplicabilité**).\n- **Règlements postérieurs :** écartés par l'**exception d'illégalité** ou le **recours en annulation**.\n- **Lois postérieures :** le point délicat, car le juge est **subordonné à la loi**.\n\n| Décision | Date | Solution |\n|---|---|---|\n| **CE, Semoules** | 1er mars 1968 | **Refus** d'écarter une loi postérieure (loi-écran) |\n| **Cons. const., IVG** | 15 janvier 1975 | **Pas de contrôle de conventionnalité** par le Conseil constitutionnel |\n| **Cass., Jacques Vabre** | 24 mai 1975 | Le droit communautaire **prévaut sur une loi postérieure contraire** |\n| **CE, Nicolo** | 20 octobre 1989 | **Ralliement** du Conseil d'État |\n\n## V. Chronologie\n1963 Van Gend en Loos · 1964 Costa · 1968 Semoules · 1970 SACE · 1975 IVG puis Jacques Vabre · 1978 Cohn-Bendit · 1989 Nicolo · 2009 Perreux.\n\n## À retenir pour l'examen\n- **Art. 55** : traités supérieurs aux lois, sous réserve de réciprocité.\n- **Primauté** sur toute norme interne, **sauf la Constitution**.\n- **Contrôle de conventionnalité** : refusé par le Conseil constitutionnel, exercé par la Cour de cassation (1975) puis le Conseil d'État (1989).\n- **Directives** : Cohn-Bendit (1978) puis Perreux (2009).\n\n## À vérifier dans ton support\n- **Costa c/ ENEL** : **15 juillet 1964** (le cours dit le 17).\n- **Art. 249 CE** = **art. 288 TFUE**.\n- Les chiffres « 31 », « 32 », « 53 » du texte sont des numéros de notes."},{"key":"cl-12","course":"c2","subject":"prive","courseTitle":"L’organisation judiciaire","title":"L'organisation judiciaire","md":"# Fiche : L'organisation judiciaire (Partie III)\n\n## SECTION 1 : Les divisions juridictionnelles\n\n### I. Les modes alternatifs de règlement des litiges\n| Mode | Caractéristiques |\n|---|---|\n| **Conciliation** | Avant tout litige, ou en cours d'instance à l'initiative du juge si la loi le prévoit |\n| **Médiation** | Proposée **après** l'introduction du litige ; **toujours payante** |\n| **Transaction** | **Rapprochement spontané** des parties |\n| **Arbitrage** | Mode juridictionnel **non étatique** : des **personnes privées** tranchent |\n\n### II. La décision de justice\n- **Formes :** ordonnance, jugement, arrêt. **Pouvoir de juridiction :** dire le droit. **Imperium :** pouvoir de commandement, qui implique l'**exécution** (volontaire ou **forcée**).\n- Rendue **au nom du peuple français**, revêtue de la **formule exécutoire**.\n- **« Une cause jugée tient lieu de vérité »**. Exécutée lorsqu'elle est **définitive**.\n\n### III. Les divisions de l'organisation judiciaire\n| Division | Contenu |\n|---|---|\n| **2 ordres** | **Administratif** (particuliers / administration) et **judiciaire** (entre particuliers) |\n| **3 niveaux** (pas 3 degrés) | 1re instance, appel (**juges du fond**), cassation (**juge du droit**) |\n| **Ordre judiciaire** | Juridictions **civiles** et **pénales** (CPC, CPP) |\n| **1re instance** | Juridiction de **droit commun** et juridictions **spécialisées** |\n\nToute décision est susceptible d'**appel**, sauf en **premier et dernier ressort**. **Une juridiction de cassation par ordre**.\n\n### IV. Civil et pénal\n| | Juridictions civiles | Juridictions pénales |\n|---|---|---|\n| **Parties** | Particuliers | Le **délinquant** face au **ministère public**, éventuellement une **partie civile** |\n| **Objet** | Condamnation de l'adversaire ou reconnaissance d'un droit | Contraventions, délits, crimes |\n\n- **Cour de cassation commune** (chambre criminelle), **cour d'appel unique** (chambres spécialisées). Tribunal de police et tribunal correctionnel sont des formations du **tribunal judiciaire**.\n- **Option de la victime** (faute civile + infraction) : en principe **irrévocable** dans un seul sens (*electa una via*).\n\n## SECTION 2 : La saisine des juridictions\n\n| Condition pour agir | Contenu |\n|---|---|\n| **Intérêt légitime, né et actuel** | Ni hypothétique ni futur |\n| **Qualité pour agir** | Parfois réservée (ex. : contestation de filiation réservée aux parents, prétendus parents, enfant) |\n| **Capacité** | **Mineurs** et **majeurs protégés** agissent par leur **représentant légal** |\n\n- **Civil :** affaire simple, audience de jugement ; affaire complexe, **juge de la mise en état**.\n- **Pénal :** tribunal de police souvent dès la 1re audience ; **instruction** souvent en correctionnel, **toujours** en assises.\n- **Modes de saisine :** **assignation, citation, requête**.\n\n### Les voies de recours\n| Recours | Nature | Contenu |\n|---|---|---|\n| **Appel** | Ordinaire, **réformation** | Cour d'appel ; réexamen en **fait et en droit** (**effet dévolutif**) |\n| **Opposition** | Ordinaire, **rétractation** | Même juridiction ; réservée à la **partie défaillante** |\n| **Révision** | Extraordinaire | Civil : **fraude** d'une partie ; pénal : erreur judiciaire et **fait nouveau** |\n| **Tierce opposition** | Extraordinaire | Ouverte aux **tiers** ; **exclue au pénal** |\n| **Pourvoi en cassation** | Extraordinaire | Contre les décisions en **premier et dernier ressort** et les décisions d'**appel** |\n\n**Réexamen (loi du 15 juin 2000) :** d'une décision pénale définitive après condamnation de la France par la **CEDH**.\n\n## SECTION 3 : Les règles générales du procès\n\n- **Service public** (ministère de la Justice, **chancellerie**, **garde des sceaux**) ; **égalité** et libre accès ; **gratuité** (fin des **épices**), **aide juridictionnelle**.\n\n| Principe | Contenu |\n|---|---|\n| **Collégialité** | Au moins **3 juges**, majorité, **délibéré secret** |\n| **Plus de 3 juges** | **Prud'hommes** : 4 conseillers paritaires. **Assises** : 3 magistrats + 6 jurés (1re instance), + 9 jurés (appel) |\n| **Juge unique** | Tribunal de police, juge de l'exécution, JAF, juge des référés |\n| **Double degré** | Sauf demandes **inférieures à 5 000 €** |\n| **Droits de la défense** | **Contradictoire**, que le juge fait respecter **et respecte** |\n| **Publicité** | Sauf **huis clos** (obligatoire : état des personnes, divorce ; de droit pour les mineurs au pénal) |\n\n## SECTION 4 : Les juridictions du fond\n\n| Ordre | Droit commun en 1re instance |\n|---|---|\n| **Administratif** | **Tribunal administratif** |\n| **Judiciaire** | **Tribunal judiciaire** (exclusif pour l'état des personnes, la propriété immobilière) |\n| **Pénal** | Tribunal de police (contraventions), tribunal correctionnel (délits), cour d'assises (crimes) |\n\n- **36 cours d'appel** (souvent d'anciens parlements).\n- **Spécialisées :** **prud'hommes** (salarié/employeur), **tribunal de commerce**, **tribunal paritaire des baux ruraux**.\n\n| Juridiction pénale spéciale | Contenu |\n|---|---|\n| **Suppressions de 1982** | Tribunal permanent des forces armées, Cour de sûreté de l'État (Badinter) |\n| **Haute Cour** (LC 23 févr. 2007) | **Destitution** du Président pour manquement incompatible avec son mandat ; saisine par les parlementaires |\n| **Cour de justice de la République** (LC 27 juill. 1993) | Crimes et délits des **ministres** ; **15 juges** (12 parlementaires + 3 conseillers à la Cour de cassation) ; saisissable par **toute victime** |\n| **Instruction** | **Juge d'instruction** (à charge et à décharge), **chambre de l'instruction**, **juge des libertés et de la détention** |\n\n## SECTION 5 : Les juridictions du droit\n\n### I. La Cour de cassation\n- **Tribunal de cassation**, décret du **27 novembre 1790** ; **référé législatif** à l'origine.\n\n| Formation | Rôle |\n|---|---|\n| **6 chambres** | 3 civiles, commerciale, sociale, criminelle |\n| **Assemblée plénière** | Après un **second pourvoi** (résistance) : sa décision **s'impose** à la juridiction de renvoi ; ou question de principe |\n| **Chambre mixte** | **Au moins 3 chambres** : partage des voix, affaire relevant de plusieurs chambres, risque de divergence |\n| **Formation restreinte** | Créée en **1979**, **3 magistrats**, filtre les pourvois (loi du 23 avril 1997) |\n\n- **Pas un 3e degré** : elle **contrôle l'application du droit**.\n- **Rejet** (pourvoi non fondé) ou **cassation** avec **renvoi** devant une juridiction de même nature. Saisine **pour avis** possible.\n\n### II. Le Conseil d'État\n| Période | Évolution |\n|---|---|\n| **Napoléon** | Rôle surtout **consultatif** |\n| **1806** | Commission du contentieux : **justice retenue** |\n| **1849 / 1852** | Autonomie, puis retour à la justice retenue |\n| **Loi du 24 mai 1872** | **Justice déléguée** : juridiction autonome |\n\n- **Consultatif :** obligatoire sur les **projets de loi**, les **ordonnances**, certains décrets.\n- **Contentieux :** **juge de cassation** (cours administratives d'appel, créées par la loi du **31 décembre 1987**), **juge d'appel** résiduel, **juge de 1re instance** (décrets du Président et du Premier ministre, nominations de hauts fonctionnaires, élections européennes et régionales).\n- La Cour de cassation n'est **jamais** juge de 1re instance ni d'appel ; le Conseil d'État oui.\n\n## SECTION 6 : Les gens de justice\n\n| | Magistrats du **siège** | Magistrats du **parquet** |\n|---|---|---|\n| **Rôle** | **Jugent** ou instruisent | **Défendent les intérêts de la société** par **réquisitions** |\n| **Statut** | **Indépendants**, **inamovibles** | **Hiérarchisés** (garde des sceaux), **amovibles**, **interchangeables** |\n| **Sanctions** | **Conseil supérieur de la magistrature** | Le ministre, après **avis** du CSM |\n\n- Formation commune à l'**École nationale de la magistrature** (Bordeaux) ou recrutement **sur titre**.\n- **Juges consulaires** (commerce) : **élus**, **bénévoles**. **Conseillers prud'homaux** : désignés sur listes syndicales et patronales.\n\n| Auxiliaires | Statut |\n|---|---|\n| **Avocats** | Profession libérale : conseillent, assistent, représentent |\n| **Avocats aux Conseils** | Officiers ministériels devant le Conseil d'État et la Cour de cassation |\n| **Avoués** | Supprimés au **1er janvier 2012** |\n| **Greffiers** | Fonctionnaires (école à **Dijon**) : registre d'audience, rôle, signature des décisions, archives, **PACS**… |\n\n## SECTION 7 : Les juridictions européennes\n\n| | **CEDH** | **CJUE** |\n|---|---|---|\n| **Siège, origine** | **Strasbourg**, **1959** (Conseil de l'Europe) | **Luxembourg**, **traité de Paris de 1951** |\n| **Juges** | Un par État, élus par l'**assemblée parlementaire du Conseil de l'Europe** (aujourd'hui **9 ans non renouvelables**) | Un par État (**27**), nommés **6 ans** par les gouvernements ; **avocats généraux** |\n| **Saisine** | Tout **État** ou tout **particulier** victime, par **requête** | Recours en manquement, **renvoi préjudiciel**, pourvoi contre les décisions du **Tribunal** (créé en **1988**) |\n| **Décision** | Chambre, puis éventuellement **Grande Chambre** (demande dans les **3 mois**, collège de 5 juges) | |\n\n## À retenir pour l'examen\n- **Deux ordres, trois niveaux** ; le pourvoi n'est **pas** un 3e degré.\n- **Voies de recours :** ordinaires (appel = réformation, opposition = rétractation), extraordinaires (révision, tierce opposition, pourvoi).\n- **Cassation :** rejet ou cassation avec renvoi ; **assemblée plénière** après 2e pourvoi ; **chambre mixte** en cas de divergence.\n- **Conseil d'État :** justice retenue puis **déléguée** (1872) ; juge de 1re instance, d'appel et de cassation, et conseiller du gouvernement.\n- **Siège** (indépendant, inamovible) / **parquet** (hiérarchisé, amovible).\n- **CEDH** (Strasbourg, Conseil de l'Europe) / **CJUE** (Luxembourg, UE).\n\n## À vérifier dans ton support\n- « Tribunaux de grande instance » : **tribunaux judiciaires** depuis 2020.\n- Option civil/pénal : l'**action publique** appartient au ministère public, qui peut toujours poursuivre.\n- Pourvoi **suspensif** dans certaines matières (état des personnes, pénal).\n- **Cours criminelles départementales** (2021) : certains crimes jugés sans jurés.\n- **CEDH :** mandat de **9 ans** (Protocole 14), pas 6 ; « Grande Chambre » et non « assemblée plénière ».\n- **CJUE :** **27** juges (le cours dit 26) ; le cours omet le **renvoi préjudiciel**.\n- Le **Tribunal** s'appelait **tribunal de première instance** jusqu'en 2009.\n- Ajout hors cours : le **Tribunal des conflits** tranche les conflits de compétence entre les deux ordres."},{"key":"cl-13","course":"c2","subject":"prive","courseTitle":"L’organisation judiciaire","title":"Schéma des chemins juridictionnels","md":"# Schéma : les chemins juridictionnels français\n\n| Niveau | Judiciaire : civil | Judiciaire : pénal | Administratif |\n|---|---|---|---|\n| **1re instance, droit commun** | **Tribunal judiciaire** (compétence générale ; exclusive pour l'état des personnes et l'immobilier) | **Tribunal de police** (contraventions), **tribunal correctionnel** (délits), **cour d'assises** (crimes : 3 magistrats + 6 jurés) | **Tribunal administratif** |\n| **1re instance, spécialisées** | **Prud'hommes** (4 conseillers paritaires), **tribunal de commerce**, **baux ruraux** | **Juge des enfants**, juridictions militaires, **instruction** (juge d'instruction, JLD), **Haute Cour** (Président), **Cour de justice de la République** (ministres, 15 juges) | Formations disciplinaires, **Cour nationale du droit d'asile**, **Conseil d'État** en 1re instance (décrets, ordonnances) |\n| **Appel** (réformation, effet dévolutif) | **Cour d'appel** (36), chambres spécialisées | Cour d'appel (chambre correctionnelle), **chambre de l'instruction**, **cour d'assises d'appel** (3 magistrats + 9 jurés) | **Cour administrative d'appel** (depuis 1987), Conseil d'État (appel résiduel) |\n| **Cassation** (juge du droit, pas un 3e degré) | **Cour de cassation** : 3 chambres civiles, commerciale, sociale | **Cour de cassation** : chambre criminelle | **Conseil d'État** |\n| **Formations de la Cour de cassation** | Formation restreinte (3 magistrats), chambre mixte (divergence, partage), assemblée plénière (2e pourvoi, question majeure) | | |\n| **Europe** (après les voies internes) | **CEDH** (Strasbourg, Conseil de l'Europe) : requête d'un État ou d'un particulier | **CJUE** (Luxembourg, UE) : manquement, pourvoi contre le Tribunal, renvoi préjudiciel | |\n\n**Issue du pourvoi :** **rejet** (la décision devient définitive) ou **cassation** (renvoi devant une autre juridiction de même nature, puis **assemblée plénière** si la juridiction de renvoi résiste).\n\n**Recours :** ordinaires (appel devant la juridiction supérieure ; opposition devant la même juridiction, par la partie défaillante) ; extraordinaires (révision, tierce opposition, exclue au pénal, pourvoi en cassation).\n\n## À lire correctement\n- Le tribunal de police et le tribunal correctionnel sont des **formations du tribunal judiciaire**.\n- La cour d'assises a son propre appel (**cour d'assises d'appel**), qui n'est pas une cour d'appel.\n- Le **Conseil d'État** est juge de 1re instance, d'appel (résiduel) et de cassation ; la Cour de cassation jamais.\n- Hors cours : le **Tribunal des conflits** tranche les conflits de compétence entre les deux ordres ; le **renvoi préjudiciel** permet aux juges nationaux d'interroger la CJUE.\n\n## Qui sont les gens de justice et comment sont-ils nommés ?\n\n| Qui | Nomination ou recrutement | Statut et sanctions |\n|---|---|---|\n| **Magistrats du siège** (jugent, instruisent) | Décret du Président sur proposition du garde des sceaux (avis du CSM) ; ENM (Bordeaux) ou sur titre | Indépendants, inamovibles ; sanctions par le CSM |\n| **Magistrats du parquet** (réquisitions) | Même corps, même formation ; choix personnel siège / parquet | Subordonnés au ministre, amovibles ; sanctions par le ministre après avis du CSM |\n| **Juges consulaires** (commerce) | **Élus** (commerçants, délégués consulaires, CCI, anciens membres) | Bénévoles ; 2 ans puis 4 ans renouvelables |\n| **Conseillers prud'homaux** | Nommés par les ministres de la Justice et du Travail sur listes syndicales et patronales | Parité 2 salariés / 2 employeurs |\n| **Jurés d'assises** | Tirés au sort sur les listes électorales | 6 en 1re instance, 9 en appel |\n| **Greffiers** | Concours, école à Dijon | Registre, rôle, signature des décisions, archives, PACS |\n| **Avocats** | Barreau ; ont absorbé les avoués (2012) | Conseillent, assistent, représentent |\n| **Juges européens** | CEDH : élus par l'assemblée parlementaire du Conseil de l'Europe ; CJUE : nommés par les gouvernements | Indépendants des États |\n\n**Compositions utiles (en partie hors cours, à vérifier) :** chambres de la Cour de cassation à 5 membres délibérants, formation restreinte à 3 ; CEDH : chambre de 7 juges, Grande Chambre de 17 ; Haute Cour présidée par le président de l'Assemblée nationale."},{"key":"cl-14","course":"c3","subject":"prive","courseTitle":"Les droits subjectifs","title":"Les droits subjectifs : section 1, les sources","md":"# Fiche : Les droits subjectifs (Partie IV), Section 1 : les sources\n\n**Plan du cours :** 1. les **sources** des droits subjectifs ; 2. les **différents droits subjectifs** ; 3. leur **objet** ; 4. leur **exercice**.\n\n## I. Les deux sources : actes et faits juridiques\n\n| | Acte juridique | Fait juridique |\n|---|---|---|\n| **Définition** | Manifestation de **volonté** destinée à produire des effets de droit | **Événement** qui produit des effets de droit, indépendamment de la volonté de son auteur quant à ces effets |\n| **Catégories** | **Contrats** et **actes unilatéraux** | **Quasi-contrats**, **délits**, **quasi-délits** |\n\n- **Le contrat (art. 1101) :** accord de volontés destiné à **créer, modifier, transmettre ou éteindre** des obligations.\n- **L'acte unilatéral :** une seule volonté suffit (testament).\n\n## II. Les quasi-contrats\n\nFaits **volontaires** qui font naître des obligations (art. 1300).\n\n### A. La gestion d'affaires (art. 1301)\n| Élément | Contenu |\n|---|---|\n| **Principe** | Le **gérant** agit dans l'intérêt d'une autre personne sans **mandat** |\n| **Exemple** | Un conjoint fait des actes **conservatoires** sur un bien propre de l'autre, empêché ou négligent |\n| **Conditions** | Acte **volontaire**, dans l'**intérêt du géré**, **sans opposition**, **utile** |\n| **Effets** | Le **géré** (maître de l'affaire) est tenu des engagements pris en son nom ; il **indemnise** le gérant (dépenses **utiles ou nécessaires**) |\n\n### B. Le paiement de l'indu (art. 1302 s.)\n- Le **solvens** paie à tort l'**accipiens** ; il obtient la **restitution** (répétition).\n- Cas : dette inexistante, contrat annulé. **Pas de restitution** pour les **obligations naturelles volontairement acquittées**.\n\n### C. L'enrichissement injustifié (art. 1303)\n- Création **jurisprudentielle** (arrêt **Boudier**, 1892), consacrée par l'**ordonnance de 2016**.\n- Celui qui s'appauvrit obtient le remboursement de l'**enrichissement sans raison** de l'autre, dans la limite de la **moindre** des deux sommes ; action **subsidiaire**.\n- **Exemple :** un concubin finance la rénovation du bien de l'autre.\n\n## III. Les délits et quasi-délits\n\n| | Délit | Quasi-délit |\n|---|---|---|\n| **Faute** | **Intentionnelle** | **Négligence ou imprudence** |\n| **Effet** | **Responsabilité civile** : réparer | Idem |\n| **Base** | **Art. 1240** : « tout fait quelconque de l'homme, qui cause à autrui un dommage, oblige celui par la faute duquel il est arrivé à le réparer » | **Art. 1241** |\n\n## À retenir pour l'examen\n- **Deux sources** : actes juridiques (volonté) et faits juridiques (événements).\n- **Trois quasi-contrats** : gestion d'affaires, paiement de l'indu, enrichissement injustifié.\n- **Vocabulaire** : gérant / géré, solvens / accipiens.\n- **Délit** (intentionnel) / **quasi-délit** (non intentionnel).\n\n## À vérifier dans ton support\n- L'**art. 1100** cite **trois** sources des obligations : actes juridiques, faits juridiques et **autorité seule de la loi**.\n- La **donation** est en principe un **contrat** (acceptation du donataire) ; le **testament** est un acte unilatéral.\n- **Dette prescrite :** l'**art. 2249** interdit de répéter un paiement au seul motif que la prescription était acquise.\n- La responsabilité civile couvre aussi le **fait des choses** et des **personnes dont on répond** (art. 1242)."},{"key":"cl-15","course":"c3","subject":"prive","courseTitle":"Les droits subjectifs","title":"Les droits subjectifs : section 2, les différents droits subjectifs","md":"# Fiche : Les droits subjectifs (Partie IV), Section 2 : les différents droits subjectifs\n\n## I. Personnalité juridique et patrimoine\n- **Personnalité juridique :** dès la **naissance** (personne physique) ou la **création** (personne morale) ; elle emporte des **droits subjectifs** et un **patrimoine**.\n- **Toute personne a nécessairement un patrimoine**, même sans aucun bien.\n\n| | Théorie classique (Aubry et Rau) | Patrimoine d'affectation (conception moderne) |\n|---|---|---|\n| **Lien avec la personnalité** | **Émanation de la personnalité** | Patrimoine et personnalité **distincts** |\n| **Définition** | Aptitude à être titulaire de droits et obligations patrimoniaux, **actuels ou potentiels** | Masse de biens affectée à un but |\n| **Caractères** | **Unique**, **indivisible**, **intransmissible** entre vifs | Patrimoine **sans sujet** possible (fondations, débattu) |\n| **Conséquence** | Une personne = un seul patrimoine | **Plusieurs patrimoines** possibles (privé / professionnel) |\n\n## II. Droits patrimoniaux et extrapatrimoniaux\n\n| | **Patrimoniaux** | **Extrapatrimoniaux** |\n|---|---|---|\n| **Critère** | **Évaluables en argent** | **Non évaluables** |\n| **Cessibles** (entre vivants) | **Oui** | **Non** |\n| **Saisissables** | **Oui** | **Non** |\n| **Transmissibles** (au décès) | **Oui** | **Non** (nuances) |\n| **Prescriptibles** | **Oui** | **Non**, en principe |\n\n## III. Les droits patrimoniaux : trois catégories\n\n### A. Les droits réels (sur une **chose**)\n| Type | Définition | Exemples |\n|---|---|---|\n| **Propriété** | Le droit réel le plus **parfait** | |\n| **Démembrés** | Certaines prérogatives seulement | **Usufruit** : **user et jouir**, pas **disposer** |\n| **Accessoires** | Garantissent une **créance** sur un bien du débiteur | **Hypothèque**, **gage** |\n\nLe créancier titulaire d'un droit réel accessoire a un **droit de suite** (suivre la chose en quelque main qu'elle se trouve) et un **droit de préférence** (être payé **par priorité** sur le prix).\n\n### B. Les droits personnels (de créance)\nDroits du **créancier** à l'encontre de son **débiteur**.\n\n### C. Les droits intellectuels\nCatégorie **intermédiaire** : évaluables en argent, mais ni contre une personne ni sur une chose corporelle (droits de l'**auteur**, **clientèle**).\n\n| | Droits réels | Droits personnels |\n|---|---|---|\n| **Opposables à** | **Tous** (absolus) | Le **débiteur** seulement (relatifs) |\n\n## IV. Les droits extrapatrimoniaux : quatre catégories\n| Catégorie | Exemples |\n|---|---|\n| **Civiques et politiques** | Droit de vote |\n| **Droits de la personnalité** | Vie, intégrité corporelle, nom, honneur, vie privée, image |\n| **Droits familiaux** | Entre époux (fidélité, assistance) ; entre parents et enfants (garde, éducation) |\n| **Droits intellectuels non évaluables** | Droit moral de l'auteur (contre le plagiat, ne pas divulguer) |\n\nUne atteinte se répare souvent par des **dommages et intérêts**, mais le droit lui-même n'est pas évaluable.\n\n## V. Les caractères des droits extrapatrimoniaux\n| Caractère | Explication |\n|---|---|\n| **Incessibles et insaisissables** | **Hors du commerce** |\n| **Renonciation impossible** | Nulles : renonciations à l'**autorité parentale** ou aux actions en **filiation** |\n| **Intransmissibles** | Avec des nuances admises par la loi ou la jurisprudence |\n| **Imprescriptibles, en principe** | Mais actions en justice enfermées dans des délais (30 ans, 10 ans en filiation) ; **prescription acquisitive du nom** après une possession centenaire (selon le cours) |\n\n## À retenir pour l'examen\n- **Patrimoine :** conception classique (un seul, lié à la personne) / patrimoine d'affectation (plusieurs).\n- **Patrimoniaux :** cessibles, saisissables, transmissibles, prescriptibles. **Extrapatrimoniaux :** l'inverse.\n- **Réels** (absolus), **personnels** (relatifs), **intellectuels** (intermédiaires).\n\n## À vérifier dans ton support\n- « Trois obligations de nature patrimoniale » : lire « des **droits et obligations** ».\n- Patrimoine d'affectation : exemples classiques, l'**entrepreneur individuel** (loi du **14 février 2022**) et la **fiducie** (art. 2011) ; l'exemple de l'EURL est discutable.\n- **Prescription :** loi du **17 juin 2008**, droit commun de **5 ans** (art. 2224) ; 30 ans pour les actions réelles immobilières (art. 2227) ; 10 ans en filiation (art. 321)."},{"key":"cl-16","course":"c3","subject":"prive","courseTitle":"Les droits subjectifs","title":"Les droits subjectifs : section 3, les biens","md":"# Fiche : Les droits subjectifs (Partie IV), Section 3 : les biens, objets des droits subjectifs\n\n## I. Vue d'ensemble\nLes biens sont l'**objet des droits subjectifs** : les **choses** (corporels) et les **droits** (incorporels).\n\n| | Biens corporels | Biens incorporels |\n|---|---|---|\n| **Contenu** | Les **choses** matérialisables | Les **droits** du patrimoine : droits sur les choses, droits personnels, propriété littéraire, artistique et industrielle |\n\n## II. Les immeubles (art. 517 s.)\n| Catégorie | Définition | Exemples |\n|---|---|---|\n| **Par nature** | Biens qui **ne peuvent pas être déplacés** | Terrains, maisons |\n| **Par leur objet** | **Droits portant sur des immeubles** | Usufruit d'un immeuble |\n| **Par destination** | **Meubles** rattachés à l'immeuble | Voir ci-dessous |\n\n**Immeuble par destination :** même **propriétaire** du meuble et de l'immeuble, et **affectation** du meuble à l'immeuble.\n\n| | Affectation matérielle | Affectation intellectuelle |\n|---|---|---|\n| **Principe** | Meuble **attaché à perpétuelle demeure** (art. 525) : ne peut être détaché sans **détérioration** | **Volonté** de mettre le meuble **au service du fonds** (but économique) |\n| **Exemples** | Statues ou tableaux scellés, cuisines intégrées | **Art. 524** : animaux attachés à la culture, ustensiles aratoires, semences, ruches |\n\n- La liste de l'art. 524 n'est **pas limitative** (exploitation commerciale).\n- **Régime :** celui de l'immeuble (ils peuvent être **hypothéqués**).\n\n## III. Les meubles (art. 527 s.)\n| Catégorie | Définition | Exemples |\n|---|---|---|\n| **Par nature** | Se **transportent**, seuls ou par une force étrangère | Vêtement, tableau, animal, voiture |\n| **Par effet de la loi** | **Droits** sur des meubles, **créances**, droits **intellectuels** | |\n| **Par anticipation** | **Immeubles destinés à être détachés** | Récoltes sur pied, matériaux d'une carrière |\n\n## IV. La classification des choses\n\n| Opposition | Première catégorie | Seconde catégorie |\n|---|---|---|\n| **Fongibles / non fongibles** | **Choses de genre**, interchangeables (billets, sacs de blé) | **Corps certains**, individualisés (œuvre d'art, immeuble) |\n| **Consomptibles / non consomptibles** | Se **consomment par l'usage** (nourriture, essence) | Usage répété **sans altération** (véhicule, électroménager) |\n| **Frugifères / non frugifères** | Produisent des **fruits** : périodiques, **sans altérer la substance** (fruits d'un arbre, loyers) | **Produits** : occasionnels, **diminuent la substance** (matériaux d'une carrière) |\n\n| Selon l'appropriation | Définition | Exemples |\n|---|---|---|\n| **Choses appropriées** | Ont un **propriétaire** | |\n| **Choses sans maître** | **Abandonnées**, appropriables | Meubles abandonnés |\n| **Choses communes** (art. 714) | À **personne**, usage commun à tous | Eau, lumière, air |\n\n## À retenir pour l'examen\n- **Biens** = choses (corporels) + droits (incorporels).\n- **Immeubles** : par nature, par objet, par destination (affectation matérielle ou intellectuelle).\n- **Meubles** : par nature, par effet de la loi, par anticipation.\n- **Fruits ≠ produits.**\n\n## À vérifier dans ton support\n- **Immeubles par nature :** le cours dit qu'ils « peuvent se déplacer » ; c'est **l'inverse**.\n- **Gage / hypothèque :** un meuble peut être **gagé** ; seul un immeuble (y compris par destination) peut être **hypothéqué**. Le cours inverse.\n- **Immeubles sans maître :** ils reviennent en principe à la **commune** ou à l'**État**.\n- « Selon leur affectation » : il s'agit en réalité de leur **appropriation**."},{"key":"cl-17","course":"c3","subject":"prive","courseTitle":"Les droits subjectifs","title":"Les droits subjectifs : section 4, l'exercice préjudiciable (abus de droit, troubles de voisinage)","md":"# Fiche : Les droits subjectifs (Partie IV), Section 4 : l'exercice préjudiciable des droits subjectifs\n\n## I. L'abus de droit : notion et débat doctrinal\n**Définition :** l'exercice préjudiciable d'un droit subjectif s'appelle l'**abus de droit**. Le Code civil de 1804 ne lui fait **aucune place** ; la notion apparaît dans des litiges entre **propriétaires voisins**.\n\n| | Planiol | Josserand |\n|---|---|---|\n| **Position** | L'abus de droit est un **non-sens** | Les deux notions ne sont **pas antinomiques** |\n| **Argument** | On ne peut pas à la fois **exercer un droit** et **en abuser** | Abus = **méconnaître la finalité sociale** du droit (conception **finaliste**) |\n\nLa jurisprudence suit Josserand : l'exercice du droit de propriété a pour limite la **satisfaction d'un intérêt sérieux et légitime**.\n\n## II. Les décisions marquantes\n| Décision | Faits | Solution |\n|---|---|---|\n| **CA Colmar, 2 mai 1855** | **Fausse cheminée** sans utilité, pour **priver de lumière** le voisin | **Exercice abusif** du droit |\n| **Trib. Sedan, 17 déc. 1901** | | Retient aussi l'abus de droit |\n| **Req., 3 août 1915, Clément-Bayard** | Coquerel installe des **carcasses en bois** surmontées de **piquets en fer** face au **hangar à dirigeables** de son voisin | Abus de droit : **unique but de nuire** |\n\n**Clément-Bayard** = **arrêt de principe**.\n\n## III. L'extension de la notion\n1. **Droit de propriété** (domaine initial). 2. **Droits démembrés**. 3. Matières **commerciale**, **contractuelle**, **procédurale**.\n\n## IV. Fondement et critères\n- **Fondement :** responsabilité pour faute (art. 1382 anc., aujourd'hui **art. 1240**).\n- L'acte est **objectivement licite** : on sanctionne l'**usage fautif d'un droit**.\n- **Critère :** usage à des fins **malicieuses**, **intention de nuire** ; exercice sans **intérêt sérieux et légitime**.\n- **Sanction :** le plus souvent **dommages et intérêts**.\n\n## V. Le trouble anormal de voisinage\n### A. Principe\n- Préjudice causé **sans faute** ; chacun supporte les **inconvénients normaux**, seuls les **anormaux** sont sanctionnés.\n- Ex. : restaurateurs (bruit, odeurs). Dès **1844**, réparation pour les riverains d'une usine (**fumées**) sans intention de nuire.\n\n### B. Fondements proposés puis écartés\n| Fondement | Idée | Pourquoi écarté |\n|---|---|---|\n| **Faute** | Le trouble suppose une faute | Pas nécessairement de faute |\n| **Risque** (Starck) | L'activité crée un risque | Trouble possible **sans risque** |\n| **Immixtion** | Empiétement sur la propriété d'autrui | Pas toujours le cas |\n| **Fait des choses** (art. 1384 al. 1 anc.) | La chose cause le dommage | Suppose le **rôle actif d'une chose** |\n\n→ Responsabilité **sui generis**.\n\n### C. Régime\n- Troubles **souverainement appréciés** par les juges, dépassant les **inconvénients normaux**.\n- Ex. : **riverains des aéroports** (resp. de plein droit pour dommages causés par les aéronefs).\n- **Principe général du droit :** *nul ne doit causer à autrui un trouble anormal de voisinage*.\n\n| | Abus de droit | Trouble anormal de voisinage |\n|---|---|---|\n| **Domaine** | Très **large** | Litiges entre occupants de **fonds distincts** |\n| **Condition** | **Intention de nuire** | **Préjudice anormal**, pas de faute |\n\n- Peuvent agir : propriétaires, **locataires**, **simples occupants** ; fonds **pas forcément contigus**.\n- **Réparation :** dommages et intérêts ou **travaux** (insonorisation, etc.).\n\n### D. Consécration législative\n**Loi du 15 avril 2024 → art. 1253 C. civ.** : responsabilité **de plein droit** du propriétaire, locataire, occupant sans titre, bénéficiaire d'un titre d'occupation, **maître d'ouvrage**.\n**Exception (antériorité) :** activités existant **avant** l'arrivée de la victime, **conformes aux lois** et poursuivies dans les **mêmes conditions** (sans aggravation). Réserve de l'art. L. 311-1-1 C. rural.\n\n## À retenir pour l'examen\n- **Abus de droit** = intention de nuire / absence d'intérêt sérieux et légitime ; acte licite, exercice fautif.\n- **Planiol** vs **Josserand** ; **Clément-Bayard (1915)**.\n- **Trouble anormal** = sans faute → sui generis → PGD → **art. 1253 (2024)**.\n\n## À vérifier dans ton support\n- Art. 1382 / 1384 al. 1 = aujourd'hui **1240 / 1242 al. 1**.\n- « Insatisfaction » d'un intérêt sérieux : lire **satisfaction**.\n- Trib. Sedan 1901 : référence à vérifier.\n- Clément-Bayard : la condamnation incluait aussi la **suppression des ouvrages** (à confirmer).\n- PGD : formule issue de **Civ. 3e, 1986** (à confirmer).\n- Art. L141-2 C. aviation civile → aujourd'hui **Code des transports** (L. 6131-2, à vérifier).\n- Art. 1253 : exige un trouble **excédant les inconvénients normaux**, pas un préjudice « grave »."},{"key":"cl-18","course":"c3","subject":"prive","courseTitle":"Les droits subjectifs","title":"Les droits subjectifs : section 5, la fraude","md":"# Fiche : Les droits subjectifs (Partie IV), Section 5 : la fraude et l'exercice des droits subjectifs\n\n## I. Les deux types de fraude\n| | Fraude à la loi | Fraude aux droits des tiers |\n|---|---|---|\n| **Principe** | Tenir en **échec les règles de droit applicables** | Échapper à une règle **au détriment d'une autre personne** (ex. un **créancier**) |\n| **Exemples du cours** | Dissimuler des **éléments comptables** pour échapper à l'impôt ; **mariage à des fins non matrimoniales** (nationalité) | **Changer de régime matrimonial** pour soustraire des biens aux **créanciers** |\n\n## II. Les éléments constitutifs\n| Élément | Contenu |\n|---|---|\n| **Matériel** | Des **manœuvres** destinées à faire échec à la loi ou à **tromper des tiers** |\n| **Moral** | L'**intention frauduleuse** (connaissance du caractère frauduleux) = **mauvaise foi** |\n\n**Fraude aux droits des tiers :** l'**intention de nuire n'est pas exigée**.\n\n## III. L'idée directrice : Ripert\n*La règle morale dans les obligations civiles* : le juge se reconnaît le pouvoir d'**enlever au coupable les avantages** de la situation juridique qu'il croyait acquérir → l'auteur de la fraude ne doit **pas en tirer profit**.\n\n## IV. Les sanctions\n| Sanction | Contenu |\n|---|---|\n| **Annulation** | L'acte frauduleux peut être attaqué et annulé |\n| **Inopposabilité** | Droits créés **inopposables aux tiers** |\n| **Dommages et intérêts** | Indemnisation des **tiers lésés** |\n| **Sanction pénale** | Dans certains cas |\n\n**But :** priver d'effet l'acte et **réparer le préjudice**.\n\n## V. L'action paulienne\n- **Art. 1341-2 C. civ.** : les créanciers peuvent, **en leur nom personnel**, attaquer les actes faits par leur débiteur **en fraude de leurs droits**.\n- Ex. : attaquer un **changement de régime matrimonial** fait au mépris de leur **droit de gage général**.\n\n## À retenir pour l'examen\n- **Deux fraudes :** à la **loi** / aux **droits des tiers**.\n- **Deux éléments :** matériel + moral.\n- **Sanctions :** annulation, inopposabilité, D&I, parfois pénale.\n- **Action paulienne (art. 1341-2).** Adage : *fraus omnia corrumpit*.\n\n## À vérifier dans ton support\n- **Fraude à la loi au sens strict :** usage de **moyens licites** pour détourner une règle impérative (ex. **Princesse de Bauffremont**, 1878). La dissimulation comptable relève plutôt de la **fraude fiscale**.\n- **Mariage pour la nationalité :** plutôt **mariage de complaisance** (simulation).\n- **Action paulienne :** conduit à l'**inopposabilité** de l'acte au créancier, pas à sa nullité.\n- **Art. 1341-2 :** pour un acte **à titre onéreux**, le créancier doit prouver que le cocontractant **connaissait la fraude** (à confirmer).\n- **Conditions classiques :** créance antérieure, acte appauvrissant, fraude.\n- **Changement de régime :** recours spécifique (**art. 1397**), à vérifier."},{"key":"cl-19","course":"c3","subject":"prive","courseTitle":"Les droits subjectifs","title":"Les droits subjectifs : section 6, l'apparence","md":"# Fiche : Les droits subjectifs (Partie IV), Section 6 : l'apparence et les droits subjectifs\n\n## I. La notion d'apparence\n- **Rôle :** contrecarrer ou nuancer l'exercice des droits subjectifs.\n- **Histoire :** fin du **XIXe siècle**, impulsion de la **doctrine** puis consécration **jurisprudentielle**.\n- **Définition :** situation qui **paraît** créer un droit ou être conforme au droit, mais qui **masque** une réalité non conforme.\n- Protège les **tiers de bonne foi** qui ignorent la réalité juridique.\n- **Exemple :** l'**héritier apparent**.\n\n## II. Les fondements\n| Fondement | Idée | Exemple du cours |\n|---|---|---|\n| **Risque** | Celui qui a **laissé se créer l'apparence** est engagé même sans faute | **Dirigeant de fait** d'une société |\n| **Intérêt général** | Protection des tiers = **ordre public** | |\n| **Responsabilité** | La **faute** de celui qui a laissé se créer l'apparence | **Banque** créant une **apparence de solvabilité** |\n| **Correction des faits** | Même sans faute, rendre les faits conformes au droit | **Héritier apparent** |\n\nIdée commune : **qui a cru de bonne foi à une situation doit pouvoir s'en prévaloir**. Trace dans le Code : la **possession**.\n\n## III. Les conditions\nUne **croyance erronée** en l'existence de droits. L'erreur doit être :\n| Caractère | Définition |\n|---|---|\n| **Commune** | Elle **aurait pu être commise par tous** |\n| **Invincible** | Même un **professionnel avisé** ne l'aurait pas décelée |\n| **Légitime** | Le tiers a pris **toutes les précautions** d'une personne avisée |\n\nCass. : la légitimité suppose des circonstances autorisant à **ne pas vérifier les pouvoirs** de celui qui agit.\n\n## IV. Les effets\n- L'apparence ne crée pas vraiment de droits : elle confère des droits **pour protéger la victime**.\n- Elle est **traitée comme une réalité** : domicile, capacité, qualité d'associé ou d'époux apparents.\n- **Option du tiers :** nullité de l'acte, ou acte produisant ses effets conformément à l'apparence.\n\n## À retenir pour l'examen\n- **Apparence** protège le **tiers de bonne foi**.\n- **Fondements :** risque, responsabilité, correction des faits.\n- **Conditions :** erreur **commune, invincible, légitime** — *error communis facit jus*.\n\n## À vérifier dans ton support\n- Définition du cours (« ce qui correspond à la réalité ») : lire **ne correspond pas toujours**.\n- **Mandat apparent :** Ass. plén. **13 déc. 1962** se contente d'une **croyance légitime** ; aujourd'hui **art. 1156** (à confirmer).\n- Trace classique : **art. 2276** (« en fait de meubles, la possession vaut titre ») ; **possession d'état**.\n- Justification classique : **sécurité des transactions**.\n- Dirigeant **de fait** ≠ dirigeant **apparent**.\n- Soutien abusif de crédit limité par **art. L650-1 C. com.** (loi de 2005).\n- Héritier apparent : ce sont surtout les **actes conclus avec lui** par des tiers de bonne foi qui sont maintenus."},{"key":"cl-20","course":"c4","subject":"prive","courseTitle":"Les règles gouvernant la preuve","title":"La preuve des droits subjectifs : introduction et charge de la preuve","md":"# Fiche : La preuve des droits subjectifs (Partie V), introduction et Section 1 : la charge de la preuve\n\n## I. Introduction : pourquoi la preuve ?\nÊtre titulaire d'un droit ne suffit pas : il faut pouvoir **le prouver** dans un litige.\n\n**C. Ayela** (Gaz. Pal., 14 févr. 2012) : le droit de la preuve recherche une vérité **sociologiquement acceptable par tous**, dans les limites de la **fiabilité** et de la **crédibilité** de la preuve. Le droit français est **libéral** : le principe est la **liberté probatoire**, pas l'écrit.\n\n**Plan :** 1. **Charge** de la preuve. 2. **Objet**. 3. **Systèmes** de preuve. 4. **Administration** de la preuve.\n\n## II. Le principe : la charge pèse sur le demandeur\n**Art. 1353 C. civ. :** celui qui **réclame l'exécution** d'une obligation doit la **prouver** ; celui qui **se prétend libéré** doit justifier le **paiement** ou le fait extinctif.\n- **Justification :** le juge ne peut statuer sur de simples **affirmations**.\n- **Ex. :** le créancier d'une somme prouve la **prestation** ou la **livraison**.\n\n## III. Le va-et-vient de la preuve\nLe défendeur peut **nier** ou former une **demande reconventionnelle**.\n| | Contenu |\n|---|---|\n| **Règle** | La charge pèse sur le demandeur **à une prétention**, pas forcément au procès |\n| **Conséquence** | Elle pèse **alternativement** sur chaque partie : **va-et-vient** |\n| **Défendeur** | Demandeur pour **ses propres prétentions** |\n\n## IV. Les dérogations : les présomptions légales\nElles **renversent** la charge ou **dispensent** de preuve : à l'adversaire de prouver la **fausseté** des faits présumés.\n\n### A. Art. 2276 : « en fait de meubles, la possession vaut titre »\n| Situation | Solution |\n|---|---|\n| **Possesseur** | **Présumé propriétaire**, dispensé de preuve |\n| **Propriétaire revendiquant** | Doit **prouver** sa propriété |\n| Acquis d'un **non-propriétaire** | Protégé : **fonction acquisitive** |\n| Tenu **du vrai propriétaire** | Ce dernier prouve l'absence d'**acte translatif** |\n\n### B. Art. 312 : présomption de paternité\n- Le **mari de la mère** d'un enfant **conçu ou né pendant le mariage** est **présumé père**.\n- Celui qui conteste doit prouver que la présomption ne joue pas.\n\n## À retenir pour l'examen\n- **Art. 1353 :** *actori incumbit probatio*.\n- **Va-et-vient** : *reus in excipiendo fit actor*.\n- **Présomptions légales :** art. **2276** et art. **312**.\n- **Liberté probatoire** de principe.\n\n## À vérifier dans ton support\n- **Liberté probatoire :** surtout pour les **faits juridiques** et en **matière commerciale** ; **écrit** exigé pour les actes juridiques civils > **1 500 €** (art. 1359).\n- **Présomptions simples** vs **irréfragables** (art. 1354 s.).\n- **Art. 2276 :** suppose la **bonne foi** ; chose **perdue ou volée** revendicable pendant **3 ans**. Deux fonctions : **probatoire** et **acquisitive**.\n- **Art. 312 :** écartée dans les cas de l'**art. 313** ; contestation (art. 332 s.) ouverte aussi à l'enfant, la mère, le père biologique.\n- Demande reconventionnelle : **art. 64 CPC** (à confirmer)."},{"key":"cl-21","course":"c4","subject":"prive","courseTitle":"Les règles gouvernant la preuve","title":"La preuve : section 2, l'objet de la preuve","md":"# Fiche : La preuve des droits subjectifs (Partie V), Section 2 : l'objet de la preuve\n\n## I. Le principe : on prouve les faits, pas le droit\n| Article CPC | Règle |\n|---|---|\n| **Art. 6** | Les parties doivent **alléguer les faits** propres à fonder leurs prétentions |\n| **Art. 7** | Le juge ne peut fonder sa décision sur des faits **hors du débat** |\n| **Art. 8** | Le juge peut inviter les parties à fournir des **explications de fait** |\n\n- L'objet de la preuve = les **faits**.\n- La **règle de droit** n'a pas à être prouvée : le juge est **censé connaître la loi** (*jura novit curia*). Les parties visent seulement la règle applicable.\n\n## II. Quels faits prouver ?\n| Condition | Contenu |\n|---|---|\n| **Allégués** | Invoqués **au soutien des prétentions** |\n| **Pertinents** | De nature à **influer sur la solution** |\n| **Contestés** | Inutile de prouver un fait **admis** par l'adversaire |\n\nLe juge peut toutefois **vérifier personnellement** certains faits.\n\n## III. Première entorse : faits dispensés de preuve\n- **A. Présomptions légales** (voir section 1).\n- **B. Responsabilités sans faute prouvée** : gardien d'une chose, employeur (fait du salarié), parents (enfants mineurs).\n- **C. Obligation de résultat** : **transport** (ex. passager blessé dans un wagon SNCF), établissements de santé (**infections nosocomiales**).\n\n## IV. Seconde entorse : du droit à prouver\n### A. La loi étrangère\n- La présomption de connaissance ne vaut que pour la **loi française**.\n- S'applique par les règles de **conflit de lois** ou pour vérifier l'**ordre public**.\n- **Preuve par tous moyens** : **certificats de coutume**, **traductions**, **avis** d'autorités juridiques.\n- **À défaut :** le juge applique la **loi française**.\n\n| | Contenu |\n|---|---|\n| **Droits indisponibles** | Le **juge** doit **rechercher la teneur** de la loi étrangère (Cass. 1re civ., 2002 selon le cours) |\n| **Droits disponibles** | Jurisprudence **peu claire** ; en principe les parties prouvent |\n\n### B. Les usages\nLes parties prouvent la règle issue d'un **usage** (surtout **locaux** et **professionnels**).\n\n## À retenir pour l'examen\n- On prouve les **faits** (*da mihi factum, dabo tibi jus*).\n- Faits **allégués, pertinents, contestés**.\n- Dispenses : présomptions, responsabilités sans faute, obligations de résultat.\n- Droit à prouver : **loi étrangère** et **usages**.\n\n## À vérifier dans ton support\n- **Art. 7 al. 2 CPC :** le juge **peut** prendre en considération les faits non spécialement invoqués (le cours inverse).\n- Faits admis : terme exact **aveu judiciaire** (art. 1383 s.).\n- **Art. 12 CPC :** le juge tranche selon les règles de droit et requalifie.\n- Responsabilités : **gardien** (art. 1242 al. 1), commettants (al. 5), parents (al. 4).\n- Obligation de résultat : exonération seulement par une **cause étrangère**.\n- Infections nosocomiales : régime **légal** (loi du **4 mars 2002**, art. L. 1142-1 CSP).\n- Loi étrangère : arrêts **Rebouh** (1994), **Aubin** et **Coucke** (2005) ; l'arrêt de 2002 est à vérifier.\n- **Faits notoires** dispensés de preuve."},{"key":"cl-22","course":"c20","subject":"histoire","courseTitle":"L’héritage romain","title":"Introduction historique au droit : cours 1, introduction à la matière","md":"# Fiche de révision : Introduction historique au droit (Cours 1)\n\n## L'essentiel en 30 secondes\nL'histoire du droit étudie le droit qui n'est plus en vigueur pour mieux comprendre le droit d'aujourd'hui, qui est un héritage et non une création à partir de rien.\n1. **Le droit positif a une histoire** : il n'est pas né *ex nihilo* (continuité ou rupture).\n2. **Portalis (Code civil, 1804)** : *esprit du siècle* (innovation) + *esprit des siècles* (expérience).\n3. **Pouvoir et droit sont liés** : plus le pouvoir est concentré, moins il y a de sources du droit.\n4. **Deux origines du mot « droit »** : *rectus / reg* (la ligne droite, le pouvoir) et *ius* (le droit comme science).\n5. **L'histoire est une enquête** (*historia*, Hérodote), découpée en périodes (476, 1453, 1789).\n\n## Pourquoi étudier l'histoire du droit ?\nLe droit positif est une construction : certaines règles des codes actuels sont plus anciennes que les codes eux-mêmes.\n\n**Le droit, outil de régulation sociale** : il suit la société (la rattrape ou la devance), dans un esprit de **continuité** ou de **rupture**.\n\n**Portalis** (avec Maleville, Tronchet et Bigot de Préameneux, rédacteurs du Code civil de 1804) :\n| | Esprit **du** siècle | Esprit **des** siècles |\n|---|---|---|\n| Époque visée | XVIIIe et début XIXe | La longue histoire du droit |\n| Apport | Innovations, rupture | Expérience des générations de juristes |\n| Défaut | Manque de maturité et d'ancrage pratique | À relire selon les besoins de la société |\n\nCitation : « les lois sont faites pour les hommes et non les hommes pour les lois ». Astuce : *LE* siècle = un seul ; *LES* siècles = toute l'histoire.\n\n- **Pierre Hébraud** : l'histoire est « le signe et le témoin des facteurs permanents ».\n- **Montesquieu** (*L'Esprit des lois*) : éclairer l'histoire par les lois et les lois par l'histoire.\n- Le droit est une **science sociale** (jeu de miroir avec la société).\n\n**Trois intérêts** : mesurer l'**héritage** ; **relativiser** le droit ; montrer le lien **pouvoir / système juridique**.\n\n## Pouvoir et sources du droit\n| Régime | Pouvoir | Sources du droit |\n|---|---|---|\n| Concentré (extrême) | Le souverain décide de tout | **Unique législateur** |\n| Partagé | Plusieurs organes | **Nombreuses** (même la **coutume**, née sans les autorités) |\n\nMémo : *pouvoir qui monte, sources qui descendent*.\n\n## Définir le droit\n***Ubi societas, ibi ius*** (XVIe s.) : là où il y a une société, il y a du droit. Le droit = règles qui s'imposent au groupe, avec une **sanction** (privilège du souverain).\n\n| | Droit **objectif** | Droits **subjectifs** |\n|---|---|---|\n| Définition | Normes contraignantes organisant le groupe | Prérogatives des individus |\n| Exemple | « Le droit français interdit le vol » | « J'ai un droit de propriété sur mon vélo » |\n\n## L'étymologie du mot « droit »\n| | *rectus* (*reg*) | *ius* |\n|---|---|---|\n| Sens | Mouvement en ligne droite | Le droit comme objet d'étude |\n| Mots | droit, règle, régir, rigueur, *rex* (roi) | juridique, juge, justice, juridiction, jurisprudence |\n| Idée | **Pouvoir de commandement** + règles obligatoires | **Science distincte** de la morale, religion, tradition |\n\n- Le droit est un **contenant** (pouvoir) et un **contenu** (règles).\n- Héritage romain → **droit continental (romaniste)** vs **Common Law**.\n\nMnémo : **R**eg = **R**oi et **R**ègle ; **I**us = **I**ntellectuel.\n\n## L'histoire comme enquête\n- *historia* = **enquête** : on parle d'**une** histoire du droit.\n- **Hérodote** († v. 425 av. J.-C.), « Père de l'Histoire » (Cicéron) : *L'Enquête*, sur les **guerres médiques** ; explique **contexte, acteurs, causes**.\n- **Humilité sans relativisme** : l'historien est contraint par les sources. Mémo : un **enquêteur**, pas un **artiste**.\n\n## La périodisation : 476, 1453, 1789\n| Période | Fin | Événement |\n|---|---|---|\n| **Antiquité** | **476** | Chute de l'Empire romain d'Occident |\n| **Moyen Âge** | **1453** | Chute de l'Empire romain d'Orient |\n| **Époque moderne / Ancien Régime** | **1789** | Révolution française |\n| **Période contemporaine** | — | En cours |\n\nMoyen Âge : **Haut** (→ XIe s.), **central** (XIe-XIIIe, redécouverte du droit romain), **Bas** (XIVe-XVe).\n\nNoms rétrospectifs : *moyenâgeux* péjoratif (préférer **médiéval**), *Époque moderne* **laudatif**, *Ancien Régime* **péjoratif**.\n\n**Limites** : dates créées *a posteriori* ; aucun événement isolé ne change tout. **Jacques Le Goff**, *Faut-il vraiment découper l'histoire en tranches ?* Réflexe : le **contexte**.\n\n## Auto-test\n| Question | Réponse |\n|---|---|\n| Qu'étudie l'histoire du droit ? | Le droit qui n'est plus en vigueur |\n| Que oppose Portalis ? | Esprit du siècle / esprit des siècles |\n| Pouvoir concentré → sources ? | Moins nombreuses |\n| *Ubi societas, ibi ius* ? | Là où il y a une société, il y a du droit |\n| Deux racines de « droit » ? | *rectus* (*reg*) et *ius* |\n| *historia* ? | Enquête |\n| Père de l'Histoire ? | Hérodote |\n| Trois dates charnières ? | 476, 1453, 1789 |\n| Nom péjoratif de 1453-1789 ? | Ancien Régime |"},{"key":"cl-23","course":"c20","subject":"histoire","courseTitle":"L’héritage romain","title":"Introduction historique au droit : présentation de la matière et de l'examen","md":"# Résumé : Introduction historique au droit (présentation)\n\n## L'essentiel du cours\n- **Objet** : étudier les systèmes de droit anciens ; c'est aussi une forme de **droit comparé** qui met en perspective le droit actuel.\n- **Approche** : le droit est une création humaine → étudier le **contexte** (politique, économie, religion, morale, sciences, art…).\n- **Plan** : chronologique, **de Rome au début du XIXe siècle** (codifications napoléoniennes).\n\n## Les outils\n- **Cours audio** : contient tout ce qu'il faut pour l'examen. Écoute **active** (notes, frises, schémas), puis questionne-toi et réécoute si besoin.\n- **Document de travail** : photos, cartes, sources historiques.\n- **Regroupements** (Zoom) : le 1er = introduction ; les **2e et 3e** = **examens blancs** corrigés en direct.\n- **Permanences** : questions par mail à floriane.massena@univ-paris1.fr **au plus tard 24 h avant**.\n- **Bulletins de liaison** : corrections écrites des examens blancs.\n- **QCM** : après chaque piste audio.\n\n## Bibliographie (facultative)\nCarbasse (*Manuel d'introduction historique au droit*, PUF), Gasparini et Gojosso (Gualino), Henning (Dalloz Hypercours), Lovisi (Dalloz) ; cours en ligne **UNJF**.\n\n## L'examen\n- Écrit d'**1 heure** : plusieurs **questions de cours**, réponses **ordonnées**.\n- Le **français** et l'**orthographe** comptent.\n\n## Les grandes périodes\n| Période | Sous-période | Début | Fin | Rupture |\n|---|---|---|---|---|\n| **Antiquité** | — | — | **476** | Chute de l'Empire romain d'Occident |\n| **Moyen Âge** | Haut Moyen Âge | 476 | XIe s. | |\n| | Moyen Âge central | XIe s. | XIIIe s. | Redécouverte du droit romain |\n| | Bas Moyen Âge | XIVe s. | XVe s. (**1453**) | Chute de l'Empire romain d'Orient |\n| **Époque moderne (Ancien Régime)** | — | 1453 | **1789** | Révolution française |\n| **Période contemporaine** | — | 1789 | en cours | |"},{"key":"cl-24","course":"c1","subject":"prive","courseTitle":"L’application des sources du droit","title":"Fiche d'arrêt : Cass. 3e civ., 8 février 2018, n° 16-28.271 (déni de justice, art. 4)","md":"# Fiche d'arrêt\n**Cass. 3e civ., 8 février 2018, n° 16-28.271 (inédit)**\n\n## I. LES FAITS\nLa SCI Résidences Franco-Suisse, maître de l'ouvrage, a fait construire un ensemble immobilier dont les lots ont été vendus en l'état futur d'achèvement. Un syndicat des copropriétaires a été constitué. Après la réception de l'ouvrage, des désordres sont apparus, notamment des désordres de maçonnerie.\n\n## II. LA PROCÉDURE\nLe syndicat des copropriétaires a, après expertise, assigné la SCI en indemnisation. Par un arrêt du 26 septembre 2016, la cour d'appel de Versailles a rejeté sa demande au titre des désordres de maçonnerie. Un pourvoi a été formé contre cet arrêt, vraisemblablement par le syndicat, dont la demande avait été rejetée sur ce point.\n\n## III. LA THÈSE EN PRÉSENCE\n- **Le syndicat des copropriétaires** demande l'indemnisation des désordres de maçonnerie par la SCI.\n- **La cour d'appel** rejette cette demande : aucune faute n'est caractérisée contre la SCI, car il n'est pas possible de distinguer les vices apparents et l'esthétique, les désordres relevant de la garantie décennale et les dommages intermédiaires survenus plus d'un an après la réception, qui exigent une faute.\n- **Le pourvoi** reproche à la cour d'appel d'avoir refusé de trancher le litige (art. 4 C. civ.).\n\n## IV. LE PROBLÈME DE DROIT\nUn juge peut-il rejeter une demande en indemnisation de désordres au motif qu'il lui est impossible de distinguer la nature de ces désordres, donc de déterminer le régime de responsabilité applicable ?\n\n## V. LA SOLUTION DE LA COUR\nLa Cour de cassation répond par la **négative**. Au visa de l'**article 4 du code civil**, elle **casse et annule** l'arrêt, mais seulement en ce qu'il rejette la demande au titre des désordres de maçonnerie : en statuant ainsi, la cour d'appel a **refusé de statuer** sur la demande dont elle était saisie.\n\nRenvoi devant la cour d'appel de Versailles autrement composée ; la SCI est condamnée aux **dépens** (frais de procédure) ; les demandes au titre de l'**art. 700 CPC** (remboursement des honoraires d'avocat) sont rejetées.\n\n## Portée (pour aller plus loin)\n- Application classique de l'**interdiction du déni de justice** (art. 4) : le juge doit trancher, même si la qualification des désordres est difficile.\n- Ce n'est pas le rejet au fond qui est sanctionné, mais le **refus de trancher**.\n- Arrêt **inédit** : portée limitée, pas de principe nouveau."},{"key":"cl-25","course":"c32","subject":"ri","courseTitle":"Les acteurs des relations internationales","title":"Relations internationales : les grandes théories","md":"# Fiche : Les grandes théories des relations internationales\n\nLa discipline des **relations internationales** étudie scientifiquement les interactions, événements et structures de la société internationale ; elle propose des **grilles d'analyse**. Elle se caractérise par un **pluralisme théorique** : aucune grille ne s'impose définitivement.\n\n| Théorie | Résumé de l'idéologie |\n|---|---|\n| **Réalisme** (théorie dominante) | Appréhender les RI **telles qu'elles sont**, non telles qu'on voudrait qu'elles soient. Les **États** rivalisent pour la **puissance** ou la **sécurité** dans un environnement d'**anarchie** (absence d'autorité supérieure) : rapports de force et conflit. |\n| **Libéralisme** | Les RI sont aussi un espace de **coopération**, d'**interdépendance** et de **régulation**. L'État est un **médiateur** des intérêts de la société ; individus, groupes sociaux et acteurs privés comptent. Influent après les grands conflits. |\n| **Marxisme** | Les RI reflètent les **rapports de classe** et les logiques du **capitalisme**. |\n| **Transnationalisme** | Rôle croissant des **acteurs non étatiques** et des **réseaux transnationaux** : l'État n'est plus le passage obligé. |\n| **Constructivisme** | Les **idées, normes, croyances, représentations collectives** façonnent le comportement des acteurs et structurent la réalité internationale. |\n| **Critical legal studies / théories féministes** | **Déconstruire** les discours dominants : rapports de pouvoir, biais idéologiques, intérêts cachés. |\n\n## À retenir pour l'examen\n- **Pluralisme théorique**, absence de consensus.\n- **Réalisme vs libéralisme** : conflit/puissance vs coopération/interdépendance.\n- Mots-clés : **anarchie** (réalisme), **médiateur** (libéralisme), **classes** (marxisme), **réseaux** (transnationalisme), **normes et idées** (constructivisme), **déconstruction** (approches critiques)."},{"key":"cl-26","course":"c36","subject":"ri","courseTitle":"Le cadre juridique des relations internationales","title":"Droit international : le fondement de sa force obligatoire","md":"# Fiche : Le fondement de la force obligatoire du droit international\n\nQuestion centrale de la doctrine : **pourquoi le droit international oblige-t-il ?**\n\n| Courant | Auteur | Fondement de la force obligatoire |\n|---|---|---|\n| **Positivisme volontariste** | **Dionisio Anzilotti** | La **volonté des États** : ils sont obligés parce qu'ils ont **consenti** à l'être |\n| **Positivisme : objectivisme sociologique** | **Georges Scelle** | Des **nécessités sociales** qui dépassent la seule volonté étatique |\n| **Normativisme** | **Hans Kelsen** | La **validité des normes** dans un système juridique **hiérarchisé** |\n| **Droit naturel** | — | Des **principes supérieurs** au droit positif, indépendants de la volonté des États |\n| **Approches critiques contemporaines** | — | **Déconstruire** les discours juridiques pour révéler leurs dimensions **politiques et idéologiques** |\n\n## À retenir pour l'examen\n- **Anzilotti = volonté / consentement** ; **Scelle = nécessités sociales** ; **Kelsen = hiérarchie des normes**.\n- Droit naturel : principes **supérieurs** à la volonté des États."}];

  const jnext=jp&&jp.reviews.find(r=>r.status!=="done");const open=UI.courseOpen===c.id;

  return `<div class="course ${open?"open":""}" id="crs-${c.id}">

/* ---- Fiches préparées ensemble, importées une seule fois ---- */
function importBundledFiches(){
  if(typeof FICHES_BUNDLE==="undefined")return 0;
  const done=new Set(S.settings.fichesImported||[]);let n=0;
  FICHES_BUNDLE.forEach(b=>{
    if(done.has(b.key))return;
    const c=course(b.course)||S.courses.find(x=>x.subject===b.subject&&x.title===b.courseTitle);
    if(!c)return;
    if(!S.fiches.some(f=>f.courseId===c.id&&f.title===b.title)){
      const f={id:uid(),courseId:c.id,title:b.title,updated:Date.now()-n*1000,bundled:b.key};
      S.fiches.push(f);FICHE[f.id]={md:b.md,src:""};saveFiche(f.id);n++;
    }
    done.add(b.key);
  });
  if(n||done.size!==(S.settings.fichesImported||[]).length){S.settings.fichesImported=[...done];save("settings");save("fiches")}
  if(n)setTimeout(()=>toast(`${n} fiche${n>1?"s":""} de cours ajoutée${n>1?"s":""} dans « Mes cours ».`),600);
  return n;
}
startApp=(orig=>function(){try{importBundledFiches()}catch(e){console.error(e)}return orig.apply(this,arguments)})(startApp);

async function claudeStream(body,onDelta){
  const {data:{session}}=await sb.auth.getSession();

  const reader=r.body.getReader();const dec=new TextDecoder();let buf="";const blocks=[];let stop=null;
  for(;;){
    const {done,value}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});
    let i;while((i=buf.indexOf("\n\n"))>=0){
      const chunk=buf.slice(0,i);buf=buf.slice(i+2);
      const line=chunk.split("\n").find(l=>l.startsWith("data:"));if(!line)continue;
      let ev;try{ev=JSON.parse(line.slice(5).trim())}catch(e){continue}
      if(ev.type==="content_block_start"){const b={...ev.content_block,_json:""};if(b.type==="text")b.text=b.text||"";if(b.type==="thinking"){b.thinking=b.thinking||"";b.signature=b.signature||""}blocks[ev.index]=b}
      else if(ev.type==="content_block_delta"){const b=blocks[ev.index];if(!b)continue;const d=ev.delta;
        if(d.type==="text_delta"){b.text+=d.text;onDelta&&onDelta(d.text)}else if(d.type==="input_json_delta")b._json+=d.partial_json;else if(d.type==="thinking_delta")b.thinking+=d.thinking;else if(d.type==="signature_delta")b.signature=(b.signature||"")+d.signature}
      else if(ev.type==="message_delta"){if(ev.delta&&ev.delta.stop_reason)stop=ev.delta.stop_reason}
      else if(ev.type==="error"){throw {code:ev.error&&ev.error.type==="overloaded_error"?"rate_limited":"error",message:(ev.error&&ev.error.message)||"Erreur de l’IA"}}
    }
  }
  blocks.forEach(b=>{if(b&&b.type==="tool_use"){try{b.input=b._json?JSON.parse(b._json):(b.input||{})}catch(e){b.input={}}}});
  return {blocks:blocks.filter(Boolean),stop};
}
function blobToImageBlock(blob){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(blob);img.onload=()=>{const max=1568;let w=img.width,h=img.height;const s=Math.min(1,max/Math.max(w,h));w=Math.round(w*s);h=Math.round(h*s);const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(u);res({type:"image",source:{type:"base64",media_type:"image/jpeg",data:cv.toDataURL("image/jpeg",.85).split(",")[1]}})};img.onerror=()=>rej(new Error("Image illisible"));img.src=u})}
async function claudeSample(input,opts={}){
  const messages=typeof input==="string"?[{role:"user",content:input}]:input.map(m=>({role:m.role,content:m.content}));
  if(opts.images&&opts.images.length){const imgs=await Promise.all(opts.images.map(blobToImageBlock));const last=messages[messages.length-1];last.content=[...imgs,{type:"text",text:typeof last.content==="string"?last.content:""}]}
  const tier=opts.modelTier||"default";
  const tools=(opts.tools||[]).map(t=>({name:t.name,description:t.description,input_schema:t.inputSchema||{type:"object",properties:{}}}));
  let full="";
  for(let turn=0;turn<6;turn++){
    if(turn&&full&&!full.endsWith("\n"))full+="\n\n";
    const {blocks,stop}=await claudeStream({tier,messages,tools,max_tokens:tier==="complex"?8000:4000},d=>{full+=d;opts.onText&&opts.onText({text:full,delta:d})});
    if(stop!=="tool_use")return {text:full,truncated:stop==="max_tokens"};
    messages.push({role:"assistant",content:blocks.map(cleanBlock).filter(Boolean)});
    const results=[];
    for(const b of blocks.filter(x=>x.type==="tool_use")){const t=(opts.tools||[]).find(x=>x.name===b.name);let content,is_error=false;
      try{if(!t)throw new Error("outil inconnu");content=JSON.stringify(await t.execute(b.input)??{ok:true})}catch(e){content=String(e&&e.message||e);is_error=true}
      results.push({type:"tool_result",tool_use_id:b.id,content,is_error})}
    messages.push({role:"user",content:results});
  }
  return {text:full};
}
claudeSample.json=async(input,opts={})=>{
  const inp=typeof input==="string"?input+"\n\nRéponds uniquement avec le JSON demandé, sans aucun texte autour.":input;
  const r=await claudeSample(inp,opts);const m=r.text.match(/\{[\s\S]*\}/);return m?JSON.parse(m[0]):null;
};

async function onAuthSubmit(f){
  const err=t=>{const e=$("#authErr");if(e)e.textContent=t};
  const btn=document.querySelector(`form[data-form="${f}"] button.pri`);if(btn)btn.disabled=true;
  try{
    if(f==="signup"){
      const first=$("#su_first").value.trim(),last=$("#su_last").value.trim(),email=$("#su_email").value.trim().toLowerCase(),pw=$("#su_pw").value,pw2=$("#su_pw2").value,year=$("#su_year").value;
      if(!first||!last)return err("Indique ton prénom et ton nom.");
      if(pw.length<6)return err("Le mot de passe doit faire au moins 6 caractères.");
      if(pw!==pw2)return err("Les deux mots de passe ne correspondent pas.");
      try{localStorage.setItem("l1ied-pending-profile",JSON.stringify({first,last,year,email,photo:pendingPhoto||""}))}catch(e){}
      const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{first,last,year},emailRedirectTo:SITE_URL}});
      if(error)return err(authErr(error));
      if(data.session)await afterLogin(data.session.user);
      else showAuth("check",`Un lien de confirmation a été envoyé à ${email}.`);
    }
    if(f==="login"){
      const {data,error}=await sb.auth.signInWithPassword({email:$("#li_email").value.trim().toLowerCase(),password:$("#li_pw").value});
      if(error)return err(authErr(error));
      await afterLogin(data.user);
    }
    if(f==="forgot"){
      const {error}=await sb.auth.resetPasswordForEmail($("#fg_email").value.trim().toLowerCase(),{redirectTo:SITE_URL});
      if(error)return err(authErr(error));
      showAuth("check","Si un compte existe avec cette adresse, un lien pour changer ton mot de passe vient d’être envoyé.");
    }
    if(f==="reset"){
      const pw=$("#rs_pw").value,pw2=$("#rs_pw2").value;if(pw.length<6)return err("Au moins 6 caractères.");if(pw!==pw2)return err("Les deux mots de passe ne correspondent pas.");
      const {data,error}=await sb.auth.updateUser({password:pw});if(error)return err(authErr(error));
      toast("Mot de passe modifié.");await afterLogin(data.user);
    }
  }finally{if(btn)btn.disabled=false}
}
async function afterLogin(user){

}

async function bootStandalone(){
  loadLocal();applyTheme();
  if(!window.supabase||!window.supabase.createClient){$("#splash").textContent="Impossible de charger le service de connexion. Vérifie ta connexion internet puis recharge la page.";return}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  let recovering=/type=recovery/.test(location.hash);
  sb.auth.onAuthStateChange((ev,session)=>{if(ev==="PASSWORD_RECOVERY"){recovering=true;showAuth("reset")}});
  const {data:{session}}=await sb.auth.getSession();
  if(recovering){showAuth("reset");return}
  if(session&&session.user){await afterLogin(session.user);if(/access_token|type=signup/.test(location.hash))try{history.replaceState(null,"",location.pathname+"#accueil")}catch(e){}}
  else showAuth(S.profile&&S.profile.email?"login":"signup");
}
