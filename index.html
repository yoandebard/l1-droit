  theses:"Marbury réclame sa commission ; l’administration Jefferson conteste.",
  pb:"La Cour suprême peut-elle refuser d’appliquer une loi contraire à la Constitution ?",
  sol:"Pour le Chief Justice Marshall, Marbury a droit à sa commission, mais la disposition du Judiciary Act qui étend la compétence de la Cour est contraire à la Constitution ; or une loi contraire à la Constitution est nulle et il revient au juge de dire ce qu’est le droit. La demande est rejetée.",
  portee:"Acte de naissance du contrôle juridictionnel de constitutionnalité, exercé par voie d’exception par tous les juges : à opposer au modèle européen concentré (Kelsen)."},
 {id:"clement",j:"Cass., req.",d:"3 août 1915",y:1915,n:"Clément-Bayard",num:"",m:"prive",th:"abus de droit, droit de propriété",
  faits:"M. Coquerel installe sur son terrain de hautes carcasses de bois surmontées de tiges de fer pointues, en bordure du terrain de M. Clément-Bayard, constructeur de dirigeables. Un dirigeable est endommagé en heurtant le dispositif.",
  proc:"La cour d’appel d’Amiens (12 novembre 1913) condamne Coquerel à réparer le dommage et à enlever les tiges. Coquerel forme un pourvoi.",
  theses:"Coquerel invoque son droit de propriété, absolu (art. 544 C. civ.) ; Clément-Bayard dénonce un dispositif sans utilité, destiné à lui nuire.",
  pb:"Un propriétaire peut-il engager sa responsabilité en usant de son droit de propriété ?",
  sol:"Rejet : le dispositif ne présentait pour l’exploitation du terrain aucune utilité et n’avait été érigé que dans l’unique but de nuire à Clément-Bayard. Il y a abus du droit de propriété.",
  portee:"Consécration de la théorie de l’abus de droit (critère de l’intention de nuire et de l’absence d’utilité). Voir aussi CA Colmar, 2 mai 1855 (Doerr) et Josserand."},
 {id:"doerr",j:"CA Colmar",d:"2 mai 1855",y:1855,n:"Doerr",num:"",m:"prive",th:"abus de droit (fausse cheminée)",
  faits:"Un propriétaire construit sur son toit une fausse cheminée, sans aucune utilité, dans le seul but d’obscurcir la fenêtre de son voisin.",
  proc:"Le voisin agit en justice ; la cour d’appel de Colmar statue.",
  theses:"Le propriétaire invoque le caractère absolu de son droit de propriété.",
  pb:"Le droit de propriété peut-il être exercé dans le seul but de nuire à autrui ?",
  sol:"Non : si le droit de propriété est absolu, son exercice doit avoir pour limite la satisfaction d’un intérêt sérieux et légitime. La démolition est ordonnée.",
  portee:"Premier grand exemple d’abus du droit de propriété, confirmé par Clément-Bayard (1915)."},
 {id:"voisinage",j:"Cass., 2e civ.",d:"19 novembre 1986",y:1986,n:"Troubles anormaux de voisinage",num:"n° 84-16.379",m:"prive",th:"troubles anormaux du voisinage, responsabilité sans faute",verify:true,
  faits:"Litige entre voisins portant sur des nuisances excédant les inconvénients normaux du voisinage (à lire dans le texte intégral).",
  proc:"Pourvoi en cassation contre l’arrêt d’appel.",
  theses:"La question est de savoir si la victime doit prouver une faute.",
  pb:"La responsabilité pour trouble de voisinage suppose-t-elle une faute ?",
  sol:"« Nul ne doit causer à autrui un trouble anormal de voisinage » : principe autonome, la responsabilité est engagée dès que le trouble excède les inconvénients normaux du voisinage, sans qu’il soit besoin de prouver une faute.",
  portee:"Responsabilité objective fondée sur l’anormalité du trouble. Codifiée à l’art. 1253 du code civil par la loi du 15 avril 2024."},
 {id:"bauffremont",j:"Cass. civ.",d:"18 mars 1878",y:1878,n:"Princesse de Bauffremont",num:"",m:"prive",th:"fraude à la loi (fraus omnia corrumpit)",
  faits:"La princesse de Bauffremont, séparée de corps à une époque où le divorce est interdit en France, se fait naturaliser dans le duché de Saxe-Altenbourg, y obtient le divorce et se remarie avec le prince Bibesco.",
  proc:"Le prince de Bauffremont agit en France ; la Cour de cassation statue sur le pourvoi.",
  theses:"La princesse se prévaut de sa nouvelle nationalité ; le prince soutient qu’elle a voulu échapper à la loi française.",
  pb:"Un changement de nationalité obtenu dans le seul but d’échapper à la loi française est-il opposable en France ?",
  sol:"Non : la naturalisation, obtenue en fraude à la loi française, ne peut produire d’effets en France ; le divorce et le second mariage y sont inopposables.",
  portee:"Arrêt de référence de la fraude à la loi : la fraude corrompt tout."},
 {id:"apparence",j:"Cass., ass. plén.",d:"13 décembre 1962",y:1962,n:"Banque canadienne nationale",num:"n° 57-11.569",m:"prive",th:"théorie de l’apparence, mandat apparent",verify:true,
  faits:"Un dirigeant de société engage celle-ci envers une banque au-delà de ses pouvoirs réels ; la banque demande l’exécution de l’engagement (faits détaillés à lire dans le texte intégral).",
  proc:"Pourvoi en cassation porté devant l’assemblée plénière.",
  theses:"La société soutient qu’elle n’est pas engagée faute de pouvoir du signataire ; la banque invoque la croyance légitime dans ces pouvoirs.",
  pb:"Une personne peut-elle être engagée par un mandataire qui a agi sans pouvoir, et à quelles conditions ?",
  sol:"Le mandant peut être engagé sur le fondement d’un mandat apparent, même en l’absence de faute de sa part, si la croyance du tiers aux pouvoirs du prétendu mandataire est légitime, ce qui suppose que les circonstances l’autorisaient à ne pas vérifier les limites exactes de ces pouvoirs.",
  portee:"Consécration de la théorie de l’apparence (« error communis facit jus »), aujourd’hui reprise à l’art. 1156 C. civ."},
 {id:"perruche",j:"Cass., ass. plén.",d:"17 novembre 2000",y:2000,n:"Perruche",num:"n° 99-13.701",m:"prive",th:"préjudice d’être né handicapé, personnes",
  faits:"Mme Perruche, enceinte, présente des symptômes de rubéole. À la suite de fautes du médecin et du laboratoire, elle est déclarée immunisée, alors qu’elle avait indiqué vouloir avorter en cas de rubéole. Son fils Nicolas naît atteint de graves handicaps liés à la rubéole.",
  proc:"Après une première cassation, la cour d’appel d’Orléans, cour de renvoi, refuse d’indemniser l’enfant. Pourvoi devant l’assemblée plénière.",
  theses:"Pour les parents, l’enfant subit un préjudice causé par les fautes ; pour la cour de renvoi, le handicap est dû à la rubéole et non aux fautes.",
  pb:"L’enfant né handicapé peut-il obtenir réparation du préjudice résultant de son handicap lorsque des fautes ont privé sa mère de la possibilité d’avorter ?",
  sol:"Cassation : dès lors que les fautes commises ont empêché la mère d’exercer son choix d’interrompre sa grossesse, l’enfant peut demander réparation du préjudice résultant de son handicap, causé par les fautes retenues.",
  portee:"Très vive controverse ; le législateur réagit par la loi du 4 mars 2002 : « nul ne peut se prévaloir d’un préjudice du seul fait de sa naissance »."},
 {id:"foetus",j:"Cass., ass. plén.",d:"29 juin 2001",y:2001,n:"Homicide involontaire et enfant à naître",num:"n° 99-85.973",m:"prive",th:"personnalité juridique, enfant à naître, interprétation stricte de la loi pénale",
  faits:"Une femme enceinte de six mois est blessée dans un accident causé par un conducteur en état d’ébriété ; elle perd l’enfant qu’elle portait.",
  proc:"La cour d’appel de Metz relaxe le conducteur du chef d’homicide involontaire sur l’enfant à naître. Pourvoi devant l’assemblée plénière.",
  theses:"Pour la partie civile, le fœtus viable est une personne protégée par l’incrimination ; pour la cour d’appel, il n’est pas « autrui » au sens de la loi pénale.",
  pb:"L’homicide involontaire peut-il être retenu à l’égard d’un enfant à naître ?",
  sol:"Rejet : le principe de la légalité des délits et des peines, qui impose une interprétation stricte de la loi pénale, s’oppose à ce que l’incrimination d’homicide involontaire soit étendue au cas de l’enfant à naître, dont le régime juridique relève de textes particuliers.",
  portee:"L’enfant à naître n’est pas une personne au sens du droit pénal : la personnalité juridique s’acquiert à la naissance, vivant et viable (sous réserve de l’adage infans conceptus)."},
 {id:"gpa",j:"Cass., ass. plén.",d:"31 mai 1991",y:1991,n:"Alma Mater (maternité de substitution)",num:"n° 90-20.105",m:"prive",th:"indisponibilité du corps humain et de l’état des personnes",
  faits:"Un couple a recours à une mère porteuse. L’enfant est déclaré à l’état civil comme né du mari seul ; l’épouse demande ensuite l’adoption plénière de l’enfant.",
  proc:"La cour d’appel de Paris prononce l’adoption. Le procureur général près la Cour de cassation forme un pourvoi dans l’intérêt de la loi.",
  theses:"La cour d’appel a fait prévaloir l’intérêt de l’enfant ; le procureur général invoque l’ordre public.",
  pb:"L’adoption d’un enfant né d’une convention de mère porteuse peut-elle être prononcée ?",
  sol:"Cassation : la convention par laquelle une femme s’engage, même à titre gratuit, à concevoir et à porter un enfant pour l’abandonner à sa naissance contrevient au principe d’ordre public de l’indisponibilité du corps humain et de l’état des personnes ; l’adoption est l’ultime phase d’un processus qui détourne l’institution.",
  portee:"Solution consacrée par la loi de bioéthique de 1994 (art. 16-7 C. civ.). La question de la transcription des actes étrangers évoluera sous l’influence de la CEDH."},
 {id:"trans",j:"Cass., ass. plén.",d:"11 décembre 1992",y:1992,n:"Transsexualisme",num:"n° 91-11.900",m:"prive",th:"état civil, vie privée, indisponibilité de l’état des personnes",
  faits:"Une personne ayant suivi un traitement médico-chirurgical demande la modification de la mention de son sexe à l’état civil.",
  proc:"Les juges du fond refusent ; pourvoi devant l’assemblée plénière, après la condamnation de la France par la CEDH (Botella c/ France, 25 mars 1992).",
  theses:"Le principe d’indisponibilité de l’état des personnes s’opposerait au changement ; la requérante invoque le respect de sa vie privée (art. 8 CEDH).",
  pb:"Le principe d’indisponibilité de l’état des personnes empêche-t-il la modification de la mention du sexe à l’état civil ?",
  sol:"Non : lorsque, à la suite d’un traitement, la personne ne possède plus tous les caractères de son sexe d’origine et a pris une apparence physique la rapprochant de l’autre sexe, auquel correspond son comportement social, le respect dû à la vie privée justifie que son état civil indique le sexe dont elle a l’apparence.",
  portee:"Revirement sous l’influence de la CEDH. La loi du 18 novembre 2016 (art. 61-5 C. civ.) a depuis démédicalisé la procédure."},
 {id:"jandheur",j:"Cass., ch. réunies",d:"13 février 1930",y:1930,n:"Jand’heur",num:"",m:"prive",th:"responsabilité du fait des choses (art. 1242 al. 1, ancien 1384)",
  faits:"Une mineure, Lise Jand’heur, est renversée et blessée par un camion appartenant à la société « Aux Galeries belfortaises ».",
  proc:"Après plusieurs décisions et une première cassation, l’affaire est portée devant les chambres réunies.",
  theses:"La société soutient qu’une chose actionnée par la main de l’homme relève de la responsabilité pour faute ; la victime invoque la présomption attachée à la garde de la chose.",
  pb:"La présomption de responsabilité du gardien d’une chose s’applique-t-elle à une chose actionnée par la main de l’homme, et comment s’en exonérer ?",
  sol:"La présomption de responsabilité de l’art. 1384 al. 1er pèse sur le gardien de la chose ; elle ne peut être détruite que par la preuve d’un cas fortuit, d’une force majeure ou d’une cause étrangère non imputable. Il n’y a pas à distinguer selon que la chose était ou non actionnée par la main de l’homme.",
  portee:"Principe général de responsabilité du fait des choses : exemple type du rôle créateur de la jurisprudence à partir d’un texte."},
 {id:"revirement",j:"Cass., 1re civ.",d:"9 octobre 2001",y:2001,n:"Rétroactivité des revirements",num:"n° 00-14.564",m:"prive",th:"jurisprudence source du droit, revirement, sécurité juridique",
  faits:"Un enfant né en 1974 garde de graves séquelles d’un accouchement. Ses parents reprochent au médecin de ne pas avoir informé la mère des risques, alors qu’à l’époque la jurisprudence n’imposait pas d’informer des risques exceptionnels (obligation consacrée en 1998).",
  proc:"La cour d’appel écarte la responsabilité du médecin en se fondant sur l’état de la jurisprudence à la date des faits. Pourvoi.",
  theses:"Le médecin invoque la jurisprudence en vigueur au moment des faits ; la victime, l’obligation d’information telle qu’elle est interprétée aujourd’hui.",
  pb:"Un revirement de jurisprudence s’applique-t-il à des faits antérieurs ?",
  sol:"Cassation : l’interprétation jurisprudentielle d’une même norme à un moment donné ne peut être différente selon l’époque des faits considérés, et nul ne peut se prévaloir d’un droit acquis à une jurisprudence figée.",
  portee:"Rétroactivité de principe des revirements, ensuite tempérée par la modulation dans le temps (rapport Molfessis, 2004 ; Ass. plén., 21 déc. 2006)."},
 {id:"preuve2023",j:"Cass., ass. plén.",d:"22 décembre 2023",y:2023,n:"Preuve déloyale",num:"n° 20-20.648",m:"prive",th:"preuve, loyauté, droit à la preuve",
  faits:"Un salarié est licencié pour faute grave ; l’employeur produit l’enregistrement audio, réalisé à son insu, d’un entretien.",
  proc:"La cour d’appel écarte l’enregistrement comme preuve déloyale et juge le licenciement sans cause réelle et sérieuse. Pourvoi devant l’assemblée plénière.",
  theses:"L’employeur invoque son droit à la preuve ; le salarié, la loyauté de la preuve et le respect de sa vie privée.",
  pb:"Une preuve obtenue de manière déloyale est-elle nécessairement irrecevable dans un procès civil ?",
  sol:"Cassation : l’illicéité ou la déloyauté dans l’obtention d’un moyen de preuve ne conduit pas nécessairement à l’écarter. Le juge apprécie si son utilisation porte atteinte au caractère équitable de la procédure, en mettant en balance le droit à la preuve et les droits en présence ; la production doit être indispensable et l’atteinte strictement proportionnée au but poursuivi.",
  portee:"Revirement : abandon de l’irrecevabilité de principe de la preuve déloyale (Ass. plén., 7 janv. 2011), sous l’influence de la CEDH. Lien direct avec ton cours sur la preuve."},
 {id:"lotus",j:"CPJI",d:"7 septembre 1927",y:1927,n:"Lotus (France c. Turquie)",num:"",m:"ri",th:"souveraineté, volontarisme, compétence pénale",
  faits:"En haute mer, le paquebot français Lotus entre en collision avec le charbonnier turc Boz-Kourt, qui coule : huit marins turcs meurent. À l’escale suivante, la Turquie poursuit et condamne l’officier de quart français, M. Demons.",
  proc:"La France et la Turquie soumettent le différend à la Cour permanente de justice internationale par compromis.",
  theses:"Pour la France, la Turquie devait justifier d’une règle l’autorisant à poursuivre ; pour la Turquie, aucune règle ne le lui interdisait.",
  pb:"Un État peut-il exercer sa compétence pénale à l’égard d’un fait survenu en haute mer à bord d’un navire étranger, en l’absence de règle l’y autorisant ?",
  sol:"Oui (voix prépondérante du président) : les règles de droit liant les États procèdent de leur volonté ; les limitations de leur indépendance ne se présument pas. Aucune règle n’interdisait à la Turquie d’engager des poursuites.",
  portee:"Expression du positivisme volontariste : « tout ce qui n’est pas interdit est permis » (principe du Lotus). Solution écartée en matière d’abordage par les conventions de 1952 et 1982."},
 {id:"reparation",j:"CIJ, avis consultatif",d:"11 avril 1949",y:1949,n:"Réparation des dommages subis au service des Nations unies",num:"",m:"ri",th:"personnalité juridique des organisations internationales",
  faits:"En 1948, le comte Folke Bernadotte, médiateur de l’ONU en Palestine, est assassiné à Jérusalem.",
  proc:"L’Assemblée générale demande un avis à la Cour : l’ONU peut-elle présenter une réclamation internationale pour obtenir réparation ?",
  theses:"La Charte ne dit pas expressément que l’ONU est une personne juridique internationale.",
  pb:"L’ONU a-t-elle la personnalité juridique internationale et la capacité de présenter une réclamation, y compris contre un État non membre ?",
  sol:"Oui : l’ONU est une personne internationale (ce qui n’en fait pas un « super-État ») ; elle a la capacité de présenter une réclamation internationale, y compris contre un État non membre (personnalité objective), en vertu des compétences nécessaires à l’exercice de ses fonctions.",
  portee:"Consécration de la personnalité juridique des organisations internationales et de la théorie des compétences implicites."},
 {id:"merdunord",j:"CIJ",d:"20 février 1969",y:1969,n:"Plateau continental de la mer du Nord",num:"RFA c. Danemark ; RFA c. Pays-Bas",m:"ri",th:"coutume internationale, opinio juris",
  faits:"L’Allemagne, le Danemark et les Pays-Bas ne parviennent pas à délimiter leurs plateaux continentaux en mer du Nord.",
  proc:"Saisine de la Cour par compromis.",
  theses:"Le Danemark et les Pays-Bas invoquent le principe d’équidistance (art. 6 de la convention de Genève de 1958), que l’Allemagne n’a pas ratifiée, en soutenant qu’il est devenu coutumier.",
  pb:"Le principe d’équidistance est-il devenu une règle coutumière opposable à un État non partie à la convention ?",
  sol:"Non : la coutume suppose une pratique constante et uniforme des États (élément matériel) et la conviction d’agir conformément au droit (opinio juris, élément psychologique), ce qui n’est pas établi. La délimitation doit se faire par accord, selon des principes équitables.",
  portee:"Définition de référence des deux éléments de la coutume (art. 38 du Statut de la CIJ)."},
 {id:"nicaragua",j:"CIJ",d:"27 juin 1986",y:1986,n:"Activités militaires et paramilitaires au Nicaragua",num:"Nicaragua c. États-Unis",m:"ri",th:"non-recours à la force, non-intervention, coutume",
  faits:"Les États-Unis soutiennent les « contras » opposés au gouvernement du Nicaragua et participent au minage de ports nicaraguayens.",
  proc:"Le Nicaragua saisit la Cour. Les États-Unis invoquent une réserve excluant les différends fondés sur des traités multilatéraux, puis ne participent plus à la procédure au fond.",
  theses:"Les États-Unis invoquent la légitime défense collective du Salvador, du Honduras et du Costa Rica.",
  pb:"Le soutien militaire à des forces rebelles viole-t-il les principes de non-recours à la force et de non-intervention ?",
  sol:"Oui : la Cour applique le droit international coutumier, les principes de non-recours à la force et de non-intervention ayant une existence coutumière parallèle à la Charte ; la légitime défense collective n’est pas établie. Les États-Unis ont violé leurs obligations.",
  portee:"Coexistence de la coutume et des traités ; conditions de la légitime défense ; critère du « contrôle effectif »."},
 {id:"barcelona",j:"CIJ",d:"5 février 1970",y:1970,n:"Barcelona Traction",num:"Belgique c. Espagne",m:"ri",th:"protection diplomatique, obligations erga omnes",
  faits:"La société Barcelona Traction, de nationalité canadienne mais détenue en majorité par des actionnaires belges, est déclarée en faillite en Espagne.",
  proc:"La Belgique saisit la Cour pour protéger ses ressortissants actionnaires.",
  theses:"La Belgique invoque le préjudice de ses ressortissants ; l’Espagne conteste sa qualité pour agir.",
  pb:"L’État national des actionnaires peut-il exercer la protection diplomatique pour un préjudice subi par la société ?",
  sol:"Non : seul l’État national de la société (le Canada) peut l’exercer ; la demande belge est rejetée. Dans un obiter dictum, la Cour distingue les obligations envers un autre État et les obligations erga omnes envers la communauté internationale dans son ensemble (agression, génocide, droits fondamentaux).",
  portee:"Notion d’obligations erga omnes ; règles de la protection diplomatique des sociétés."},
 {id:"palmas",j:"Sentence arbitrale (Max Huber)",d:"4 avril 1928",y:1928,n:"Île de Palmas",num:"Pays-Bas c. États-Unis",m:"ri",th:"souveraineté territoriale, effectivité",
  faits:"Les États-Unis, successeurs de l’Espagne aux Philippines (1898), et les Pays-Bas revendiquent l’île de Palmas.",
  proc:"Le différend est soumis à l’arbitrage de Max Huber (Cour permanente d’arbitrage).",
  theses:"Les États-Unis invoquent la découverte espagnole ; les Pays-Bas, l’exercice effectif de leur autorité sur l’île.",
  pb:"Comment s’acquiert et se prouve la souveraineté territoriale ?",
  sol:"La souveraineté territoriale suppose l’exercice continu et pacifique des fonctions étatiques. La simple découverte ne donne qu’un titre inchoatif, qui doit être complété par une occupation effective. L’île revient aux Pays-Bas.",
  portee:"Principe d’effectivité ; définition de la souveraineté comme compétence exclusive sur un territoire."},
 {id:"nottebohm",j:"CIJ",d:"6 avril 1955",y:1955,n:"Nottebohm",num:"Liechtenstein c. Guatemala",m:"ri",th:"nationalité effective, protection diplomatique",
  faits:"M. Nottebohm, Allemand installé au Guatemala depuis des décennies, obtient en 1939 la nationalité du Liechtenstein après un bref séjour. Le Guatemala le traite en ressortissant ennemi pendant la guerre et confisque ses biens.",
  proc:"Le Liechtenstein exerce sa protection diplomatique et saisit la Cour.",
  theses:"Le Liechtenstein se prévaut de la nationalité conférée ; le Guatemala conteste qu’elle lui soit opposable.",
  pb:"Une nationalité dépourvue de lien effectif est-elle opposable aux autres États pour exercer la protection diplomatique ?",
  sol:"Non : la nationalité doit reposer sur un rattachement effectif ; à défaut, elle est inopposable au Guatemala. La demande est irrecevable.",
  portee:"Principe de la nationalité effective en droit international."},
 {id:"mavrommatis",j:"CPJI",d:"30 août 1924",y:1924,n:"Concessions Mavrommatis en Palestine",num:"Grèce c. Royaume-Uni",m:"ri",th:"protection diplomatique",
  faits:"M. Mavrommatis, ressortissant grec, conteste l’atteinte portée à ses concessions en Palestine par les autorités britanniques, puissance mandataire.",
  proc:"La Grèce saisit la Cour permanente de justice internationale.",
  theses:"Le Royaume-Uni conteste la compétence de la Cour.",
  pb:"Quelle est la nature de la réclamation présentée par un État pour l’un de ses ressortissants ?",
  sol:"En prenant fait et cause pour l’un des siens, l’État fait valoir son propre droit : celui de faire respecter le droit international en la personne de ses ressortissants.",
  portee:"Définition classique de la protection diplomatique."},
 {id:"reserves",j:"CIJ, avis consultatif",d:"28 mai 1951",y:1951,n:"Réserves à la convention pour la prévention et la répression du crime de génocide",num:"",m:"ri",th:"réserves aux traités",
  faits:"Plusieurs États formulent des réserves à la convention sur le génocide, auxquelles d’autres États s’opposent.",
  proc:"L’Assemblée générale demande un avis à la Cour.",
  theses:"Doit-on exiger l’unanimité des parties pour admettre une réserve ?",
  pb:"Un État qui a formulé une réserve, à laquelle certaines parties s’opposent, peut-il être considéré comme partie à la convention ?",
  sol:"Oui, si la réserve est compatible avec l’objet et le but de la convention ; chaque État apprécie cette compatibilité.",
  portee:"Critère repris par la convention de Vienne de 1969 (art. 19 à 23)."}
];

const LIBS={};
function loadScript(src){if(LIBS[src])return LIBS[src];return LIBS[src]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>{delete LIBS[src];rej(new Error("Bibliothèque indisponible"))};document.head.appendChild(s)})}
async function pdfText(file){
  await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  const lib=window.pdfjsLib;lib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;let out=[];
  for(let i=1;i<=Math.min(pdf.numPages,80);i++){const pg=await pdf.getPage(i);const tc=await pg.getTextContent();out.push(tc.items.map(x=>x.str+(x.hasEOL?"\n":" ")).join(""))}
  return {text:out.join("\n\n").replace(/[ \t]+\n/g,"\n").trim(),pages:pdf.numPages};
}
async function docxText(file){await loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");const r=await window.mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()});return {text:r.value.trim()}}
function audioDuration(file){return new Promise(res=>{const a=document.createElement("audio");const u=URL.createObjectURL(file);a.preload="metadata";a.onloadedmetadata=()=>{const d=a.duration;URL.revokeObjectURL(u);res(isFinite(d)?d:0)};a.onerror=()=>{URL.revokeObjectURL(u);res(0)};a.src=u;setTimeout(()=>res(0),8000)})}
function fileKind(f){const n=f.name.toLowerCase();if(f.type.startsWith("audio/")||/\.(mp3|m4a|wav|ogg|aac|opus|flac)$/.test(n))return "audio";if(f.type.startsWith("video/")||/\.(mp4|mov|webm)$/.test(n))return "video";if(f.type==="application/pdf"||n.endsWith(".pdf"))return "pdf";if(/\.docx$/.test(n))return "docx";if(f.type.startsWith("image/"))return "image";if(f.type.startsWith("text/")||/\.(txt|md|csv|rtf)$/.test(n))return "text";return "autre"}
async function readFile(f){
  const kind=fileKind(f);const info={kind,name:f.name,size:f.size};
  try{
    if(kind==="audio"||kind==="video")info.duration=await audioDuration(f);
    else if(kind==="pdf"){const r=await pdfText(f);info.text=r.text;info.pages=r.pages}
    else if(kind==="docx")info.text=(await docxText(f)).text;
    else if(kind==="text")info.text=(await f.text()).slice(0,200000);
  }catch(e){info.readError=e.message||"lecture impossible"}
  return info;
}
async function storeFile(f){
  if(!assetsApi)return {note:"Fichier non conservé : l’envoi de fichiers marche depuis claude.ai."};
  if(f.size>20*1024*1024)return {note:"Fichier trop lourd pour être conservé (20 Mo max) : seules ses informations sont enregistrées."};
  try{const r=await assetsApi.upload(f);return {id:r.id,url:r.url}}catch(e){return {note:"Envoi impossible : "+(e.message||e.code||"erreur")}}
}

async function analyzeBulletin(b){

- "resume" : résumé en markdown (5 à 8 puces max) des consignes de méthode et des informations importantes,
- "consignes" : liste des choses à faire, chacune avec "texte", "date" (AAAA-MM-JJ si une date ou échéance est indiquée, sinon vide ; déduis l'année : 2026 pour sept-déc, 2027 pour janv-août) et "type" parmi "devoir", "regroupement", "permanence", "tache".
Réponds uniquement en JSON : {"titre":"","resume":"","consignes":[{"texte":"","date":"","type":""}]}

BULLETIN :
${B.src.slice(0,20000)}`);
    if(!v)throw {message:"Réponse illisible, réessaie."};

}

function guessFromText(txt){
  const t=norm(txt);const subjKw={constit:["constit","etat","democrat","regime","parlement","president","separation"],prive:["prive","civil","preuve","droits subjectifs","personne","etat civil","sources du droit","judiciaire"],histoire:["histoire","romain","franque","capetien","monarchie","royal"],ri:["international","relations internationales","traite","onu","organisations internationales"],eco:["eco","pensee economique","faits economiques"],anglais:["anglais","english","british","brexit","parliament"],methodo:["methodo","bulletin","fiche d'arret","cas pratique","jeanson"]};
  let subject="",best=0;for(const [k,kws] of Object.entries(subjKw)){const sc=kws.filter(w=>t.includes(w)).length;if(sc>best){best=sc;subject=k}}
  let courseId="",cb=0;for(const c of S.courses){const words=norm(c.title).split(/[^a-z0-9]+/).filter(w=>w.length>3);const sc=words.filter(w=>t.includes(w)).length/(words.length||1)+(c.subject===subject?0.2:0);if(sc>cb){cb=sc;courseId=c.id}}
  if(cb<0.5)courseId="";if(courseId&&!subject)subject=course(courseId).subject;
  const type=/bulletin|liaison/.test(t)?"bulletin":/devoir|sujet|td|cas pratique|commentaire|dissertation/.test(t)?"devoir":"support";
  return {subject,courseId,type};
}

function qWords(q){return norm(q).split(/[\s,;:.!?'’()]+/).filter(w=>w.length>1)}
function scoreIn(words,title,body){const t=norm(title),b=norm(body);let sc=0;for(const w of words){const inT=t.includes(w),inB=b.includes(w);if(!inT&&!inB)return 0;sc+=inT?3:1}return sc}
function snippet(text,words,len=170){
  const src=String(text||"").replace(/\s+/g," ").trim();if(!src)return "";
  let n="",map=[];for(let i=0;i<src.length;i++){const c=norm(src[i]);for(let k=0;k<c.length;k++){n+=c[k];map.push(i)}}
  let pos=-1;for(const w of words){const p=n.indexOf(w);if(p>=0&&(pos<0||p<pos))pos=p}
  let start=0;if(pos>=0)start=Math.max(0,(map[pos]||0)-50);
  let out=src.slice(start,start+len);return (start>0?"…":"")+out+(start+len<src.length?"…":"");
}
function hlw(s,words){let out=esc(s);for(const w of words.filter(x=>x.length>2)){out=out.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&").split("").map(ch=>({a:"[aàâä]",e:"[eéèêë]",i:"[iîï]",o:"[oôö]",u:"[uùûü]",c:"[cç]"}[ch]||ch)).join("")+")","gi"),"<mark>$1</mark>")}return out}
function searchAll(q){
  const W=qWords(q);if(!W.length)return [];
  const G=[];const add=(group,icon,items)=>{const l=items.filter(x=>x.score>0).sort((a,b)=>b.score-a.score);if(l.length)G.push({group,icon,items:l})};
  add("Mes cours","book",S.courses.map(c=>{const s=subj(c.subject);const w=weekById(c.week);return {score:scoreIn(W,c.title,s.name+" "+s.short+" "+(w?weekName(w):"")+" "+(c.files||[]).map(f=>f.name).join(" ")),title:c.title,meta:`${s.short} · ${w?weekName(w):"non planifié"} · ${c.audios.length} audio${c.audios.length>1?"s":""} · ${fmtMin(cMin(c))}${cComplete(c)?" · écouté":""}`,dot:s.color,act:"srCourse",id:c.id}}));
  add("Mes fiches de cours","note",S.fiches.map(f=>{const F=FICHE[f.id]||{};const c=course(f.courseId);const body=(F.md||"")+" "+(F.src||"");return {score:scoreIn(W,f.title+" "+(c?c.title:""),body),title:f.title,meta:c?subj(c.subject).short+" · "+c.title:"",snip:snippet(F.md||F.src,W),dot:c?subj(c.subject).color:"",act:"openFicheFrom",id:f.id}}));
  add("Arrêts et décisions","scale",ARRETS.map(a=>({score:scoreIn(W,a.n+" "+a.th,[a.j,a.d,a.num,a.faits,a.proc,a.theses,a.pb,a.sol,a.portee].join(" ")),title:`${a.n} · ${a.j}, ${a.d}`,meta:a.th,snip:snippet(a.pb+" "+a.sol+" "+a.portee,W),act:"srArret",id:a.id})));
  add("Textes fondamentaux et internationaux","lib",[...TEXTES_FR,...TEXTES_INT].map(t=>({score:scoreIn(W,t[0],t[1]+" "+t[3]+" "+(MAT_RES[t[2]]||"")),title:t[0],meta:t[1],snip:snippet(t[3],W),act:"srRes",id:t[0],href:t[4]||gsearch(t[0]+" texte intégral")})));

}

async function quickAnalyze(){
  const text=($("#qkText")||{}).value||"";UI.qk=UI.qk||{};UI.qk.text=text;
  if(!text.trim()&&!UI.qk.img){toast("Écris ce qui change ou joins une capture.");return}
  UI.qk.loading=true;UI.qk.error="";UI.qk.plan=null;UI.qk.undo=null;render();
  const t=today();
  const evs=allEvents({j:false}).filter(e=>(e.endDate||e.date)>=addDays(t,-30)).slice(0,120).map(e=>`${e.id} | ${e.date}${e.start?" "+e.start:""}${e.end?"-"+e.end:""} | ${e.type} | ${e.subject||"-"} | ${e.title}`).join("\n");
  const prompt=`Tu mets à jour l'agenda d'un étudiant de L1 droit à distance (IED Paris 1). Aujourd'hui : ${t} (${fd(t,{weekday:"long"})}). Année universitaire 2026-2027 : un mois de septembre à décembre sans année = 2026, de janvier à août = 2027 ; « jeudi » = le prochain jeudi à venir.
Matières (id = nom) : ${S.subjects.map(s=>s.id+" = "+s.name).join(" ; ")}
Types possibles : regroupement (obligatoire), permanence (facultative), devoir (à rendre ; heure par défaut 23:59), examen, revision, perso, tache (chose à faire sans horaire).

Agenda actuel (id | date heure | type | matière | intitulé) :
${evs||"(vide)"}

Message de l'étudiant :
« ${text||"(voir l'image jointe : annonce à lire)"} »

Déduis les changements à faire. Si un élément décrit existe déjà (même matière, même type, date proche ou même numéro), MODIFIE-le avec son id au lieu d'en ajouter un doublon. N'invente aucune date absente du message ou de l'image.
Réponds uniquement en JSON :
{"resume":"une phrase","actions":[{"op":"ajouter","type":"regroupement","titre":"Regroupement droit constitutionnel","date":"AAAA-MM-JJ","debut":"HH:MM ou vide","fin":"HH:MM ou vide","matiere":"id ou vide","note":"lien, salle, consigne ou vide"},{"op":"modifier","id":"id existant","date":"AAAA-MM-JJ si changée","debut":"","fin":"","titre":"si changé"},{"op":"supprimer","id":"id existant"}]}`;
  try{
    const opts={modelTier:"default"};if(UI.qk.img)opts.images=[UI.qk.img];
    const v=await aiJSON(prompt,opts);
    const okD=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||""),okH=h=>/^\d{2}:\d{2}$/.test(h||"");
    const actions=((v&&v.actions)||[]).map(a=>({op:a.op,id:a.id||"",type:TYPES[a.type]?a.type:"perso",titre:String(a.titre||"").slice(0,160),date:okD(a.date)?a.date:"",debut:okH(a.debut)?a.debut:"",fin:okH(a.fin)?a.fin:"",matiere:S.subjects.some(s=>s.id===a.matiere)?a.matiere:"",note:String(a.note||"").slice(0,300)}))
      .filter(a=>(a.op==="ajouter"&&a.titre&&(a.date||a.type==="tache"))||((a.op==="modifier"||a.op==="supprimer")&&qkFind(a.id)));
    UI.qk.plan={resume:(v&&v.resume)||"",actions};
  }catch(e){UI.qk.error=aiError(e)}
  UI.qk.loading=false;render();
}
function quickApply(){
  const plan=UI.qk.plan;const chosen=plan.actions.filter((a,i)=>{const c=document.querySelector(`[data-qk="${i}"]`);return !c||c.checked});
  if(!chosen.length){toast("Aucune modification cochée.");return}
  const snap={events:JSON.parse(JSON.stringify(S.events)),official:JSON.parse(JSON.stringify(S.official)),tasks:JSON.parse(JSON.stringify(S.tasks))};
  let n={a:0,m:0,s:0};let firstDate="";
  for(const a of chosen){
    if(a.op==="ajouter"){
      if(a.type==="tache"){S.tasks.push({id:uid(),title:a.titre,due:a.date,subject:a.matiere,done:false})}
      else S.events.push({id:uid(),title:a.titre,date:a.date,start:a.debut||(a.type==="devoir"?"23:59":""),end:a.fin,subject:a.matiere,type:a.type,note:a.note});
      n.a++;firstDate=firstDate||a.date;
    }else if(a.op==="modifier"){
      const ch={};if(a.date)ch.date=a.date;if(a.debut)ch.start=a.debut;if(a.fin)ch.end=a.fin;if(a.titre)ch.title=a.titre;if(a.note)ch.note=a.note;
      if(a.id.startsWith("t:")){const t=S.tasks.find(x=>x.id===a.id.slice(2));if(t){if(ch.date)t.due=ch.date;if(ch.title)t.title=ch.title}}
      else if(isOfficial(a.id)){S.official[a.id]={...(S.official[a.id]||{}),...ch}}
      else{const e=S.events.find(x=>x.id===a.id);if(e)Object.assign(e,ch)}
      n.m++;firstDate=firstDate||a.date;
    }else if(a.op==="supprimer"){
      if(a.id.startsWith("t:"))S.tasks=S.tasks.filter(x=>x.id!==a.id.slice(2));
      else if(isOfficial(a.id))S.official[a.id]={...(S.official[a.id]||{}),hidden:true};
      else S.events=S.events.filter(x=>x.id!==a.id);
      n.s++;
    }
  }
  save("events");save("official");save("tasks");
  const parts=[n.a&&`${n.a} ajout${n.a>1?"s":""}`,n.m&&`${n.m} modification${n.m>1?"s":""}`,n.s&&`${n.s} suppression${n.s>1?"s":""}`].filter(Boolean).join(", ");
  UI.qk={text:"",img:null,plan:null,undo:{snap,label:`Agenda mis à jour : ${parts}.`}};
  if(firstDate){UI.calSel=firstDate;UI.calMonth=firstDate.slice(0,7)}
  render();toast(`Agenda mis à jour : ${parts}.`);
}

const FICHES_BUNDLE=[{"key":"cl-01","course":"c0","subject":"prive","courseTitle":"Les sources du droit","title":"La notion de source du droit","md":"# Fiche : La notion de source du droit\n\n## I. Droit objectif et droits subjectifs\n\n| | Droit objectif | Droits subjectifs |\n|---|---|---|\n| **Définition** | Ensemble des règles de droit, pas seulement les lois votées par le Parlement : toute disposition ayant une valeur normative | Prérogatives individuelles conférées à chaque personne |\n| **Lien** | Il est la source | Ils en découlent |\n\nToute personne a nécessairement des droits subjectifs, car toute personne est apte à être titulaire de droits et d'obligations.\n\n## II. Les caractères de la loi\n\nLa loi est une norme **générale, permanente, abstraite, obligatoire, contraignante**, qui **émane de l'autorité publique**.\n\n- **Réputée connue de tous** grâce à sa publication et souvent à sa codification. D'où la formule : *nul n'est censé ignorer la loi*. On ne peut pas se soustraire à son application, et la méconnaître expose à des sanctions civiles ou pénales.\n- **Contraignante** : son application est sanctionnée par l'autorité publique. Elle impose une obligation ou confère un droit que tous doivent respecter. Le **juge** assure le respect des règles de droit.\n\n### Obligatoire ≠ impérative\n\nLa loi est **toujours obligatoire**, mais elle n'est pas nécessairement **impérative**.\n\n| | Loi impérative | Loi supplétive |\n|---|---|---|\n| **Dérogation par les parties** | Impossible : elle s'impose toujours | Possible |\n| **Domaine** | Lois d'ordre public | Lois qui ne sont pas d'ordre public, donc droits dont les parties ont la libre disposition |\n| **Application** | Toujours | Seulement à défaut de volonté contraire des parties |\n\n**Formule à retenir :** *la loi supplétive ne s'applique que si les parties n'ont pas prévu autre chose dans leur contrat.* On dit qu'elle est **supplétive de volonté**.\n\n**Ordre de priorité :**\n1. On regarde d'abord le contrat.\n2. Si les parties ont réglé le point, leur clause s'applique et la loi supplétive est écartée.\n3. Si le contrat est muet, la loi supplétive s'applique automatiquement.\n\n**Exemple (art. 1651 C. civ.) :** à défaut de clause, le paiement se fait au lieu de la livraison. Si le contrat fixe un autre lieu de paiement, c'est la clause qui joue, et non la loi.\n\n**Pourquoi la loi supplétive reste obligatoire :** c'est la loi elle-même qui permet de l'écarter. Les parties ne violent donc pas la loi, elles utilisent une faculté qu'elle leur reconnaît. Une manifestation de volonté en ce sens est nécessaire pour l'écarter.\n\n**Où la trouve-t-on ?** Surtout en droit des contrats (liberté contractuelle, art. 1102 C. civ.), avec des îlots d'impérativité : conditions de validité, ordre public, protection de la partie faible. Dans les matières touchant à l'ordre public (personnes, famille, droit pénal), c'est l'inverse.\n\n## III. La règle de droit distinguée des autres règles\n\n| Type de règle | Fondement | Sanction | Exemple |\n|---|---|---|---|\n| **Droit** | Autorité publique | Étatique, par le juge | Payer ses impôts, respecter le Code de la route |\n| **Bienséance** | Bonne conduite, marque de respect dans les rapports individuels | Morale et collective (réprobation générale), aucune sanction étatique | Le pourboire au restaurant : non obligatoire mais d'usage |\n| **Morale** | Conscience individuelle | Personnelle et intérieure (ressenti selon les valeurs de chacun) | Ne pas mentir à un ami, tenir une promesse sans valeur juridique |\n| **Religion** | Croyances individuelles | Intérieure, mais la religion impose parfois sa loi dans certaines sociétés | Droit canon sous l'Ancien Régime, pays à religion d'État |\n\nLe droit laïque cohabite parfois avec le droit religieux. Le droit canon a influencé et continue d'influencer notre droit.\n\n## IV. Droit et morale\n\n- **Thèse de Kant :** droit et morale s'opposent par leur **finalité** (sociale pour le droit, individuelle pour la morale) et par leur **sanction** (le droit est sanctionné, pas la morale).\n- **Réponse de Georges Ripert :** la morale imprègne nécessairement le droit.\n- **Nuance :** la contrainte étatique distingue bien les deux. Toute règle de droit n'est pas morale, et toute règle morale n'est pas reprise par le droit. Mais l'autonomie n'est pas totale.\n- **Exemples de références à la morale :**\n  - art. 6 C. civ. : on ne peut déroger aux lois qui intéressent l'ordre public et les bonnes mœurs ;\n  - art. 1104 C. civ. : les contrats doivent être exécutés de bonne foi, notion appréciée au regard de la morale ;\n  - lois de bioéthique de 1994 : expérimentations sur le corps humain, clonage, mères porteuses ;\n  - non-assistance à personne en danger (art. 223-6 C. pén.) : un devoir moral devenu infraction.\n\n**Critère à retenir :** la **contrainte étatique** distingue le droit de la morale. Une même conduite peut être à la fois morale et juridique.\n\n## V. L'origine du droit : naturalisme et positivisme\n\n### A. Les jusnaturalistes (droit naturel)\nLe droit positif relève d'un **droit universel, immuable et supérieur**, lié à la morale et au juste. Le législateur doit s'y conformer.\n\n- **Aristote et Platon** : théorie laïque, le droit naturel est une quête de justice.\n- **Saint Augustin, puis les scolastiques (Saint Thomas d'Aquin)** : droit naturel **religieux**, fondé sur un idéal d'ordre divin. Les Saintes Écritures fondent le caractère obligatoire de la loi.\n- **Grotius** (juriste hollandais) : détache le droit naturel de l'autorité divine.\n- **Pufendorf** : la laïcité du droit s'impose avec les idées qui présidèrent à la Révolution.\n\n### B. Hobbes (charnière)\nIl est à la limite des deux courants, mais rattaché aux positivistes. Il se détache des naturalistes et défend l'idée d'un **droit étatique**. Sa formule : « l'homme est un loup pour l'homme ».\n\n### C. Les positivistes\nLe droit existe **indépendamment** de toute considération sociologique, morale ou religieuse. Il est l'ensemble des règles en vigueur à un moment donné sur un territoire précis.\n\n| Courant | Auteurs | Idée |\n|---|---|---|\n| **Positivisme en général** | Comte, Hegel | S'opposent à l'idéalisme de Saint Thomas d'Aquin et de Grotius |\n| **Positivisme étatique** | Ihering (XIXe), Carré de Malberg (France) | Le droit s'identifie à l'État |\n| **Positivisme sociologique** | Durkheim | Le droit est l'émanation de la société |\n| **Normativisme** (école de Vienne) | Kelsen, *Théorie pure du droit* | Chaque norme tire son autorité de sa conformité à la norme supérieure, qui émane de l'État. Sans État, pas de droit. D'où la **pyramide des normes** |\n\n| | Jusnaturalisme | Positivisme |\n|---|---|---|\n| **Source du droit** | Un idéal supérieur (nature, raison, Dieu) | L'État ou la société |\n| **Question centrale** | Qu'est-ce que le droit *devrait* être (le juste) ? | Qu'est-ce que le droit *est* (règles en vigueur) ? |\n| **Lien avec la morale** | Fort | Séparé |\n\n## VI. La loi, une source parmi d'autres\n\n**Les principales sources du droit :** la Constitution et le bloc de constitutionnalité ; les traités et le droit de l'Union européenne (supérieurs à la loi, art. 55 C.) ; la loi ; le règlement ; la jurisprudence ; la coutume ; la doctrine (autorité plus que source obligatoire).\n\n- **Sens large** du mot loi : toute règle écrite. **Sens strict** : la norme votée par le Parlement, dans le domaine de l'art. 34 C.\n- **Place particulière** : depuis la Révolution, la loi est l'expression de la volonté générale (« légicentrisme ») ; l'art. 5 C. civ. interdit au juge de poser des règles générales.\n- **À nuancer :** la loi n'est plus au sommet. Elle est subordonnée à la Constitution (contrôle du Conseil constitutionnel) et aux traités (contrôle de conventionnalité).\n\n**Formule à retenir :** la loi est la source principale du droit français, mais pas la source unique ni la plus élevée.\n\n## À vérifier dans ton support\n- **« Bubendorff »** : il s'agit de **Pufendorf**.\n- **« Kelzen »** : s'écrit **Kelsen**.\n- Le texte situe Grotius et la laïcité du droit au « XVIIème siècle » dans les deux phrases : la seconde est vraisemblablement le **XVIIIe siècle** (Révolution), à confirmer.\n- « nul n'est censé **ignoré** » : *ignorer*."},{"key":"cl-02","course":"c1","subject":"prive","courseTitle":"L’application des sources du droit","title":"L'interprétation de la loi et le raisonnement judiciaire","md":"# Fiche : L'interprétation de la loi et le raisonnement judiciaire\n\n## I. Les méthodes d'interprétation de la loi\n\n| | École de l'exégèse | École de la libre recherche scientifique |\n|---|---|---|\n| **Époque** | XIXe siècle | Initiée par **Gény**, *Méthode d'interprétation et sources en droit privé positif* (1899) |\n| **Idée centrale** | Seule compte la **volonté du législateur** au moment du vote | Respect de la volonté du législateur **tant que le texte est clair**, libre recherche s'il est incomplet |\n| **Rôle de l'interprète** | Ne donne pas son opinion et n'adapte pas la loi à l'évolution des mœurs | Peut **créer une règle** quand le texte est insuffisant |\n| **Méthode** | Interprétation **logique et grammaticale**, recours aux **travaux préparatoires** et à l'histoire | Recherche **objective** de la solution juridique la plus adéquate (méthode dite sociologique) |\n| **Ambition** | Résoudre tous les problèmes à partir de la loi existante | Refuse de déduire une volonté du législateur qui n'a pas été clairement exprimée |\n\n**Critique de l'exégèse par Gény :** elle accorde trop de place aux **débats parlementaires**, qui reflètent des échanges contradictoires d'idées plus que la pure volonté du législateur.\n\n**Intérêt qui subsiste :** la méthode exégétique aide à comprendre **l'esprit général** dans lequel la loi a été élaborée.\n\n### En résumé simple\n- **Exégèse :** la loi contient déjà toutes les réponses ; le juge est un **lecteur fidèle** qui retrouve le sens voulu par l'auteur.\n- **Libre recherche :** quand le texte est muet, le juge devient un **chercheur** qui construit la solution.\n\n| | Exégèse | Libre recherche |\n|---|---|---|\n| **Si la loi est claire** | On l'applique | On l'applique |\n| **Si la loi est incomplète** | On cherche quand même la volonté du législateur | On crée une règle adaptée |\n| **Source de la solution** | Le législateur | La libre recherche du juge |\n\n## II. Les raisonnements du juge\n\n### A. L'argument *a fortiori* (« à plus forte raison »)\nOn étend la solution d'une règle à une situation **non visée**, car elle y est encore plus justifiée.\n- **Exemple :** les règles de l'art. 373-3 C. civ. (enfant de parents divorcés ou séparés de corps) s'appliquent **à plus forte raison** à l'enfant de parents non mariés (Cass. 1re civ., cassation de la décision d'appel qui refusait la transposition).\n\n### B. L'argument *a pari* (par analogie)\nOn applique une règle à des situations **similaires** non encore prises en compte par un texte.\n\n### C. L'argument *a contrario*\nLe plus fréquent. On déduit d'une règle la solution d'un cas non prévu par le **renversement** de la règle.\n- **Exemple 1 :** l'ancien art. 334-9 interdisait la reconnaissance et la recherche de paternité quand la filiation était établie par la possession d'état. *A contrario*, si elle n'était pas établie par la possession d'état, la reconnaissance ou l'action étaient possibles.\n- **Exemple 2 :** selon l'ancien art. 322, nul ne pouvait contester l'état de celui dont la possession était conforme au titre de naissance. *A contrario*, si la filiation légitime n'était établie que par le titre ou que par la possession d'état, elle pouvait être attaquée. La Cour de cassation a limité ces actions à la **filiation paternelle**, sans remettre en cause la maternité : elle a **poussé très loin** l'argument *a contrario*.\n\n## III. Le syllogisme judiciaire\n\nLe juge doit d'abord **interpréter la loi** (volonté du législateur, travaux préparatoires, autres modes de raisonnement), puis appliquer le droit aux faits.\n\n| Élément | Contenu |\n|---|---|\n| **Majeure** | La **règle de droit** |\n| **Mineure** | Les **faits** constatés par le juge |\n| **Conclusion** | La **décision** (la solution du litige) |\n\n## À vérifier dans ton support\n- Le texte s'arrête après « la majeure est la règle de droit » : la **conclusion** n'y figure pas, elle a été ajoutée.\n- La définition de l'*a fortiori* est confuse dans le texte (« car cela serait surabondant ») : sens classique conservé.\n- Les art. 322 et 334-9 sont d'**anciens** articles, supprimés par la réforme de la filiation de 2005 : ils servent uniquement d'illustrations.\n\n## IV. Bien distinguer les trois raisonnements\n\n| | A fortiori | A pari | A contrario |\n|---|---|---|---|\n| **Cas non visé** | Encore plus justifié que le cas visé | Équivalent au cas visé | Opposé au cas visé |\n| **Formule** | « À plus forte raison » | « Par identité de motifs » | « En sens inverse » |\n| **Solution** | Même solution, étendue | Même solution, transposée | Solution contraire |\n| **Image** | Si 70 km/h est interdit en ville, 90 l'est à plus forte raison | Même raison de décider | « Interdit aux vélos » : un piéton peut entrer |\n\n**Méthode à retenir :** si le texte interdit X dans la situation A, alors, *a contrario*, X est permis dans la situation non-A. La Cour de cassation peut toutefois **adapter** le résultat (exemple de l'ancien art. 322 : action limitée à la paternité, sans toucher à la maternité).\n\n**L'affaire de l'art. 373-3 :** la cour d'appel avait remis automatiquement l'enfant naturel au père, en jugeant l'article inapplicable aux enfants de parents non mariés. La Cour de cassation casse : la règle s'applique *a fortiori*, et le juge devait d'abord rechercher l'**intérêt de l'enfant**. Elle censure la **méthode**, pas forcément le résultat."},{"key":"cl-03","course":"c0","subject":"prive","courseTitle":"Les sources du droit","title":"Le Code civil","md":"# Fiche : Le Code civil\n\n## I. La codification avant la Révolution\n\nLa codification (regrouper des textes de loi en code) **n'est pas une innovation de la Révolution**.\n\n| Date / époque | Texte ou événement |\n|---|---|\n| **438** | Code Théodosien, premier code |\n| **529** | Code Justinien |\n| **Ancien Régime** | Ordonnances dites « Colbert » (procédure et droit commercial), vues par certains comme des précurseurs des codes |\n| **Louis XIV** | Commission de codification |\n| **Révolution** | L'Assemblée Constituante décide la rédaction d'un Code |\n\nMais c'est **après la Révolution** que la première codification d'ensemble voit le jour.\n\n## II. La rédaction du Code civil\n\n**Napoléon n'est pas le rédacteur** du Code, malgré son surnom de « Code Napoléon ». Son mérite est d'avoir nommé une **commission de quatre juristes** : deux issus des **pays de coutumes** et deux des **pays de droit écrit**.\n\n| Rédacteur | Fonction | Zone |\n|---|---|---|\n| **Portalis** | Avocat (Le Beausset, Provence ; avocat à Aix) | Droit écrit |\n| **Maleville** | Membre du tribunal de cassation (Domme, Périgord) | Droit écrit |\n| **Tronchet** | Président du tribunal de cassation (Paris) | Coutumes |\n| **Bigot de Préameneu** | Avocat, puis commissaire du gouvernement (Rennes) | Coutumes |\n\n### Pays de coutumes et pays de droit écrit\n| | Pays de coutumes | Pays de droit écrit |\n|---|---|---|\n| **Localisation** | Nord (Paris, Normandie, Bretagne…) | Sud (Provence, Languedoc, Aquitaine…) |\n| **Source du droit** | **Coutumes** locales, d'abord orales puis rédigées | **Droit romain** (compilation de Justinien) |\n| **Caractère** | Droit morcelé, d'origine germanique et locale | Droit plus uniforme, hérité de Rome |\n\nUne commission **équilibrée** pour réaliser une **synthèse** entre les deux traditions et faire accepter le Code partout.\n\n### Les changements de nom\n- **21 mars 1804** : *Code civil des Français* (achèvement)\n- **1807** : *Code Napoléon*\n- **Restauration** : *Code civil*\n- **Second Empire** : à nouveau *Code Napoléon*\n\n### Chiffres et structure\n- **2283 articles** au départ, plus de **2500** aujourd'hui.\n- Il a **abrogé tout le droit antérieur**.\n\n### Rayonnement\nEn **Europe** puis dans le monde (Amérique latine, Moyen-Orient, Asie). Il existe aujourd'hui **plus d'une centaine de codes**, dont certains ne sont que des **compilations de lois**.\n\n## III. Les principes du Code civil\n\n- **Hérités de la Révolution :** égalité entre les citoyens, laïcité de l'État, liberté et volonté individuelle.\n- **Individualisme libéral :** la **propriété**, consacrée comme le **droit le plus absolu** ; large **liberté contractuelle**, qui écarte les corps intermédiaires.\n- **Personnes et famille :** mariage institution uniquement **civile** ; **divorce** autorisé au nom de la liberté individuelle.\n- **Limites de l'égalité :** la femme longtemps reléguée au statut d'**incapable** ; enfants légitimes privilégiés. De nombreuses lois ont depuis corrigé ces imperfections.\n\n## IV. Le discours de Perben (25 octobre 2004, bicentenaire)\n\nDevant le Conseil de l'Europe :\n- **Influence** sur les systèmes de droit romain, civil ou écrit.\n- **Instrument de politique étrangère** de Napoléon (Allemagne, Pays-Bas, Italie) : abolition des droits féodaux, sécularisation du mariage, légitimation du divorce.\n- **Modernité :** égalité devant la loi (Lumières), fin des privilèges de naissance et de religion.\n- **Capacité d'adaptation :** bioéthique **1994** (le corps humain entre dans le Code), **signature électronique**.\n\n## À retenir pour l'examen\n- Codification **antérieure** à la Révolution, mais premier code **d'ensemble** après elle.\n- **Napoléon** : initiateur (commission de 4 juristes), pas rédacteur.\n- Valeurs : **liberté, égalité, propriété**, avec une limite en droit de la famille.\n\n## À vérifier dans ton support\n- Le cours parle de « quatre parties » (Application des lois, Biens, Personnes, Propriété). Le Code de 1804 comprend en réalité **un titre préliminaire et trois livres** (les personnes ; les biens et les modifications de la propriété ; les manières d'acquérir la propriété).\n- La répartition et les lieux d'origine des rédacteurs sont donnés de mémoire (le cours ne les cite pas) : retiens surtout **2 coutumes / 2 droit écrit**, avec Portalis (Provence) et Tronchet (Paris).\n- D'autres recueils ont précédé le Code Théodosien (codes Grégorien et Hermogénien)."},{"key":"cl-04","course":"c0","subject":"prive","courseTitle":"Les sources du droit","title":"Les sources internationales du droit","md":"# Fiche : Les sources internationales du droit\n\n## I. Les traités internationaux\n\n- **Définition :** accords signés entre plusieurs États.\n- **Négociation et ratification :** pouvoir du **Président de la République**, avec éventuellement l'**autorisation du Parlement**.\n- **Art. 55 de la Constitution :** les traités régulièrement ratifiés ou approuvés ont, dès leur **publication**, une **autorité supérieure à celle des lois**, sous réserve de **réciprocité** (l'autre partie doit aussi les appliquer).\n\n## II. Le droit de l'Union européenne (UE)\n\n### Origine\n- **Traité de Rome du 25 mars 1957** : création de la Communauté économique européenne (CEE).\n- Appelée **Union européenne** depuis le **traité de Maastricht**.\n- **27 États membres** aujourd'hui.\n\n### Deux niveaux de normes\n- **Droit primaire :** les traités.\n- **Droit dérivé :** les textes émanant des institutions de l'Union.\n\n| Acte | Portée | Force obligatoire |\n|---|---|---|\n| **Règlement** | Acte **supranational**, applicable dans **tous** les États membres | Oui |\n| **Directive** | Impose un **résultat à atteindre**, les États choisissent les **moyens** | Oui (quant au résultat) |\n| **Décision** | Destinée à **un État** ou à **un particulier** | Oui |\n| **Avis et recommandations** | Pas de force obligatoire | **Non**, donc pas des sources de droit au sens strict |\n\n### Le contrôle\nLe respect du droit de l'UE est assuré par le **Tribunal** et la **Cour de justice de l'Union européenne** (CJUE), qui sont donc aussi des sources internationales du droit.\n\n## III. Le droit du Conseil de l'Europe\n\n- **Objet :** l'unification et la protection des **droits fondamentaux** des personnes.\n- **Texte principal :** la **Convention européenne des droits de l'homme** (CEDH), du **4 novembre 1950**.\n- **Contrôle :** la **Cour européenne des droits de l'homme**, à Strasbourg.\n\n## IV. Ne pas confondre\n\n| | Union européenne | Conseil de l'Europe |\n|---|---|---|\n| **Texte fondateur** | Traité de Rome (1957), Maastricht | Convention EDH (1950) |\n| **Domaine** | Économique, puis politique | Droits fondamentaux |\n| **Juridiction** | Cour de justice de l'UE (Luxembourg) | Cour EDH (Strasbourg) |\n| **Membres** | 27 États | 46 États (après l'exclusion de la Russie en 2022) |\n\n## À retenir\n- Les traités priment la **loi** (art. 55), mais pas la Constitution.\n- **Règlement :** s'applique directement. **Directive :** fixe un but, les États choisissent comment l'atteindre.\n- **Deux Europes** : l'UE (économique) et le Conseil de l'Europe (droits de l'homme).\n\n## À vérifier dans ton support\n- Le texte dit que les textes dérivés émanent « du Conseil et de l'Union européenne » : il s'agit plutôt du **Conseil, du Parlement européen et de la Commission**.\n- Le **Conseil de l'Europe** n'est **pas** une institution de l'UE.\n- L'autorisation du Parlement n'est requise que pour **certains** traités (art. 53 de la Constitution).\n- Les **décisions** peuvent aussi avoir aujourd'hui une portée plus large que celle indiquée par le cours."},{"key":"cl-05","course":"c0","subject":"prive","courseTitle":"Les sources du droit","title":"La Constitution et les autres sources écrites internes","md":"# Fiche : La Constitution et les autres sources écrites internes\n\n## I. La Constitution\n\n**Rang :** le plus élevé des sources écrites internes, avec les textes à valeur constitutionnelle.\n\n- **Date :** 4 octobre 1958, texte fondateur de la Ve République, modifié plus de vingt fois.\n- **Bloc de constitutionnalité :** elle renvoie à trois textes ayant valeur constitutionnelle.\n\n| Texte | Date |\n|---|---|\n| Déclaration des droits de l'homme et du citoyen | 26 août 1789 |\n| Préambule de la Constitution | 27 octobre 1946 |\n| Charte de l'environnement | 2004 |\n\nLa Charte de l'environnement prévoit à l'art. 1 que chacun a le **droit** de vivre dans un environnement équilibré et respectueux de la santé, et à l'art. 2 que toute personne a le **devoir** de prendre part à sa préservation et à son amélioration.\n\n## II. Le Conseil constitutionnel\n\n**Rôle :** garant du respect de la Constitution. Il vérifie la conformité des lois à la Constitution.\n\n### Composition\n- **9 membres** : 3 nommés par le Président de la République, 3 par le Président de l'Assemblée nationale, 3 par le Président du Sénat.\n- **Membres de droit :** les anciens Présidents de la République.\n- **Siège :** Paris, au Palais-Royal, comme le Conseil d'État.\n\n### Le Comité constitutionnel de 1946 (son prédécesseur)\n\n| | Comité constitutionnel (1946) | Conseil constitutionnel (1958) |\n|---|---|---|\n| **Nature** | Organe **politique** | **Juridiction** |\n| **Composition** | Membres des deux assemblées, présidé par le Président de la République | 9 membres + anciens Présidents |\n| **Rôle** | Dire si une loi votée supposait une **révision** de la Constitution, régler les conflits entre Assemblée et Sénat | Contrôler la **conformité des lois** à la Constitution |\n| **Sanction** | Aucun pouvoir sur la constitutionnalité des textes | Peut censurer |\n| **Activité** | Réuni **une seule fois** | Attributions beaucoup plus importantes |\n\n**Procédure du Comité :** s'il estimait qu'une révision était nécessaire, un nouveau vote avait lieu. Si le Parlement modifiait la loi, pas de révision. S'il maintenait son vote, la loi ne pouvait être promulguée qu'après révision de la Constitution.\n\n### Attributions\n- Apprécier les **domaines respectifs de la loi et du règlement**.\n- Surtout, **statuer sur la conformité des lois** à la Constitution.\n- Intervenir en **matière électorale**.\n\n**Évolution :** la révision du **29 octobre 1974** a élargi la saisine à **60 députés ou 60 sénateurs**. Le Conseil est devenu un **juge de la constitutionnalité** de la loi. Il ne relève ni de l'ordre judiciaire ni de l'ordre administratif.\n\n### Les modes de saisine (version corrigée)\n\n| Texte contrôlé | Contrôle | Base | Qui saisit |\n|---|---|---|---|\n| **Lois organiques** | **Obligatoire**, avant promulgation | Art. 46 (dernier al.) et art. 61, al. 1 | Le **Premier ministre** (ordonnance de 1958 et pratique, pas la Constitution) |\n| **Règlements des assemblées** | **Obligatoire** | Art. 61, al. 1 | Le **président de l'assemblée concernée** (pratique) |\n| **Propositions de loi référendaires (art. 11)** | **Obligatoire** | Art. 61, al. 1 | |\n| **Lois ordinaires** | **Facultatif**, avant promulgation | Art. 61, al. 2 | Président de la République, Premier ministre, présidents de l'Assemblée ou du Sénat, **60 députés ou 60 sénateurs** |\n| **Traités internationaux** | **Facultatif**, avant ratification | Art. 54 (60 parlementaires depuis 1992) | Les mêmes autorités qu'à l'art. 61, al. 2 |\n| **Contentieux électoral** | Selon les cas | | Préfets, candidats, électeurs |\n\n**Art. 54 :** si le Conseil déclare qu'un engagement international comporte une clause contraire à la Constitution, l'autorisation de le ratifier ne peut intervenir qu'**après révision de la Constitution**.\n\n**Pour l'examen :** le **caractère obligatoire** du contrôle vient de la Constitution (art. 46 et 61, al. 1) ; la **désignation du Premier ministre** comme auteur de la saisine des lois organiques vient des textes d'application.\n\n### La QPC (question prioritaire de constitutionnalité)\n- Introduite par la révision du **23 juillet 2008** (art. 61-1).\n- Un justiciable peut contester la constitutionnalité d'une loi **à l'occasion d'un procès**.\n- Le Conseil est saisi sur renvoi du **Conseil d'État** ou de la **Cour de cassation** lorsqu'il est soutenu qu'une disposition législative porte atteinte aux **droits et libertés garantis par la Constitution**.\n\n## III. La loi\n\n- **Définition :** règle de droit **votée par le Parlement**.\n- **Contrôle :** sa conformité à la Constitution est appréciée par le Conseil constitutionnel.\n- **Domaine :** l'**art. 34** fixe les matières réservées à la loi.\n\n| Domaines de l'art. 34 (exemples) | |\n|---|---|\n| **Personnes et libertés** | Droits civiques, libertés publiques, médias, nationalité, état et capacité des personnes |\n| **Droit civil** | Régimes matrimoniaux, successions et libéralités, propriété, droits réels, obligations civiles et commerciales |\n| **Pénal** | Crimes et délits et peines, procédure pénale, amnistie |\n| **Justice** | Création de nouveaux ordres de juridiction, statut des magistrats |\n| **Finances** | Assiette, taux et recouvrement des impositions, émission de la monnaie |\n| **Élections et collectivités** | Régime électoral, libre administration des collectivités territoriales |\n| **Économie et social** | Nationalisations, droit du travail, droit syndical, sécurité sociale |\n| **Autres** | Défense nationale, enseignement, environnement, garanties des fonctionnaires |\n\n## IV. Le règlement\n\n- **Principe :** toute matière **hors du domaine de la loi** est de nature réglementaire (**art. 37**).\n- **Auteur :** le **pouvoir exécutif**.\n- **Formes :** décrets du Président ou du Premier ministre, arrêtés ministériels, préfectoraux ou municipaux.\n- **Attention :** les décrets concernant une **situation individuelle** (nomination) ne sont pas des règles de droit.\n\n## V. Les ordonnances (art. 38)\n\nLe gouvernement peut demander au Parlement l'autorisation de prendre par ordonnances des mesures **normalement du domaine de la loi**.\n\n## À retenir pour l'examen\n- **Hiérarchie :** Constitution, puis traités, puis loi, puis règlement.\n- Le **Conseil constitutionnel** contrôle la loi par rapport à la Constitution ; la QPC (2008) permet aux justiciables de provoquer ce contrôle.\n- **Loi (art. 34) / règlement (art. 37) :** la loi a un domaine **limité**, le règlement a le reste.\n\n## À vérifier dans ton support\n- Le texte cite l'**art. 8** pour dire que les matières hors loi sont réglementaires : c'est l'**art. 37**.\n- Le texte cite l'**art. 61-2** pour les lois ordinaires : il s'agit de l'**art. 61, alinéa 2** ; la QPC relève de l'**art. 61-1**.\n- Le cours omet les 60 parlementaires pour les traités (art. 54, depuis 1992).\n- Fautes du texte d'origine : « sujétions » (et non « suggestions »), « garantit », « chacun **a** le droit », « peut » (et non « put »)."},{"key":"cl-06","course":"c1","subject":"prive","courseTitle":"L’application des sources du droit","title":"Les sources non écrites et conventionnelles du droit","md":"# Fiche : Les sources non écrites et conventionnelles du droit\n\n## PARTIE A : Les sources internes non écrites (section 6)\n\nLa France est un pays de droit écrit, mais deux sources non écrites y ont une place importante : la **coutume** et les **principes généraux du droit** (le doyen Carbonnier parle de « coutume d'origine savante », qui englobe les maximes juridiques).\n\n### I. La coutume\n\n**Définition :** règle de conduite qui se dégage **lentement et spontanément** des pratiques habituellement suivies dans un milieu social donné, et qui devient **obligatoire** indépendamment de toute intervention du législateur.\n\n- L'une des plus anciennes sources du droit.\n- Son rôle a **nettement reculé depuis la Révolution**, mais elle reste une source incontestable.\n\n| Élément | Contenu |\n|---|---|\n| **Matériel** | Une pratique, un usage habituellement suivi |\n| **Psychologique** | La population (ou une partie) la considère comme **obligatoire** |\n\n**Coutume et usage :** la distinction est surtout faite en **droit commercial**. Les usages peuvent être **généraux**, limités à une **branche** ou une **profession**, ou **locaux**.\n\n| Type | Sens | Valeur |\n|---|---|---|\n| **Secundum legem** | La loi **renvoie** à la coutume | Aucun problème : la loi reconnaît sa valeur |\n| **Praeter legem** | Elle naît **hors de la loi**, dans un domaine non légiféré | Valeur propre, sans consécration légale |\n| **Contra legem** | Elle naît **contre la loi** | Elle **s'efface devant la loi** |\n\n- **Exemple secundum legem :** les conventions obligent à toutes les suites que **l'usage ou l'équité** commandent (ancien art. 1135, aujourd'hui art. 1194).\n- **Pourquoi la coutume contra legem cède :** **une loi ne peut pas être abrogée par désuétude**.\n\n### II. Les sources « controversées »\n\n#### A. La jurisprudence (source **indirecte**)\n\n| Article | Règle |\n|---|---|\n| **Art. 5 C. civ.** | Le juge ne peut pas statuer **par voie de disposition générale et réglementaire** : interdiction de légiférer |\n| **Art. 4 C. civ.** | Le juge doit statuer, sous peine de **déni de justice**, même si la loi est insuffisante, obscure ou absente |\n\n**Conséquence :** en interprétant une loi obscure, le juge y **ajoute** nécessairement et participe à la création du droit.\n\n**Limites :** pas de valeur de **précédent** ; **autorité relative**, limitée au litige jugé ; **séparation des pouvoirs**.\n\n**Mais :** une solution de la **Cour de cassation** est souvent reprise par les autres juridictions : elle « fait jurisprudence ».\n\n#### B. La doctrine\n\n- **Définition :** l'ensemble des opinions de juristes éminents (professeurs, magistrats, avocats).\n- **Valeur normative :** très discutable.\n- **Rôle indirect :** elle influence le **juge** et le **législateur**.\n\n## PARTIE B : Les sources conventionnelles (le contrat)\n\n### I. Actes et faits juridiques\n\n| | Définition | Exemples |\n|---|---|---|\n| **Actes juridiques** | Manifestations de **volonté** destinées à produire des effets de droit | Contrats, actes unilatéraux (testaments) |\n| **Faits juridiques** | Événements qui produisent des effets de droit indépendamment de la volonté de leur auteur quant à ces effets | Délits, quasi-délits |\n| **Quasi-contrats** | Faits volontaires aux effets proches d'un contrat | Gestion d'affaires, paiement de l'indu, enrichissement injustifié |\n\n### II. Le contrat, source de droit\n\n- **Définition (art. 1101) :** accord de volontés entre deux ou plusieurs personnes destiné à **créer, modifier, transmettre ou éteindre** des obligations.\n- **Force obligatoire (art. 1103) :** les contrats légalement formés **tiennent lieu de loi** à ceux qui les ont faits.\n- **Effet à l'égard des tiers :** les **conventions collectives** s'imposent à des personnes qui ne les ont pas signées (droit du travail).\n\n### III. Le consensualisme et la liberté contractuelle\n\nLes parties sont libres de **contracter ou non**, et de **fixer le contenu** du contrat.\n\n### IV. Les limites à la liberté contractuelle\n\n| Limite | Contenu | Exemples |\n|---|---|---|\n| **Liberté de contracter** | Contrats **obligatoires** | Assurance automobile, habitation |\n| **Formes** | **Acte authentique** exigé | Contrat de mariage, hypothèque |\n| **Contrats d'adhésion** | Contenu imposé par des professionnels | Contrats types |\n| **Contenu imposé** | Clauses imposées ou interdites pour protéger la partie faible | **Délai de rétractation** |\n| **Clauses abusives** (depuis **1978**) | **Déséquilibre significatif** au détriment du consommateur | Suppression du droit à réparation, modification unilatérale |\n| **Ordre public (art. 6)** | On ne déroge pas aux lois d'ordre public et aux bonnes mœurs | |\n\n### V. Le rôle du juge face au contrat\n\n**Principe :** le juge est un **tiers au contrat** ; il fait exécuter le contrat comme une loi.\n\n| Situation | Pouvoir du juge |\n|---|---|\n| **Clause claire et précise** | Il doit l'appliquer ; la Cour de cassation **censure** la **dénaturation** |\n| **Clauses obscures ou contradictoires** | Il doit **interpréter** : **pouvoir souverain** des juges du fond |\n\n**Directives d'interprétation :** commune intention des parties ; sens qui fait **produire effet** à la clause ; clauses lues **les unes par rapport aux autres** ; **but du contrat** ; **usages**.\n\n**Le juge peut aussi modifier le contrat :**\n- **Clause pénale (art. 1231-5)** : la **modérer ou l'augmenter** si elle est manifestement excessive ou dérisoire.\n- **Délais de grâce** au débiteur.\n- **Arrêt Chronopost** (Cass. com., **22 octobre 1996**) : la clause limitative de responsabilité qui contredit la portée de l'**obligation essentielle** (délai de livraison) est **réputée non écrite** (aujourd'hui art. 1170).\n\n## À retenir pour l'examen\n- **Trois blocs de sources** : écrites, non écrites, conventionnelles.\n- **Coutume** : élément matériel + psychologique ; *secundum*, *praeter*, *contra legem*.\n- **Jurisprudence** : art. 5 (pas d'arrêts de règlement) contre art. 4 (pas de déni de justice).\n- **Contrat** : art. 1101 et 1103, avec des limites (ordre public, formalisme, clauses abusives).\n\n## À vérifier dans ton support\n- **Art. 1135** : depuis 2016, **art. 1194**. **Art. 1103** : « les contrats **légalement formés** ».\n- **Consensualisme** : au sens strict, formation par le **seul échange des consentements** (art. 1172) ; le cours l'emploie au sens de liberté contractuelle.\n- **Quasi-contrats** : depuis 2016, gestion d'affaires, paiement de l'indu, enrichissement injustifié.\n- **Interprétation** : « quand une clause est susceptible de deux sens » (art. 1191), pas une loi.\n- **Contrats d'adhésion** : ils concernent surtout le **contenu** imposé.\n- **Chronopost** : solution reprise par l'**art. 1170**.\n- **Section 7** : intitulé déduit de la phrase de transition du cours."},{"key":"cl-07","course":"c1","subject":"prive","courseTitle":"L’application des sources du droit","title":"L'élaboration, la promulgation et la publication de la loi","md":"# Fiche : L'élaboration, la promulgation et la publication de la loi\n\n## I. Le vote de la loi par le Parlement\n\n| Texte | Qui le dépose |\n|---|---|\n| **Projet de loi** | Le **gouvernement** |\n| **Proposition de loi** | Un **parlementaire** |\n\n**Procédure :** l'Assemblée nationale et le Sénat votent tous deux le texte. **La navette** : allers-retours entre les deux chambres ; en cas de **désaccord**, l'**Assemblée nationale statue définitivement** à la fin de la navette.\n\n## II. La promulgation et la publication\n\n| Étape | Auteur | Rôle |\n|---|---|---|\n| **Promulgation** | **Président de la République** | Constate que la loi est définitivement adoptée et ordonne son exécution |\n| **Publication** | **Journal officiel (JO)** | Porte la loi à la connaissance de tous |\n\n## III. L'entrée en vigueur\n\n**Règle actuelle (ordonnance du 20 février 2004) :** la loi entre en vigueur le **lendemain de sa publication au JO**.\n\n| | Avant 2004 | Depuis 2004 |\n|---|---|---|\n| **Paris** | Un **jour franc** après la parution au JO | Le **lendemain** de la publication |\n| **Province** | Un jour franc à partir du lendemain de l'arrivée du JO au **chef-lieu d'arrondissement** | Le **lendemain** de la publication (règle unique) |\n\nÀ partir de cette date, la loi devient **obligatoire** et est réputée connue de tous (*nul n'est censé ignorer la loi*).\n\n## IV. Les autres moyens de faire connaître le droit\n\n### Légifrance (décret du 7 août 2002)\nService public de diffusion du droit par internet : textes normatifs (constitutions, lois, règlements, conventions internationales), **codes**, **jurisprudence** constitutionnelle, administrative et judiciaire, **dossiers législatifs**.\n\n### Le répertoire des portails juridiques\nAssociation **Henri Capitant**, bibliothèque **Cujas**, **Droit en ligne**, **Village de la justice**.\n\n### La diffusion de la jurisprudence\n| Juridiction | Publication |\n|---|---|\n| **Cour de cassation** | Bulletin des arrêts de la Cour de cassation |\n| **Conseil d'État** | **Recueil Lebon** |\n\n## À retenir pour l'examen\n- **Projet** de loi (gouvernement) ≠ **proposition** de loi (parlementaire).\n- Chaîne : **vote**, **promulgation** (Président), **publication** (JO), **entrée en vigueur** (lendemain).\n- Réforme de **2004** : fin du jour franc, entrée en vigueur unique.\n- **Légifrance** (2002). **Recueil Lebon** : Conseil d'État.\n\n## À vérifier dans ton support\n- **Navette (art. 45 C.) :** en cas de désaccord, **commission mixte paritaire** (7 députés, 7 sénateurs) ; si elle échoue, nouvelle lecture puis **lecture définitive** à l'Assemblée. En **procédure accélérée**, une seule lecture par chambre suffit avant la CMP.\n- **Promulgation :** dans les **15 jours** (art. 10 C.) ; le Président peut demander une **nouvelle délibération**, et le Conseil constitutionnel peut être saisi.\n- **Entrée en vigueur :** principe à l'**art. 1er C. civ.** ; la loi peut fixer elle-même une autre date.\n- **JO électronique :** depuis le **1er janvier 2016**, la version sur Légifrance fait foi."},{"key":"cl-08","course":"c1","subject":"prive","courseTitle":"L’application des sources du droit","title":"La connaissance de la loi","md":"# Fiche : La connaissance de la loi (Section 2)\n\n## I. Le principe : la présomption de connaissance de la loi\n\nVu les modalités de diffusion (JO, Légifrance), la loi est **censée être connue de tous** : *nul n'est censé ignorer la loi*.\n\n| Texte historique | Contenu |\n|---|---|\n| **Art. 4 du décret du 5 novembre 1870** | Les tribunaux pouvaient accueillir l'**exception d'ignorance** si la contravention avait eu lieu dans les **3 jours francs** suivant la promulgation |\n| **Art. 65 de l'ancien Code pénal** | Aucun crime ou délit ne peut être excusé, sauf dans les cas prévus par la loi |\n\n- La présomption est **irréfragable en principe** : on ne peut pas prouver qu'on ignorait la loi.\n- **Conséquence :** l'ignorance ou l'erreur de droit n'est **pas une cause d'exclusion de la peine**.\n- Elle reste **relative**, car elle connaît **deux exceptions**.\n\n## II. Les deux exceptions\n\n### A. En droit civil : l'erreur de droit\n- L'**erreur de droit est assimilée à l'erreur de fait** (aujourd'hui art. 1132 C. civ., erreur **excusable**).\n- Celui qui, **de bonne foi**, s'est placé hors de la loi peut obtenir l'**annulation d'un acte pour vice du consentement**.\n- **Exemple :** Cass. 3e civ., **5 juillet 1995**, annulation pour erreur d'une vente consentie au profit d'une personne à qui le bénéfice d'un **droit de préemption** avait été faussement reconnu.\n\n**Le mariage putatif (art. 201-202 C. civ.)**\n\n| Étape | Contenu |\n|---|---|\n| **Principe** | Conditions non respectées : mariage nul (nullité **absolue** ou **relative**) |\n| **Effet** | Anéanti **rétroactivement** |\n| **Limite** | Mariage dit **putatif** à l'égard des époux de **bonne foi** (qui ignoraient la cause de nullité) |\n| **Effets maintenus** | Nationalité, usage du nom du conjoint, règles du régime patrimonial pour la liquidation |\n\n### B. En droit pénal : l'erreur sur le droit\n- **Ancien système :** décret de 1870, **abrogé par l'ordonnance du 20 février 2004**.\n- **Art. 122-3 du Code pénal :** n'est pas pénalement responsable la personne qui justifie avoir cru, par une **erreur sur le droit qu'elle n'était pas en mesure d'éviter**, pouvoir légitimement accomplir l'acte.\n\n**Conditions :** prouver son impossibilité de connaître la loi ; erreur **invincible**, donc **non fautive** ; avoir **tout fait pour se renseigner**.\n\n**Exemple (Cass. crim., 11 mai 2004) :** un salarié copie des documents comptables pour s'en servir devant les prud'hommes ; informé **par son avocat** des limites jurisprudentielles, il ne peut pas invoquer l'erreur de droit. La cour d'appel avait violé l'art. 122-3.\n\n## III. Le domaine de la présomption\n\n**Quels actes ?** Tous les textes **normatifs régulièrement publiés** (lois, ordonnances, décrets, arrêtés). **CE, 19 juin 1959 :** tous les actes réglementaires publiés au JO, même si leur publication n'était pas obligatoire. La présomption couvre aussi l'**entrée en vigueur** et l'**interprétation** du texte.\n\n| Situation | Solution |\n|---|---|\n| **Territoire** | Tout le territoire français, et seulement lui |\n| **Français résidant à l'étranger** | Soumis à la loi du jour où ils en ont effectivement connaissance |\n| **Personnes résidant en France** | Présumées connaître la loi |\n| **Étrangers en France** | Ne peuvent pas invoquer leur ignorance |\n| **Âge, condition, vulnérabilité** | N'écartent pas la présomption |\n\n## À retenir pour l'examen\n- **Principe :** *nul n'est censé ignorer la loi*.\n- **Deux exceptions :** erreur de droit en **droit civil** (vice du consentement, mariage putatif) et **art. 122-3 C. pén.** (erreur invincible).\n- **Transition :** connaître la loi ne dit pas **quelle loi s'applique** : c'est l'application de la loi dans le temps.\n\n## À vérifier dans ton support\n- Le cours dit la présomption « irréfragable » puis « relative » : irréfragable **en principe**, avec des exceptions.\n- « Décret du 5 novembre **1970** » : lire **1870**.\n- Art. 122-3 : lire **irresponsabilité** pénale.\n- Arrêt de 2004 : « production de **peine** » est probablement « production de **pièces** ».\n- La règle sur les Français à l'étranger est simplifiée : à confirmer en TD."},{"key":"cl-09","course":"c1","subject":"prive","courseTitle":"L’application des sources du droit","title":"L'application de la loi dans le temps","md":"# Fiche : L'application de la loi dans le temps (Section 3)\n\n## I. Le principe : la non-rétroactivité (art. 2 C. civ.)\n\n**Art. 2 :** « la loi ne dispose que pour l'avenir, elle n'a pas d'effet rétroactif ».\n\n- **Origine :** réaction contre les **lois rétroactives de la Révolution** (loi du **6 janvier 1794** sur les successions).\n- **Fondement :** la **sécurité juridique**.\n- **Limite :** l'art. 2 ne dit pas comment traite
